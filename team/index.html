<style>
/* Layout: рабочая панель проекта — шапка с леопардовой полосой, слева разделы, справа рабочая зона; на телефоне разделы уходят в горизонтальную ленту. */
:root{
  --bg:#EFF4EE; --surface:#FFFFFF; --sunk:#E5ECE4; --ink:#14211A; --muted:#5A6B61; --line:#D6E0D6;
  --leaf:#2D6A4A; --leaf-soft:#DCEBE1; --ochre:#B97F22; --ochre-soft:#F5E6C8; --lagoon:#23808D; --lagoon-soft:#D5ECEE;
  --spot:#1D1610; --danger:#A8402F; --danger-soft:#F6DCD6; --shadow:0 1px 2px rgba(20,33,26,.06),0 8px 24px rgba(20,33,26,.06);
  --f-display:"Unbounded","Onest",system-ui,sans-serif; --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1611; --surface:#16211A; --sunk:#111B15; --ink:#E6EDE7; --muted:#97A89D; --line:#26352C;
  --leaf:#72B892; --leaf-soft:#1D3327; --ochre:#E0A84C; --ochre-soft:#3A2D16; --lagoon:#5FBBC6; --lagoon-soft:#16333A;
  --spot:#0B0805; --danger:#E58A78; --danger-soft:#3D1F19; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1611; --surface:#16211A; --sunk:#111B15; --ink:#E6EDE7; --muted:#97A89D; --line:#26352C;
  --leaf:#72B892; --leaf-soft:#1D3327; --ochre:#E0A84C; --ochre-soft:#3A2D16; --lagoon:#5FBBC6; --lagoon-soft:#16333A;
  --spot:#0B0805; --danger:#E58A78; --danger-soft:#3D1F19; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--lagoon)}
:focus-visible{outline:2px solid var(--lagoon);outline-offset:2px;border-radius:6px}

/* шапка */
.top{position:relative;overflow:hidden;background:var(--ochre);color:#1D1610}
#leo{position:absolute;inset:0;width:100%;height:100%;display:block}
.top-in{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;
  padding-block:28px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
.brand{background:rgba(255,248,234,.92);border-radius:14px;padding:12px 18px 14px;box-shadow:0 6px 30px rgba(29,22,16,.25)}
.brand .word{font:700 clamp(28px,5vw,44px)/1 var(--f-display);letter-spacing:-.01em;color:#1D1610}
.brand .sub{margin-top:6px;font:500 12px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#5b4a35}
.count{background:#1D1610;color:#F7EBD3;border-radius:14px;padding:12px 18px;display:flex;gap:14px;align-items:center}
.count b{font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums;color:#F0B451}
.count span{font-size:13px;line-height:1.3}

/* каркас */
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;
  padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:2px}
.navgroup{font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
nav.side a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none}
nav.side a:hover{background:var(--sunk)}
nav.side a[aria-current="page"]{background:var(--spot);color:#F7EBD3}
nav.side a[aria-current="page"] .n{color:#F0B451}
.n{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
main{min-width:0}

/* заголовок раздела */
.head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px 20px;margin-bottom:6px}
h1{font:500 clamp(22px,3vw,30px)/1.15 var(--f-display);margin:0;text-wrap:balance}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ochre);margin-bottom:10px}
.intro{max-width:70ch;color:var(--muted);margin:10px 0 0}
.intro p{margin:0 0 8px}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--spot);border-color:var(--spot);color:#F7EBD3}
.btn.primary:hover{background:#3a2a1c}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 10px}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* фильтры */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:22px 0 14px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.search{flex:1 1 200px;max-width:320px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px}

/* группы и карточки */
.group{margin-top:26px}
.group h2{font:500 12px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;gap:10px;align-items:center}
.group h2::after{content:"";flex:1;height:1px;background:var(--line)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:start}
.item.nodate{grid-template-columns:minmax(0,1fr) auto}
.date{font:500 12px/1.2 var(--f-mono);color:var(--muted);min-width:52px;padding-top:3px;font-variant-numeric:tabular-nums}
.date b{display:block;font:500 18px/1 var(--f-display);color:var(--ink)}
.date.late b{color:var(--danger)}
.it-title{font-weight:600;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font:500 11px/1 var(--f-mono);padding:4px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{border:0;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.pill[disabled]{cursor:default}
.t0{background:var(--sunk);color:var(--muted)} .t1{background:var(--lagoon-soft);color:var(--lagoon)} .t2{background:var(--ochre-soft);color:var(--ochre)} .t3{background:var(--leaf-soft);color:var(--leaf)} .t4{background:var(--danger-soft);color:var(--danger)}
.row-btns{display:flex;gap:2px}
.body{grid-column:1/-1;color:var(--ink);margin-top:6px;overflow-wrap:anywhere}
.item:not(.nodate) .body{grid-column:2/-1}
.body p{margin:0 0 8px} .body ul{margin:0 0 8px;padding-left:20px} .body li{margin:2px 0}
.tbl{overflow-x:auto;margin:4px 0 12px;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
.tbl table{border-collapse:collapse;width:100%;font-size:12.5px;line-height:1.45}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:7px 9px;border-bottom:1px solid var(--line);min-width:110px;max-width:280px}
.tbl th{background:var(--sunk);font-weight:600;position:sticky;top:0}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child,.tbl th:first-child{font-weight:600;min-width:130px}
.body h4{font:600 13px/1.3 var(--f-body);margin:12px 0 4px;color:var(--ochre)}
.body.clamp{max-height:7.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
.more{grid-column:1/-1;justify-self:start;background:none;border:0;color:var(--lagoon);cursor:pointer;padding:2px 0;font-size:13px}
.item:not(.nodate) .more{grid-column:2/-1}
.mono{font-family:var(--f-mono);font-size:13px;white-space:pre-wrap}

/* обзор */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--muted)}
.tile b{font:500 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:12.5px}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;margin-top:8px}
.passport{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pp{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.pp:first-child{border-top:0}
.pp dt{font:500 12px/1.5 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pp dd{margin:0;overflow-wrap:anywhere}
.pp dd p{margin:0 0 4px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}

.empty{border:1px dashed var(--line);border-radius:12px;padding:26px 20px;color:var(--muted);text-align:left;background:color-mix(in srgb,var(--surface) 50%,transparent)}
.empty strong{display:block;color:var(--ink);margin-bottom:4px}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.banner{border-radius:10px;padding:10px 14px;background:var(--ochre-soft);color:var(--ink);font-size:14px;margin-bottom:16px}

/* модалка */
dialog{border:0;border-radius:16px;padding:0;width:min(640px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(14,22,17,.55)}
.dlg{padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px;max-height:calc(100dvh - 40px);overflow:auto}
.dlg h3{font:500 18px/1.2 var(--f-display);margin:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;font-size:15px;width:100%}
.f textarea{min-height:150px;resize:vertical;line-height:1.5}
.dlg-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding-top:4px}
.dlg-foot .r{display:flex;gap:8px;margin-left:auto}
.hint{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--spot);color:#F7EBD3;padding:10px 16px;border-radius:999px;font-size:14px;z-index:50}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px;padding-top:12px}
  nav.side{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-direction:row;overflow-x:auto;background:var(--bg);padding-block:8px;margin-inline:-4px;scrollbar-width:none}
  .navgroup{display:none}
  nav.side a{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .fgrid{grid-template-columns:1fr}
  .pp{grid-template-columns:minmax(0,1fr) auto}
  .pp dt{grid-column:1/-1}
  .item{grid-template-columns:minmax(0,1fr) auto}
  .item .date{grid-column:1/-1;display:flex;gap:6px;align-items:baseline}
  .date b{display:inline;font-size:15px}
  .item:not(.nodate) .body,.item:not(.nodate) .more{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script type="application/json" id="snapshot">{"generatedAt":"2026-11-10T10:17:04+00:00","items":[{"id":"asset-01","body":"Клиент сам предложил прислать.","group":"От клиента","order":10,"section":"assets","status":"Запросить","title":"Логотип в SVG и PNG"},{"id":"asset-02","body":"Клиент писал, что прикладывает. Проверьте, дошёл ли файл, и вставьте сюда ссылку.","group":"От клиента","order":20,"section":"assets","status":"Запросить","title":"Мудборд интерьера"},{"id":"asset-03","body":"Круг с леопардовым принтом, надпись «Māори» чёрным рукописным шрифтом.","group":"От клиента","link":"https://www.instagram.com/maori.lounge/","order":30,"section":"assets","status":"Получено","title":"Аватар с леопардовым принтом"},{"id":"asset-04","body":"Для контента используем только фрагменты: владелец не хочет раскрывать интерьер до открытия.","group":"От клиента","order":40,"section":"assets","status":"Запросить","title":"Рендеры или планировка зала"},{"id":"asset-05","group":"От клиента","order":50,"section":"assets","status":"Запросить","title":"Меню и барная карта (черновики)"},{"id":"asset-06","group":"От клиента","order":60,"section":"assets","status":"Запросить","title":"Фото униформы и обивки в леопарде"},{"id":"asset-07","body":"Пришлёт Женя. По нему команда собирает вопросы к владельцу.","group":"От команды","order":70,"section":"assets","status":"Запрошено","title":"Шаблон стратегии"},{"id":"asset-08","group":"Ссылки","link":"https://www.instagram.com/maori.lounge/","order":80,"section":"assets","status":"Получено","title":"Instagram @maori.lounge"},{"id":"aud-01","body":"**Что сказал владелец:** активная аудитория с 18 лет, строго 18+, ядро 22–28. Вузы как канал — ок.\n**Что проверить:** средний чек, частота, куда ходят сейчас.\n**Где искать:** вузы Рязани, студенческие паблики.","order":10,"section":"audience","status":"Проверяем","title":"Студенты и зумеры"},{"id":"aud-02","body":"**Что сказал владелец:** первые 4–5 часов работы — только ближний трафик офисов (парковки нет). Им — скорость отдачи блюд, позже предзаказ через приложение. Считает, что офисы придут сами, поэтому только лифты/баннеры в БЦ, без подарков и купонов.\n**Рядом:** свой БЦ, БЦ «Капитал», офис МТС.","order":20,"section":"audience","status":"Подтверждено","title":"Офисные сотрудники по соседству"},{"id":"aud-03","body":"**Что сказал владелец:** с 18:00 — классическая лаунж-посадка: поболтать, кальян, немного консолей. Тихо, без танцев.","order":30,"section":"audience","status":"Подтверждено","title":"Компании друзей на вечер"},{"id":"aud-04","body":"**Почему:** тёплый уют, тропический вайб, аквариум.\n**Что проверить:** есть ли камерные зоны, сценарии свидания, средний чек на двоих.","order":40,"section":"audience","status":"Гипотеза","title":"Пары на свидание"},{"id":"aud-05","body":"**Почему:** двухметровый леопард и аквариум — сильные инста-объекты.\n**Что проверить:** кто приходит фотографироваться и как превратить их в гостей с заказом.","order":50,"section":"audience","status":"Проверяем","title":"Гости, которые приходят ради фото"},{"id":"aud-06","body":"**Данные владельца:** по статистике Instagram и VK прошлых проектов ~70% — девушки.\n**Сценарий:** приходят с подругами покурить кальян и поговорить: кофе в будни, коктейли в пт/сб. Выбирают за эстетику и чистоту.\n**Следствие:** за ними приходят парни (замкнутый круг). Контент и продвижение делаем в первую очередь для них: эстетика, леопард, фото.","order":5,"section":"audience","status":"Подтверждено","title":"Девушки с подругами — главная аудитория"},{"id":"aud-07","body":"18–35, идут за стабильным качеством кальяна и туда, где красиво и где сидят девушки. Часть — постоянники прошлых проектов владельца.","order":6,"section":"audience","status":"Подтверждено","title":"Парни за кальяном"},{"id":"bb-01","body":"Стоит в описании Instagram. На брифе выясняем, что именно будет иначе.","group":"Основа","order":10,"section":"brandbook","status":"Факт от клиента","title":"Слоган «Здесь будет иначе»"},{"id":"bb-02","body":"Большой коктейльный бар, азиатско-европейская кухня, кальяны.","group":"Основа","order":20,"section":"brandbook","status":"Факт от клиента","title":"Прежде всего лаунж, но и полноценный ресторан"},{"id":"bb-03","body":"Это не реконструкция культуры маори, а тёплый вымышленный остров. Рамки описаны в статье базы «Культурная чувствительность».","group":"Основа","order":30,"section":"brandbook","status":"Факт от клиента","title":"Островная тема, близкая по духу Полинезии"},{"id":"bb-04","body":"Униформа персонала, обивка мебели, детали. Предлагаем правило: на светлой базе принт занимает 10–20% поверхности.","group":"Визуал","order":40,"section":"brandbook","status":"Факт от клиента","title":"Леопардовый принт — главная фишка айдентики"},{"id":"bb-05","body":"Проект очень светлый по оттенкам. Детали — в мудборде клиента.","group":"Визуал","order":50,"section":"brandbook","status":"Факт от клиента","title":"Светлая база интерьера"},{"id":"bb-06","body":"Банановые листья и другие тропические растения.","group":"Визуал","order":60,"section":"brandbook","status":"Факт от клиента","title":"Тропическая зелень"},{"id":"bb-07","body":"Остался от прежних владельцев, в нём много рыб. Вместе с зеленью связывает проект с островной темой.","group":"Визуал","order":70,"section":"brandbook","status":"Факт от клиента","title":"Аквариум на 6 метров"},{"id":"bb-08","body":"По аватару: чёрная рукописная надпись на круге с леопардовым принтом. Исходники в SVG и PNG запрашиваем у клиента.","group":"Визуал","order":80,"section":"brandbook","status":"Факт от клиента","title":"Логотип: «Māори» рукописным шрифтом"},{"id":"bb-09","body":"Светлая песочно-зелёная база, глубокий тропический зелёный, охра леопарда, почти чёрный для пятен и текста, бирюза воды аквариума. Утвердить после мудборда.","group":"Визуал","order":90,"section":"brandbook","status":"Гипотеза","title":"Палитра"},{"id":"bb-10","body":"Черта над «ā» — линия горизонта острова. Можно использовать отдельно: в навигации, на посуде, в сторис.","group":"Визуал","order":100,"section":"brandbook","status":"Гипотеза","title":"Макрон как фирменный элемент"},{"id":"bb-11","body":"Тепло, смело, с иронией. Говорим смыслами и коротко. Обращение на «вы» или на «ты» уточняем на брифе.","group":"Голос бренда","order":110,"section":"brandbook","status":"Гипотеза","title":"Тон коммуникации"},{"id":"bb-12","body":"Каждый визуальный и сервисный элемент получает короткую расшифровку. См. статью базы «Словарь смыслов».","group":"Голос бренда","order":120,"section":"brandbook","status":"Гипотеза","title":"У каждой детали есть смысл"},{"id":"bb-13","body":"Позиция «мы любим леопардов живыми»: принт и искусственные материалы, натуральный мех не используем.","group":"Голос бренда","order":130,"section":"brandbook","status":"Гипотеза","title":"Только искусственный мех"},{"id":"bb-14","body":"Инста-объект и маскот бренда.","group":"Маскот","order":140,"section":"brandbook","status":"Факт от клиента","title":"Двухметровый леопард в центре зала"},{"id":"bb-15","body":"Пока не выбрано. Предлагаем выбрать его вместе с аудиторией до открытия, а итог объявить 22 ноября.","group":"Маскот","order":150,"section":"brandbook","status":"Гипотеза","title":"Имя маскота"},{"id":"bb-16","body":"Черновик легенды — в базе знаний. Показываем владельцу на брифе.","group":"Маскот","order":160,"section":"brandbook","status":"Гипотеза","title":"Легенда «Леопард на острове»"},{"id":"brief-101","body":"Решает владелец (Максим). Инвестор-партнёр дал свободу: «делай, как видишь». Тексты объявлений и сметы подтверждает сам.","group":"1. Знакомство и правила работы · Женя","order":101,"section":"brief","status":"Ответ есть","title":"Кто принимает решения и согласует материалы? Сколько времени обычно нужно на ответ?"},{"id":"brief-102","body":"Общий чат + клиентский пульт. Времени мало (стройка), отвечает не сразу.","group":"1. Знакомство и правила работы · Женя","order":102,"section":"brief","status":"Ответ есть","title":"Где вам удобнее общаться: общий чат, созвоны, этот пульт? В какие часы вас лучше не беспокоить?"},{"id":"brief-103","body":"Открыт к идеям, любит то, чего никто не делал. Сам себя считает «замороченным» заказчиком. В деталях интерьера и смыслах — твёрдое видение; в продвижении и контенте ждёт наших предложений.","group":"1. Знакомство и правила работы · Женя","order":103,"section":"brief","status":"Ответ есть","title":"Как вы хотите работать с нашими рекомендациями по позиционированию, униформе и контенту? Где у вас твёрдое видение, а где вы ждёте нашей экспертизы?"},{"id":"brief-201","body":"«Иначе» = нормально: стабильное качество, понятные цены и порции, сервис (убрать салфетку сразу), светлое помещение вместо подвала. Место на каждый день, а не по праздникам.","group":"2. Продукт и легенда бренда · Максим","order":201,"section":"brief","status":"Ответ есть","title":"Что значит «здесь будет иначе»? Назовите три вещи, которых гость не найдёт в других заведениях Рязани."},{"id":"brief-202","body":"Сначала появился леопард, потом подобрал слово. Смысл: māori = «обычный человек» (в отличие от богов). Произношение — как угодно (маори/маури). В аутентичность не уходим — это «только помешает».","group":"2. Продукт и легенда бренда · Максим","order":202,"section":"brief","status":"Ответ есть","title":"Почему Māори? Что для вас значит это слово, откуда пришла идея, как правильно произносить и где ударение?"},{"id":"brief-203","body":"Леопард — личная любовь владельца (сам носит леопард, есть леопардовая шуба). Маскот — пенопластовая фигура 2 м на заказ, обвивает колонну, как кот когтедёрку. В нейроконтенте может быть чуть разным. Имя маскота не обсуждали — спросить.","group":"2. Продукт и легенда бренда · Максим","order":203,"section":"brief","status":"Ответ есть","title":"Почему леопард? Какой у него характер и история, как он связан с островом? Есть ли у маскота имя или придумаем его вместе?"},{"id":"brief-204","body":"Кухня — вторая сильная сторона, поднимать до уровня кальянов. Шеф проектный, уйдёт, но будет курировать. 4 завтрака весь день (скрэмбл, яичница, каша…). Днём — скорость для офисов, через 2–4 месяца — предзаказ через приложение. Средний чек и часы работы — не озвучены.","group":"2. Продукт и легенда бренда · Максим","order":204,"section":"brief","status":"Ответ есть","title":"Кухня: какие 3–5 блюд станут героями? Какой средний чек? Будет ли бизнес-ланч для офисов рядом? Часы работы?"},{"id":"brief-205","body":"Бар в пиаре притушаем: акцент на кальяны и кухню. Принт будет даже в коктейлях.","group":"2. Продукт и легенда бренда · Максим","order":205,"section":"brief","status":"Ответ есть","title":"Бар: будут ли авторские коктейли, тики-подача, безалкогольная линейка? Есть ли фирменный коктейль?"},{"id":"brief-206","body":"Сильнейшая сторона, 60–70% концепции — лаунж. Стабильное качество, гигантская полка табака, профи из бывших учеников. Без шоу и наворотов, как было в прошлом проекте.","group":"2. Продукт и легенда бренда · Максим","order":206,"section":"brief","status":"Ответ есть","title":"Кальяны: какое место они занимают в концепции и выручке? Есть ли фишки подачи?"},{"id":"brief-207","body":"Тихий спокойный лаунж, без танцев и знакомств. Немного игровых консолей — бонус, не акцент. Столы с небольшими фишками. Парковки нет. Посадка и музыка — не обсуждали.","group":"2. Продукт и легенда бренда · Максим","order":207,"section":"brief","status":"Ответ есть","title":"Зал: сколько посадочных мест, какие зоны, какая музыка? Будут ли DJ или живая музыка?"},{"id":"brief-208","body":"На созвоне 6.11 не обсуждали — спросить в чате.","group":"2. Продукт и легенда бренда · Максим","order":208,"section":"brief","status":"Спросить","title":"Что вы планируете делать с шестиметровым аквариумом? Можно ли сделать его героем контента?"},{"id":"brief-209","body":"Нельзя: стройку; «смешные» рилсы с персоналом и липсинги («под запретом навсегда»); танцы; игру в племя («набедренные пояса»); нейрослоп; дату открытия на трафаретах.","group":"2. Продукт и легенда бренда · Максим","order":209,"section":"brief","status":"Ответ есть","title":"Что категорически нельзя: показывать стройку, использовать какие-то цвета, слова или приёмы?"},{"id":"brief-301","body":"По статистике Instagram и VK прошлых проектов — примерно 70/30 в пользу девушек. Девушки с подругами: кальян и разговоры за кофе в будни, коктейли в пт/сб. За ними приходят парни. Возраст 18–35, ядро 22–28. Строго 18+.","group":"3. Аудитория · Максим","order":301,"section":"brief","status":"Ответ есть","title":"Опишите 2–3 конкретных гостей, которых вы хотите видеть: кто они, сколько им лет, чем живут, с кем приходят?"},{"id":"brief-302","body":"Никаких танцев, знакомств и «разврата». Дети и пожилые — не аудитория (18+). Не «подвальная кальянная».","group":"3. Аудитория · Максим","order":302,"section":"brief","status":"Ответ есть","title":"Кого вы не хотите видеть? С чем место не должно ассоциироваться?"},{"id":"brief-303","body":"Первые 4–5 часов после открытия — ближний трафик офисов (парковки нет, издалека не поедут). С 18:00 — классическая лаунж-посадка.","group":"3. Аудитория · Максим","order":303,"section":"brief","status":"Ответ есть","title":"Будни и выходные, день и ночь: кто приходит в какое время? На какое время вы делаете ставку?"},{"id":"brief-304","body":"Не обсуждали. Упоминался музей-бар Васи Ложкина (владельцы — владельцы билбордов). Спросить про конкурентов.","group":"3. Аудитория · Максим","order":304,"section":"brief","status":"Спросить","title":"Куда эти люди ходят сейчас? Кого вы считаете конкурентами в Рязани?"},{"id":"brief-305","group":"3. Аудитория · Максим","order":305,"section":"brief","status":"Спросить","title":"Что гость должен рассказать друзьям после первого визита?"},{"id":"brief-306","body":"Есть статистика Instagram и VK прошлых проектов (70/30 девушки) и постоянники, часть команды переходит из прошлых заведений.","group":"3. Аудитория · Максим","order":306,"section":"brief","status":"Ответ есть","title":"Есть ли у вас данные с прошлых проектов: база гостей, отзывы, понимание рязанской аудитории?"},{"id":"brief-401","body":"Да: розыск (цветной), лапки по трафарету, нейровидео «леопард гуляет», шары вместо надувной лапы, леопардовый человек (в шубе, без грима), лифт. Нет/потом: автобус, проекция, фигурки (только если дёшево и красиво), клуб пробежек после открытия. Баннер со стикерами — не решили (клиент боится вандализма).","group":"4. PR и «Леопардовый бум» · Лиза","order":401,"section":"brief","status":"Решено","title":"Показываем карту: где и как леопардовый принт появляется в городе. Что из этого вам откликается?"},{"id":"brief-402","body":"Хулиганство — да, но с чётким порогом: только то, за что ничего не будет. Районы: Почтовая, центр, ТЦ «Малина». Надписи на асфальте и объявления — если легально. Тексты подтверждает сам.","group":"4. PR и «Леопардовый бум» · Лиза","order":402,"section":"brief","status":"Ответ есть","title":"Где проходят границы: стрит-арт, стикеры, костюмы, флешмобы, провокация? Что допустимо для бренда?"},{"id":"brief-403","body":"Рекламный бюджет не выделен. На розыгрыш готов 20–25 тыс. (4–5 депозитов по 5 000 ₽). Шары, стаканы, брелоки с Ozon — «ерунда, дам». Женя проговаривает с ним рекламный бюджет (включая генерации).","group":"4. PR и «Леопардовый бум» · Лиза","order":403,"section":"brief","status":"Спросили","title":"Какой порядок бюджета на запуск и на продвижение в первые месяцы?"},{"id":"brief-404","body":"«Воздушный слон» (шары), SkyRoom (леопардовая коллекция), клуб пробежек (есть группа в леопардовом), управляющая своего БЦ, БЦ «Капитал», партнёры Жени по городским экранам.","group":"4. PR и «Леопардовый бум» · Лиза","order":404,"section":"brief","status":"Ответ есть","title":"Есть ли знакомые и партнёры: блогеры, медиа, вузы, соседние офисы, МТС, поставщики?"},{"id":"brief-405","body":"Сам снимает нейроролики в леопарде для аккаунта, даёт свою шубу для съёмки. Прямого ответа про интервью не было.","group":"4. PR и «Леопардовый бум» · Лиза","order":405,"section":"brief","status":"Спросили","title":"Готовы ли вы лично быть лицом проекта: интервью, сторис, история основателя?"},{"id":"brief-501","body":"Можно: концепцию, смыслы, небольшие детали и атмосферу «в движении» (карусель из 10 смазанных кадров с фразами — видел у казанского заведения). Любит эстетику, фото блюд, интерьер, маскота почти в каждом посте, качественную нейронку, стильные (не смешные) тренды.","group":"5. Контент до открытия · Алёна","order":501,"section":"brief","status":"Ответ есть","title":"Что можно показывать: фрагменты интерьера, текстуры, униформу, команду, меню? Что нельзя ни при каких условиях?"},{"id":"brief-502","group":"5. Контент до открытия · Алёна","order":502,"section":"brief","status":"Спросить","title":"Как обращаемся к аудитории: на «вы» или на «ты»? Какой тон: дерзкий, тёплый, ироничный?"},{"id":"brief-503","group":"5. Контент до открытия · Алёна","order":503,"section":"brief","status":"Спросить","title":"Кто ведёт аккаунт сейчас и кто будет вести после открытия? Нужен ли нам доступ?"},{"id":"brief-504","group":"5. Контент до открытия · Алёна","order":504,"section":"brief","status":"Спросить","title":"Какие площадки, кроме Instagram: Telegram, VK, Яндекс Карты, 2ГИС?"},{"id":"brief-505","body":"До открытия — короткая съёмка деталей (день согласовать). После открытия — обязательный обзор с моделями, прогон еды, кальяны. Персонала пока нет; в кадре — «50 на 50», только эстетика и истории.","group":"5. Контент до открытия · Алёна","order":505,"section":"brief","status":"Ответ есть","title":"Когда можно снимать в готовом зале и персонал в униформе?"},{"id":"brief-601","group":"6. Открытие 22 ноября · Лиза, Женя","order":601,"section":"brief","status":"Спросить","title":"Каким будет открытие: одно событие или сначала soft opening для своих, а затем большое открытие?"},{"id":"brief-602","group":"6. Открытие 22 ноября · Лиза, Женя","order":602,"section":"brief","status":"Спросить","title":"Кого зовём: блогеров, партнёров, соседние офисы, студентов, гостей прошлых проектов? Сколько человек вмещает зал?"},{"id":"brief-603","body":"Предложил розыгрыш: 4 депозита по 5 000 ₽ за репост рилса, за 1–2 недели до открытия. Можно предложить другую механику. Другие спецпредложения не обсуждали.","group":"6. Открытие 22 ноября · Лиза, Женя","order":603,"section":"brief","status":"Спросили","title":"Будут ли спецпредложения на открытие и первые недели?"},{"id":"brief-604","body":"Дата может сдвинуться — поэтому дату не пишем на трафаретах и несъёмных носителях. Экскурсию по залу придумывает на ходу, времени мало.","group":"6. Открытие 22 ноября · Лиза, Женя","order":604,"section":"brief","status":"Ответ есть","title":"Насколько точна дата 22 ноября? Что делаем, если стройка задержится?"},{"id":"brief-701","group":"7. Материалы и сроки · все","order":701,"section":"brief","status":"Спросить","title":"Когда вы сможете прислать логотип в SVG и PNG, мудборд, рендеры или планировку, меню, барную карту и фото униформы?"},{"id":"brief-702","body":"Владелец спрашивает управляющую своего БЦ про лифт. Мы — БЦ «Капитал». Женя — адреса экранов и юридический ответ по 18+. Нужно его «да» по рекламному бюджету.","group":"7. Материалы и сроки · все","order":702,"section":"brief","status":"Спросили","title":"Какие решения нужны от вас в ближайшие три дня и кто их примет?"},{"id":"cj-00","body":"Эмоции по шкале от −2 до +2. Главные провалы — на этапах 2, 4 и 6.\n\n| Этап | Действия | Точки контакта | Эмоция | Главный барьер | Возможность |\n|---|---|---|---|---|---|\n| 1. Узнаёт | Видит леопарда в городе и сторис подруг | Рилсы, розыск, лифт, SkyRoom, сарафан | +1 интрига | «Очередная кальянная?» | Всё ведёт на @maori.lounge, раскрытие 19.11 |\n| 2. Изучает | Смотрит профиль, цены, 2ГИС | Instagram, 2ГИС, Яндекс | 0 сомнение | Нет цен и отзывов | Хайлайты «Меню и цены», первые отзывы с soft opening |\n| 3. Бронирует | Пишет в директ, уточняет стол | Директ, телефон, бронь в 2ГИС | +1 / −1 | Долгий ответ | Ответ за 15 минут, подтверждение с фото входа |\n| 4. Добирается | Ищет вход в офисном здании | Навигатор, вход, лифт, хостес | −1 → +1 | «Где вход?», нет парковки | Точка входа в 2ГИС, лапки до двери |\n| 5. Заказывает | Выбирает вкус, еду, напитки | Мастер, официант, меню | +1 | «Забьют что есть», давление | Три вопроса мастера, кальян за 15 минут |\n| 6. Вечер | Курит, говорит, фотографируется, ест | Кальян, угли, кухня, фото-точка, музыка | +2 / −2 | Горечь, угли, шум, темнота | Угли по таймеру, перезабивка, тихая музыка, свет |\n| 7. Уходит | Делит счёт, оставляет чаевые | Официант, терминал, QR | 0 | Сюрпризы в счёте | Раздельный счёт, чаевые и отзыв по QR |\n| 8. После | Сторис, отзыв, возврат | Instagram, 2ГИС, директ | +1 | Позитив не доходит до карт | Репосты, ответ за 24 ч, приглашение в будни |","group":"1. Карта целиком","order":10,"section":"cjm","status":"Черновик","title":"CJM одной таблицей: «Подруги на вечер»"},{"id":"cj-01","body":"**Действия клиента:** листает Instagram и сторис подруг, видит в городе объявления «Разыскивается леопард», лапки и шары, слышит от знакомых. После открытия видит Māори в подборках и на картах.\n\n**Точки контакта:**\n- Нейровидео и рилсы @maori.lounge.\n- Объявления о розыске на Почтовой и в центре.\n- Леопардовый лифт и баннер в БЦ.\n- Коллаборация со SkyRoom.\n- Сарафан.\n- Карточка в 2ГИС и Яндекс Картах.\n\n**Мотивация и ожидания:** новое место, «в Рязани что-то происходит», хочется узнать первой.\n\n**Страхи и барьеры:**\n- «Очередная кальянная».\n- «Что за Māори? Тематический клуб с племенем?»\n\n**Эмоции:** любопытство и интрига, +1.\n\n**Проблемы:**\n- Связь леопарда с местом пока не очевидна.\n- Дата открытия может сдвинуться.\n- Instagram в РФ доступен не всем.\n\n**Возможности:**\n- Каждый носитель ведёт на один адрес: @maori.lounge плюс QR.\n- К 19.11 раскрыть, что леопард — это Māори.\n- Карточку 2ГИС с фото и меню завести до открытия.","group":"2. Этапы пути: «Подруги на вечер»","order":10,"section":"cjm","status":"Черновик","title":"Этап 1. Узнаёт о Māори"},{"id":"cj-02","body":"**Действия клиента:** открывает профиль, смотрит интерьер и меню, ищет цены. В 2ГИС или Яндексе смотрит рейтинг, фото гостей и отзывы. Кидает ссылку подругам в чат.\n\n**Точки контакта:**\n- Шапка и хайлайты Instagram.\n- Карточка в 2ГИС и Яндексе.\n- Сторис.\n- Директ.\n\n**Мотивация и ожидания:** убедиться, что светло, красиво, вкусно и не дорого.\n\n**Страхи и барьеры:**\n- Нет цен — «наверное, дорого».\n- Нет отзывов — «а вдруг сыро».\n- Тёмные фото — «очередной подвал».\n\n**Эмоции:** сомнение, 0.\n\n**Проблемы:**\n- У нового места нет отзывов и фото гостей.\n- Меню может быть не готово к 22.11.\n\n**Возможности:**\n- Хайлайты «Меню и цены», «Как нас найти», «Курить не обязательно».\n- Фото при дневном свете.\n- Ответ в директ за 15 минут.\n- Первые отзывы собрать на soft opening.","group":"2. Этапы пути: «Подруги на вечер»","order":20,"section":"cjm","status":"Черновик","title":"Этап 2. Изучает и сравнивает"},{"id":"cj-03","body":"**Действия клиента:** договаривается с подругами о дне, пишет в директ или звонит, уточняет стол, депозит и можно ли без кальяна.\n\n**Точки контакта:**\n- Директ.\n- Телефон.\n- Бронь в 2ГИС или Яндексе.\n- Хостес.\n\n**Мотивация и ожидания:** занять хороший стол у окна или у леопарда и быть уверенной, что всё будет.\n\n**Страхи и барьеры:**\n- Долго не отвечают.\n- Навязывают депозит.\n- Посадят у туалета.\n\n**Эмоции:** предвкушение +1. Если ответа нет, раздражение −1.\n\n**Проблемы:** в день открытия и первые выходные возможен наплыв, зал будет переполнен.\n\n**Возможности:**\n- Онлайн-бронь с выбором зоны.\n- Шаблоны быстрых ответов.\n- Подтверждение брони сообщением с адресом и фото входа.","group":"2. Этапы пути: «Подруги на вечер»","order":30,"section":"cjm","status":"Черновик","title":"Этап 3. Решает и бронирует"},{"id":"cj-04","body":"**Действия клиента:** едет на такси или идёт пешком (парковки нет), ищет вход в офисное здание напротив МТС, заходит, встречается с хостес.\n\n**Точки контакта:**\n- Навигация в 2ГИС.\n- Вывеска и вход в БЦ.\n- Лифт.\n- Хостес.\n- Гардероб.\n\n**Мотивация и ожидания:** быстро найти место и не плутать вечером по бизнес-центру.\n\n**Страхи и барьеры:**\n- «Где вход?»\n- Вечером БЦ закрыт или стоит охрана.\n\n**Эмоции:** напряжение −1, при встрече с хостес облегчение +1.\n\n**Проблемы:** вход в офисном здании неочевиден, парковки нет.\n\n**Возможности:**\n- Точка входа в 2ГИС.\n- Фото входа в хайлайтах и в подтверждении брони.\n- Леопардовые лапки от улицы до двери.\n- Леопардовый лифт.","group":"2. Этапы пути: «Подруги на вечер»","order":40,"section":"cjm","status":"Черновик","title":"Этап 4. Добирается и входит"},{"id":"cj-05","body":"**Действия клиента:** садится, смотрит меню, обсуждает с кальянным мастером вкус и крепость, заказывает напитки и еду.\n\n**Точки контакта:**\n- Хостес.\n- Официант.\n- Кальянный мастер.\n- Меню, бумажное или по QR.\n\n**Мотивация и ожидания:** получить именно свой вкус и быстро.\n\n**Страхи и барьеры:**\n- Забьют «из того, что есть».\n- Непонятные цены.\n- Давят: «закажите кальян».\n\n**Эмоции:** интерес, +1.\n\n**Проблемы:** в первые недели работают новые официанты, на старте возможны сбои кухни.\n\n**Возможности:**\n- Мастер задаёт три вопроса: вкус, крепость, холодок.\n- Кальян приносят за 15 минут.\n- В меню цены и граммовки.\n- Правило «курить не обязательно».","group":"2. Этапы пути: «Подруги на вечер»","order":50,"section":"cjm","status":"Черновик","title":"Этап 5. Садится и заказывает"},{"id":"cj-06","body":"**Действия клиента:** курит, разговаривает, фотографируется у леопарда и аквариума, ест, играет в консоль, дозаказывает.\n\n**Точки контакта:**\n- Кальян и угли.\n- Кухня и бар.\n- Фото-точка.\n- Музыка и вытяжка.\n- Кнопка вызова или официант.\n\n**Мотивация и ожидания:** наговориться, красиво провести время, сделать фото.\n\n**Страхи и барьеры:**\n- Кальян горчит.\n- Угли не меняют.\n- Громко и накурено.\n- Официанта не дозваться.\n\n**Эмоции:** пик +2 при хорошем кальяне и удачных фото. Провал −2 при горечи или шуме.\n\n**Проблемы:** именно на этом этапе у конкурентов больше всего негатива: угли, горечь, музыка, темнота.\n\n**Возможности:**\n- Угли меняют по таймеру.\n- Бесплатная перезабивка в первые 10 минут.\n- Громкость музыки такая, что можно говорить.\n- Свет у фото-точки.\n- Кнопка вызова на столе: её хвалят у Smoke Elements.","group":"2. Этапы пути: «Подруги на вечер»","order":60,"section":"cjm","status":"Черновик","title":"Этап 6. Проводит вечер"},{"id":"cj-07","body":"**Действия клиента:** просит счёт, делит его с подругами, оставляет чаевые, вызывает такси.\n\n**Точки контакта:**\n- Официант.\n- Терминал или QR.\n- Чек.\n\n**Мотивация и ожидания:** быстро, прозрачно, без сюрпризов.\n\n**Страхи и барьеры:**\n- В счёте лишнее или «сервисный сбор».\n- Счёт долго не несут.\n\n**Эмоции:** спокойно, 0. При сюрпризах в счёте разочарование −1.\n\n**Проблемы:** счёт на компанию сложно разделить, чаевые без наличных неудобно оставить.\n\n**Возможности:**\n- Раздельный счёт по умолчанию.\n- Чаевые по QR: гости Гозе прямо об этом просят.\n- На чеке QR для отзыва.","group":"2. Этапы пути: «Подруги на вечер»","order":70,"section":"cjm","status":"Черновик","title":"Этап 7. Расплачивается и уходит"},{"id":"cj-08","body":"**Действия клиента:** выкладывает сторис с отметкой, обсуждает вечер в чате, пишет отзыв, если было очень хорошо или очень плохо. Возвращается или нет.\n\n**Точки контакта:**\n- Instagram: отметки и репосты.\n- Отзывы в 2ГИС и Яндексе.\n- Директ.\n- Программа лояльности, если появится.\n\n**Мотивация и ожидания:** поделиться находкой, найти «своё место».\n\n**Страхи и барьеры:** у гостя страхов почти нет. Риск для бренда — оставить негатив без ответа.\n\n**Эмоции:** удовлетворение и гордость за находку, +1.\n\n**Проблемы:** отзывы пишут в основном на сильных эмоциях. Без просьбы позитив не доходит до карт.\n\n**Возможности:**\n- Репостить отметки гостей.\n- Отвечать на каждый отзыв в течение 24 часов.\n- Просить отзыв через QR.\n- Звать вернуться в будни на кофе и завтраки.","group":"2. Этапы пути: «Подруги на вечер»","order":80,"section":"cjm","status":"Черновик","title":"Этап 8. После визита"},{"id":"cj-20","body":"| Этап | Действия | Точки контакта | Эмоция | Барьер | Возможность |\n|---|---|---|---|---|---|\n| Узнаёт | Видит стикер в лифте, слышит от коллег | Лифты и баннер БЦ «Капитал» и своего БЦ, офис МТС | 0 | «Это же кальянная, днём там нечего делать» | QR на меню ланча прямо в лифте |\n| Изучает | Смотрит меню и цену ланча | Telegram, Instagram, 2ГИС | 0 | Нет цены ланча в открытом доступе | Меню недели с ценой, обновлять по понедельникам |\n| Приходит | Идёт пешком в 12:30–14:00 | Вход, хостес | +1 | Ждать стол в пик | Стол для офисов, предзаказ |\n| Ест или работает | Ждёт блюдо, ест или работает с ноутбуком | Кухня, Wi‑Fi, розетки, дневной кальян | +1 / −2 | Долго несут, дымно, нет розетки | Отдаём за 15 минут, розетки у стен, дневной кальян |\n| Уходит | Платит за 2 минуты | Терминал, QR | 0 | Ждать счёт | Оплата по QR со стола |\n| Возвращается | Ходит регулярно, приводит коллег | Telegram, предзаказ | +1 | Скучное меню | Меню недели, позже приложение с предзаказом (через 2–4 месяца) |\n\n⚠️ Спросить владельца: будет ли днём зона без дыма и цена дневного кальяна.","group":"3. Другие пути","order":10,"section":"cjm","status":"Черновик","title":"Дневной путь: сотрудник офиса и гость с ноутбуком"},{"id":"cj-21","body":"| Этап | Действия | Точки контакта | Эмоция | Барьер | Возможность |\n|---|---|---|---|---|---|\n| Ищет | За 1–3 недели сравнивает 3–4 места | Instagram, 2ГИС, советы друзей | 0 | Непонятно, поместятся ли все | Хайлайт «День рождения»: фото столов на 6, 8 и 10 человек |\n| Договаривается | Звонит или пишет, уточняет стол и депозит | Директ, телефон | +1 / −1 | Расплывчатые условия | Понятный пакет: стол, сет, подарок имениннику |\n| Встречает гостей | Приходит раньше, проверяет стол | Хостес, официант | −1 → +1 | Стол меньше обещанного | Стол готов к приходу, табличка с именем |\n| Празднует | Еда, кальяны, тост, фото | Кухня, мастер, фото-точка | +2 / −2 | Невкусно, нельзя пересесть | Проверенный сет, гибкая посадка |\n| Расчёт | Делит счёт на компанию | Официант, QR | 0 | Долго и путано | Раздельный счёт по гостям |\n| После | Фото в сторис, отзыв | Instagram, 2ГИС | +1 | Негатив при сбое | Звонок или сообщение на следующий день, отметить и репостнуть |","group":"3. Другие пути","order":20,"section":"cjm","status":"Черновик","title":"Путь именинника-организатора"},{"id":"cj-30","body":"1. **Этап 2, изучение.** У нового места нет отзывов и цен. До 22.11 нужны хайлайт «Меню и цены», фото при свете и заполненная карточка 2ГИС.\n2. **Этап 4, вход.** Офисное здание, вход неочевиден, парковки нет. Нужны точка входа на карте, фото входа и лапки до двери.\n3. **Этап 6, вечер.** Здесь копится весь негатив конкурентов: угли, горечь, шум, темнота. Нужен стандарт сервиса, и его надо показывать гостям.\n4. **Этап 3, бронь.** Скорость ответа решает выбор, особенно для именинников. Ответ в директ за 15 минут.\n5. **Этап 8, после визита.** Довольные гости молчат. Нужны QR на отзыв и ответ на каждый отзыв за 24 часа.","group":"4. Выводы","info":true,"order":10,"section":"cjm","title":"Где мы рискуем потерять гостя: пять точек"},{"id":"ct-01","body":"Первые кадры леопардового принта в городе без объяснений. Подпись-вопрос: «Вы тоже это заметили?»","channel":"Instagram · Reels","date":"2026-11-07","order":10,"section":"content","status":"Идея","title":"«В Рязани что-то происходит»"},{"id":"ct-02","body":"Крупные планы фактур интерьера, по которым нельзя угадать зал целиком. Интрига «соберите пазл».","channel":"Instagram · карусель","date":"2026-11-08","order":20,"section":"content","status":"Ушло клиенту","title":"Макротекстуры: принт, лист, вода"},{"id":"ct-03","body":"3–4 варианта имени маскота, у каждого свой смысл. Итог объявляем в день открытия.","channel":"Stories · опрос","date":"2026-11-10","order":30,"section":"content","status":"Идея","title":"Как зовут леопарда? Голосование"},{"id":"ct-04","body":"Перенесли из ноябрьского плана: в 10–22.11 стоят 8 постов от команды. Хороший пост на первую неделю после открытия: «māori = обычный человек», манифест нормальности.","channel":"Instagram · пост","date":"2026-11-11","order":40,"section":"content","status":"Идея","title":"Что значит Māори"},{"id":"ct-05","body":"ASMR: пузырьки аквариума, шелест листьев, лёд в шейкере. Только звук и детали, интерьер не показываем.","channel":"Reels","date":"2026-11-13","order":50,"section":"content","status":"Идея","title":"Звук острова"},{"id":"ct-06","body":"Собираем отметки подписчиков, которые нашли принт в городе. Подсказка: все следы ведут к одному адресу.","channel":"Reels · репосты","date":"2026-11-15","order":60,"section":"content","status":"Идея","title":"Карта леопардовых следов"},{"id":"ct-07","body":"Леопардовые детали формы крупным планом, без лиц. Персонал готовится.","channel":"Stories","date":"2026-11-17","order":70,"section":"content","status":"Идея","title":"Униформа в деталях"},{"id":"ct-08","body":"«Если вы замечали леопарда в городе — это мы». Дата, адрес и то, что ждёт на открытии.","channel":"Пост + Stories","date":"2026-11-19","order":80,"section":"content","status":"Ушло клиенту","title":"Раскрытие: открытие 22 ноября"},{"id":"ct-09","body":"Каждый день сторис с таймером до открытия.","channel":"Stories","date":"2026-11-20","order":90,"section":"content","status":"Ушло клиенту","title":"Обратный отсчёт: 3, 2, 1"},{"id":"ct-10","body":"Первый показ зала целиком, леопард в центре, имя маскота.","channel":"Reels · эфир","date":"2026-11-22","order":100,"section":"content","status":"Ушло клиенту","title":"День открытия"},{"id":"ct-pkg-01","body":"Дублирование постов в VK и Telegram в тариф не входит (это «Стандарт» за 127 000 ₽ и «Премиум» за 144 000 ₽).","group":"Тариф «Эконом» · 110 000 ₽/мес","order":10,"section":"contract","title":"Соцсеть: только Instagram"},{"id":"ct-pkg-02","body":"Креативная стратегия, упаковка соцсети, контент-план на месяц, единый стиль SMM-коммуникации. Структура стратегии — в разделе «Стратегия по КП».","group":"Тариф «Эконом» · 110 000 ₽/мес","order":20,"section":"contract","title":"Стратегия и упаковка профиля"},{"id":"ct-pkg-03","body":"По КП посты выходят через день, кроме выходных; сторис — по вторникам и четвергам (≈8–9 в месяц). Форматы: карусели, рилсы, креативные и сюжетные фото и видео. Под постами ведём комментарии и работаем с негативом.","group":"Тариф «Эконом» · 110 000 ₽/мес","order":30,"section":"contract","title":"10 постов в месяц + сторис 2 раза в неделю"},{"id":"ct-pkg-04","body":"Мудборд, обработка, даты и места, сюжеты, реквизит, модели, модерация съёмки. На выходе — пакет фото и видео для рилсов, сторис и интеграций. Дополнительная съёмка — 2 500 ₽/час.","group":"Тариф «Эконом» · 110 000 ₽/мес","order":40,"section":"contract","title":"3 съёмки в месяц"},{"id":"ct-pkg-05","body":"Анализ ЦА, отбор блогеров и брендов для коллабораций, переговоры с партнёрами, блогерами и СМИ, контроль выходов по медиаплану. Условия: бартер или за отдельную плату — рекламный бюджет отдельно.","group":"Тариф «Эконом» · 110 000 ₽/мес","order":50,"section":"contract","title":"До 5 интеграций у блогеров и PR в месяц"},{"id":"ct-pkg-06","body":"В конце месяца — отчёт «до/после»: показы, реакции, комментарии, репосты, охваты, переходы и клики, прирост и отток подписчиков, упоминания в сторонних сообществах и блогах.","group":"Тариф «Эконом» · 110 000 ₽/мес","order":60,"section":"contract","title":"Аналитика и месячный отчёт"},{"id":"ct-pkg-07","body":"- Фотосъёмка сверх пакета — 2 500 ₽/час\n- Таргет VK (настройка и сопровождение) — 35 000 ₽\n- Контекст в Яндексе — 45 000 ₽\n- Яндекс Карты — 20 000 ₽\nРекламный бюджет во всех случаях отдельно.","group":"Допуслуги","order":70,"section":"contract","title":"Что можно докупить"},{"id":"ct-pkg-08","body":"PR-менеджер, SMM-специалист, копирайтер, дизайнер, рилсмейкер, проектный менеджер, таргетолог/директолог (при необходимости).","group":"Команда по КП","order":80,"section":"contract","title":"Роли, обещанные клиенту"},{"id":"ct-pkg-09","body":"- «Леопардовый бум» по городу — это PR-активности; в пакете до 5 интеграций, остальное — отдельный бюджет или бартер.\n- VK, Telegram, Яндекс Карты в «Эконом» не входят, а таргет в Instagram в РФ не запускаем — платное продвижение возможно только через допуслуги.\n- Ивент открытия в КП не описан — договориться отдельно, что делаем мы.","group":"Риски объёма","order":90,"section":"contract","title":"Где пакет может не совпасть с ожиданиями"},{"id":"ev-01","body":"Закрытый вечер для друзей, партнёров и блогеров накануне открытия. Проверяем кухню и сервис, получаем первый контент.","date":"2026-11-21","order":10,"section":"events","status":"Идея","title":"Soft opening для своих"},{"id":"ev-02","body":"Формат, программу и список гостей обсуждаем на брифе 6 ноября.\n- Раскрытие имени маскота\n- Первый показ зала целиком\n- Леопардовый дресс-код\n- Фирменный коктейль","date":"2026-11-22","order":20,"section":"events","status":"Планируем","title":"Открытие Māори"},{"id":"ev-03","body":"Конец июня или начало июля. Летний ивент про звёзды, навигацию и новое начало. Подробнее — в базе знаний.","order":30,"section":"events","status":"Идея","title":"Матарики — новый год маори"},{"id":"gp-00","body":"**Задача:** найти потребности гостей, которые конкуренты в Рязани не закрывают или закрывают плохо, и понять, на чём Māори строит отстройку.\n\n**Основа:**\n- JTBD-сегменты (раздел «JTBD-сегменты»).\n- Отзывы гостей шести кальянных в 2ГИС.\n- Выдача 2ГИС по 39 кальянным и бизнес-ланчам.\n- Ответы владельца на созвоне 06.11.\n\n**Правила:**\n- Каждый GAP подтверждён отзывами, иначе помечен как гипотеза.\n- Отсутствие информации у конкурента не значит, что у него этого нет.\n- Где нужно решение владельца, стоит ⚠️.\n\n**Типы GAP:**\n- Продуктовый: функция или сервис отсутствует либо слабый.\n- Позиционирования: преимущество есть, но не раскрыто.\n- Покупательского опыта: сложно выбрать, забронировать, дойти, оплатить.\n\nВсе кальянные Рязани: https://2gis.ru/ryazan/search/кальянная","group":"1. Источники и конкуренты","info":true,"order":10,"section":"gap","title":"Об анализе"},{"id":"gp-01","body":"| Заведение | Адрес | 2ГИС | Сильные стороны | Жалобы гостей |\n|---|---|---|---|---|\n| Вальхалла | БЦ «Капитал», Горького, 94 — **наш сосед** | 4,9 · 30 оценок | Тематика (скандинавская), мастер рассказывает легенды, «часы богов» с бесплатным чаем, настолки и приставки | Темно, интерьер не рассмотреть; «пусто, скучно» |\n| HookahPlace Terra | Горького, 102 — **рядом** | 3,0 · 2 оценки | Федеральная сеть, открылась летом 2026, разнообразное меню | Отзывов почти нет: новичок, следить |\n| Гозе | ТК «Городские ряды», Краснорядская, 2 | 4,9 · 200 | Дизайн и брендинг в деталях, вид на улицу Ленина, кухня от ресторана «Пламя и вино», бизнес-кальян | Обязательно два кальяна, маленькие столы, плохая паста (2 отзыва о ДР), громкая музыка, посадили у туалета при пустом зале |\n| Smoke Elements | Вокзальная, 61 | 4,9 · 250 | Бизнес-кальян 700 ₽, гости ходят почти каждый день, удобно с ноутбуком, кнопки вызова, работает допоздна | Пора делать ремонт |\n| Mafia House | Кальная, 5 | 127 оценок | Две PS5, угли раз в 30 минут, постоянники по 7 лет | Кальян за 1 800 ₽ не раскурен, сотрудница смотрит видео при гостях |\n| Барбарис | Татарская, 77 | 4,9 · 66 | Огромная полка табака (Darkside, Tangiers), бесплатная перезабивка, VIP-комната без доплаты пн–чт | Интерьер устарел, некурящих просят уйти, горчит |\n| 1095 на Почтовой | Почтовая, 56 | 5,0 · 37 | В зоне нашего «бума» на Почтовой | Отзывы не разбирали |\n| Дневной рынок: Хинкальный дом, Небо, Pho bo №1, Плов 62 | Центр | 4,6–4,8 | Ланчи от 500 ₽, у «Хинкального дома» скидка 25% до 17:00, «Небо» — видовой ресторан | Конкурируют за обед офисов, а не за вечер |\n\nСсылки на отзывы:\n- Вальхалла: https://2gis.ru/ryazan/firm/70000001076263270/tab/reviews\n- HookahPlace: https://2gis.ru/ryazan/firm/70000001113618869/tab/reviews\n- Гозе: https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews\n- Smoke Elements: https://2gis.ru/ryazan/firm/70000001021366903/tab/reviews\n- Mafia House: https://2gis.ru/ryazan/firm/70000001030233166/tab/reviews\n- Барбарис: https://2gis.ru/ryazan/firm/70000001034070398/tab/reviews\n- Ланчи: https://2gis.ru/ryazan/search/бизнес-ланч","group":"1. Источники и конкуренты","info":true,"order":20,"section":"gap","title":"Конкуренты: кто рядом и за что их любят и ругают"},{"id":"gp-10","body":"Десять разрывов, от самых обоснованных к гипотезам. Ссылки на отзывы — в карточках ниже.\n\n| GAP | Потребность ЦА | Доказательства | Что дают конкуренты | Где разрыв | Наша возможность | Уверенность |\n|---|---|---|---|---|---|---|\n| Светло и слышно друг друга | Подругам и парам важно наговориться и сделать фото. | Гозе: «музыка играет громко», «было слишком темно». Вальхалла: «не хватает освещения» | Лаунжи в Рязани — тёмные залы с громкой музыкой. Это норма жанра. | Нет места, где светло и тихо, но при этом есть кальян. | Светлый интерьер уже есть (владелец: «светлое помещение вместо подвала»). Добавить стандарт громкости и показывать зал при свете. | Высокая |\n| Курить не обязательно | Некурящий в компании не хочет быть лишним и платить за ненужный кальян. | Барбарис: некурящих гостий попросили уйти. Гозе: обязательный заказ двух кальянов | Обязательный кальян или минимальный заказ, мягкий или жёсткий. | Ни один лаунж не говорит прямо: «рады и тем, кто не курит». | Māори — ресторан и лаунж, у него полная кухня и завтраки весь день. Можно открыто обещать: «курить не обязательно». | Высокая ⚠️ нужно решение владельца о минимальном заказе |\n| Кухня, а не добавка к кальяну | Имениннику, паре и офису нужна нормальная еда. Подругам — вкусные напитки и десерты. | Гозе: две жалобы на пасту на днях рождения. Один гость пишет, что поесть можно не во многих кальянных | В большинстве кальянных — чай и снеки. Гозе возит кухню из ресторана-партнёра. | Нет места, где кальяну и кухне одинаково доверяют. | Кухня — вторая сильная сторона, её курирует шеф. Доказываем блюдами-героями, фото и первыми отзывами. | Средняя: кухня ещё не проверена гостями |\n| Кальян без лотереи | Ценителю нужен стабильный вкус и угли без напоминаний. | Mafia House: кальян за 1 800 ₽ не раскурен. Барбарис: «горчит». Позитив у всех — про угли вовремя | Все обещают «лучший кальян», но стандарт не показывает никто. | Обещания есть, видимых гарантий нет. | Владелец ставит на стабильность и сильных мастеров. Делаем стандарт видимым: угли по таймеру, перезабивка в первые 10 минут, мастер уточняет вкус и крепость. | Средняя: стандарт ещё нужно закрепить |\n| Честная посадка и бронь | Имениннику и паре нужен стол, который им подходит. | Гозе: при пустом зале посадили у туалета, именинников не пересадили из-за брони, «места для своих» | Бронь по телефону, стол не показывают. | Гость не знает, где будет сидеть. | Бронь с выбором зоны (у леопарда, у аквариума, у окна) и пакет «день рождения». | Средняя |\n| Дневной сценарий: обед и работа | Офисам нужен быстрый ланч. Гостям с ноутбуком — тишина, розетки и дневной кальян. | Smoke Elements: бизнес-кальян 700 ₽ каждый день, удобно с ноутбуком. Рынок ланчей 290–850 ₽ | Дневной кальян есть у Smoke Elements и Гозе, ланчи — у ресторанов. Связки «ланч + кальян + работа» рядом с БЦ нет. | Рядом с БЦ «Капитал» нет места, которое закрывает обед и работу днём. | Офисы буквально за стеной, завтраки весь день, скорость отдачи. Нужно определить цену ланча и дневного кальяна. | Средняя ⚠️ цены не определены |\n| Свежий интерьер | Подругам и парам нужны красивые кадры и ощущение нового места. | Smoke Elements: «пора делать ремонт». Барбарис: «интерьер уже можно обновить» | Часть сильных по кальяну мест устарела визуально. | Хороший кальян в старом интерьере. | Новое светлое место с тропиками, леопардом 2 м и аквариумом 6 м. Преимущество живёт 1–2 года — надо успеть закрепить привычку. | Высокая, но временная |\n| Тема без игры в племя | Гостям нравятся места со своим характером: «стиль, которого нигде нет в городе». | Вальхаллу любят за тематику и легенды мастера, но это наш сосед по БЦ «Капитал» | Тематический лаунж рядом уже есть, и он тёмный, «для своих». | Нет лёгкой тематики для широкой аудитории. | Леопард и остров как настроение, а не реконструкция. По решению владельца в аутентичность не уходим: Māори — «обычный человек», нормальность. | Средняя |\n| Цены видны заранее | Студентам и подругам важно понимать чек заранее. | Гозе: «цена не соответствует качеству». Mafia House: кальян за 1 800 ₽ разочаровал | Цены часто узнают уже на месте. | Гость не может прикинуть чек. | Владелец обещает «понятные цены и порции». Публикуем меню с ценами в хайлайтах и 2ГИС до открытия. | Средняя ⚠️ меню к 22.11 |\n| Вход, который легко найти | Всем сегментам вечером надо быстро найти вход. | Данные владельца: офисное здание, парковки нет. Отзывов пока нет. | Большинство конкурентов стоят на первых этажах с вывеской. | Вход внутри БЦ — барьер на четвёртом этапе CJM. | Леопардовые лапки до двери, лифт в принте, точка входа в 2ГИС, фото входа в подтверждении брони. | Гипотеза |","group":"2. Главная GAP-таблица","info":true,"order":10,"section":"gap","title":"Главная GAP-таблица"},{"id":"gp-11","body":"**Тип:** Покупательского опыта и позиционирования\n**Потребность ЦА:** Подругам и парам важно наговориться и сделать фото.\n**Доказательства:** Гозе: «музыка играет громко», «было слишком темно». Вальхалла: «не хватает освещения»: https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews\n**Что дают конкуренты:** Лаунжи в Рязани — тёмные залы с громкой музыкой. Это норма жанра.\n**Где разрыв:** Нет места, где светло и тихо, но при этом есть кальян.\n**Наша возможность:** Светлый интерьер уже есть (владелец: «светлое помещение вместо подвала»). Добавить стандарт громкости и показывать зал при свете.\n**Уверенность:** Высокая","group":"3. GAP по отдельности","order":10,"section":"gap","status":"Есть данные","title":"Светло и слышно друг друга"},{"id":"gp-12","body":"**Тип:** Продуктовый\n**Потребность ЦА:** Некурящий в компании не хочет быть лишним и платить за ненужный кальян.\n**Доказательства:** Барбарис: некурящих гостий попросили уйти. Гозе: обязательный заказ двух кальянов: https://2gis.ru/ryazan/firm/70000001034070398/tab/reviews\n**Что дают конкуренты:** Обязательный кальян или минимальный заказ, мягкий или жёсткий.\n**Где разрыв:** Ни один лаунж не говорит прямо: «рады и тем, кто не курит».\n**Наша возможность:** Māори — ресторан и лаунж, у него полная кухня и завтраки весь день. Можно открыто обещать: «курить не обязательно».\n**Уверенность:** Высокая ⚠️ нужно решение владельца о минимальном заказе","group":"3. GAP по отдельности","order":20,"section":"gap","status":"Есть данные","title":"Курить не обязательно"},{"id":"gp-13","body":"**Тип:** Позиционирования\n**Потребность ЦА:** Имениннику, паре и офису нужна нормальная еда. Подругам — вкусные напитки и десерты.\n**Доказательства:** Гозе: две жалобы на пасту на днях рождения. Один гость пишет, что поесть можно не во многих кальянных: https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews\n**Что дают конкуренты:** В большинстве кальянных — чай и снеки. Гозе возит кухню из ресторана-партнёра.\n**Где разрыв:** Нет места, где кальяну и кухне одинаково доверяют.\n**Наша возможность:** Кухня — вторая сильная сторона, её курирует шеф. Доказываем блюдами-героями, фото и первыми отзывами.\n**Уверенность:** Средняя: кухня ещё не проверена гостями","group":"3. GAP по отдельности","order":30,"section":"gap","status":"Гипотеза","title":"Кухня, а не добавка к кальяну"},{"id":"gp-14","body":"**Тип:** Позиционирования\n**Потребность ЦА:** Ценителю нужен стабильный вкус и угли без напоминаний.\n**Доказательства:** Mafia House: кальян за 1 800 ₽ не раскурен. Барбарис: «горчит». Позитив у всех — про угли вовремя: https://2gis.ru/ryazan/firm/70000001030233166/tab/reviews\n**Что дают конкуренты:** Все обещают «лучший кальян», но стандарт не показывает никто.\n**Где разрыв:** Обещания есть, видимых гарантий нет.\n**Наша возможность:** Владелец ставит на стабильность и сильных мастеров. Делаем стандарт видимым: угли по таймеру, перезабивка в первые 10 минут, мастер уточняет вкус и крепость.\n**Уверенность:** Средняя: стандарт ещё нужно закрепить","group":"3. GAP по отдельности","order":40,"section":"gap","status":"Есть данные","title":"Кальян без лотереи"},{"id":"gp-15","body":"**Тип:** Покупательского опыта\n**Потребность ЦА:** Имениннику и паре нужен стол, который им подходит.\n**Доказательства:** Гозе: при пустом зале посадили у туалета, именинников не пересадили из-за брони, «места для своих»: https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews\n**Что дают конкуренты:** Бронь по телефону, стол не показывают.\n**Где разрыв:** Гость не знает, где будет сидеть.\n**Наша возможность:** Бронь с выбором зоны (у леопарда, у аквариума, у окна) и пакет «день рождения».\n**Уверенность:** Средняя","group":"3. GAP по отдельности","order":50,"section":"gap","status":"Есть данные","title":"Честная посадка и бронь"},{"id":"gp-16","body":"**Тип:** Продуктовый\n**Потребность ЦА:** Офисам нужен быстрый ланч. Гостям с ноутбуком — тишина, розетки и дневной кальян.\n**Доказательства:** Smoke Elements: бизнес-кальян 700 ₽ каждый день, удобно с ноутбуком. Рынок ланчей 290–850 ₽: https://2gis.ru/ryazan/firm/70000001021366903/tab/reviews\n**Что дают конкуренты:** Дневной кальян есть у Smoke Elements и Гозе, ланчи — у ресторанов. Связки «ланч + кальян + работа» рядом с БЦ нет.\n**Где разрыв:** Рядом с БЦ «Капитал» нет места, которое закрывает обед и работу днём.\n**Наша возможность:** Офисы буквально за стеной, завтраки весь день, скорость отдачи. Нужно определить цену ланча и дневного кальяна.\n**Уверенность:** Средняя ⚠️ цены не определены","group":"3. GAP по отдельности","order":60,"section":"gap","status":"Гипотеза","title":"Дневной сценарий: обед и работа"},{"id":"gp-17","body":"**Тип:** Позиционирования (временный)\n**Потребность ЦА:** Подругам и парам нужны красивые кадры и ощущение нового места.\n**Доказательства:** Smoke Elements: «пора делать ремонт». Барбарис: «интерьер уже можно обновить»: https://2gis.ru/ryazan/firm/70000001034070398/tab/reviews\n**Что дают конкуренты:** Часть сильных по кальяну мест устарела визуально.\n**Где разрыв:** Хороший кальян в старом интерьере.\n**Наша возможность:** Новое светлое место с тропиками, леопардом 2 м и аквариумом 6 м. Преимущество живёт 1–2 года — надо успеть закрепить привычку.\n**Уверенность:** Высокая, но временная","group":"3. GAP по отдельности","order":70,"section":"gap","status":"Есть данные","title":"Свежий интерьер"},{"id":"gp-18","body":"**Тип:** Позиционирования\n**Потребность ЦА:** Гостям нравятся места со своим характером: «стиль, которого нигде нет в городе».\n**Доказательства:** Вальхаллу любят за тематику и легенды мастера, но это наш сосед по БЦ «Капитал»: https://2gis.ru/ryazan/firm/70000001076263270/tab/reviews\n**Что дают конкуренты:** Тематический лаунж рядом уже есть, и он тёмный, «для своих».\n**Где разрыв:** Нет лёгкой тематики для широкой аудитории.\n**Наша возможность:** Леопард и остров как настроение, а не реконструкция. По решению владельца в аутентичность не уходим: Māори — «обычный человек», нормальность.\n**Уверенность:** Средняя","group":"3. GAP по отдельности","order":80,"section":"gap","status":"Гипотеза","title":"Тема без игры в племя"},{"id":"gp-19","body":"**Тип:** Покупательского опыта\n**Потребность ЦА:** Студентам и подругам важно понимать чек заранее.\n**Доказательства:** Гозе: «цена не соответствует качеству». Mafia House: кальян за 1 800 ₽ разочаровал: https://2gis.ru/ryazan/firm/70000001030233166/tab/reviews\n**Что дают конкуренты:** Цены часто узнают уже на месте.\n**Где разрыв:** Гость не может прикинуть чек.\n**Наша возможность:** Владелец обещает «понятные цены и порции». Публикуем меню с ценами в хайлайтах и 2ГИС до открытия.\n**Уверенность:** Средняя ⚠️ меню к 22.11","group":"3. GAP по отдельности","order":90,"section":"gap","status":"Гипотеза","title":"Цены видны заранее"},{"id":"gp-20","body":"**Тип:** Покупательского опыта\n**Потребность ЦА:** Всем сегментам вечером надо быстро найти вход.\n**Доказательства:** Данные владельца: офисное здание, парковки нет. Отзывов пока нет.\n**Что дают конкуренты:** Большинство конкурентов стоят на первых этажах с вывеской.\n**Где разрыв:** Вход внутри БЦ — барьер на четвёртом этапе CJM.\n**Наша возможность:** Леопардовые лапки до двери, лифт в принте, точка входа в 2ГИС, фото входа в подтверждении брони.\n**Уверенность:** Гипотеза","group":"3. GAP по отдельности","order":100,"section":"gap","status":"Гипотеза","title":"Вход, который легко найти"},{"id":"gp-30","body":"| Что улучшить | Какую потребность закрывает | Чем отличаемся | Ценность для ЦА | Сложность | Что проверить | Статус |\n|---|---|---|---|---|---|---|\n| Стандарт громкости и свет у столов | Наговориться, сделать фото | Единственный светлый и тихий лаунж | Высокая для подруг и пар | Низкая | Замер громкости в пятницу вечером | Уже есть, нужна доработка |\n| «Курить не обязательно» + понятный минимальный чек | Некурящему не быть лишним | Прямо говорим то, что конкуренты запрещают | Высокая: разворачивает всю компанию | Низкая | Решение владельца о минимальном заказе | Гипотеза ⚠️ |\n| Стандарт кальяна: угли по таймеру, перезабивка в первые 10 минут, три вопроса мастера | Стабильный вкус | Гарантия вместо «у нас лучший кальян» | Высокая для ценителей | Средняя: обучение и контроль | Как часто просят перезабить | Нужна доработка |\n| Блюда-герои шефа и 4 завтрака весь день | Нормально поесть | Кальян и кухня одного уровня | Высокая для пар, именинников, офисов | Средняя | Отзывы после soft opening | Уже есть, нужно доказать |\n| Дневной режим: ланч, дневной кальян, розетки и Wi‑Fi | Обед и работа рядом с БЦ | Связка, которой нет у соседей | Средняя–высокая, будний трафик | Средняя | Цены, опрос в БЦ | Гипотеза ⚠️ |\n| Бронь с выбором зоны и пакет «день рождения» | Праздник без накладок | Гость знает, где будет сидеть | Высокая для именинников | Низкая–средняя | Сколько броней ДР в первый месяц | Нужна доработка |\n| Свет у фото-точки с леопардом | Красивые кадры | Главный инста-объект города | Высокая для подруг | Низкая | Количество отметок | Объект есть, нужен свет |\n| Меню с ценами в 2ГИС, Яндексе и хайлайтах до открытия | Понимать чек заранее | Прозрачность | Средняя | Низкая | Готовность меню к 22.11 | Нужна доработка ⚠️ |\n| Раздельный счёт и чаевые по QR | Быстро и без сюрпризов | Гости конкурентов об этом просят | Средняя | Низкая | Возможности кассы | Нужна доработка |\n| Навигация до входа: лапки, фото входа, точка в 2ГИС | Найти вход в БЦ | Снимаем барьер офисного здания | Средняя | Низкая | Есть ли вечером доступ в БЦ | Нужна доработка |","group":"4. Продуктовая отстройка","info":true,"order":10,"section":"gap","title":"Что добавить, изменить или упростить в продукте"},{"id":"gp-41","body":"**Что уже занято конкурентами:** Smoke Elements — «дёшево и каждый день» для ценителей кальяна. Гозе — «уровень и дизайн» для выхода в свет.\n**Где возможность:** Нет места, куда одинаково удобно прийти на завтрак, обед, поработать и вечером с подругами.\n**На чём строить отличие:** Идея владельца «нормальность в хорошем смысле»: стабильно, вкусно, сытно, красиво, недорого, понятно. Слоган «Здесь будет иначе».\n**Чем доказать:** Завтраки весь день, ланч, дневной кальян, понятные цены, стабильный стандарт кальяна.\n**Как сказать языком гостя:** «Māори — ваше место на каждый день: утром кофе, днём обед, вечером кальян с подругами».","group":"5. Позиционирование","order":10,"section":"gap","status":"Гипотеза","title":"Место на каждый день (рекомендуем как основу)"},{"id":"gp-42","body":"**Что уже занято конкурентами:** Тёмные «пещеры» с громкой музыкой — норма почти у всех.\n**Где возможность:** Свет и тишина как главное отличие для подруг и пар.\n**На чём строить отличие:** Светлое помещение, зелень, аквариум, тихий лаунж без танцев.\n**Чем доказать:** Фото зала при свете, стандарт громкости, отзывы гостей.\n**Как сказать языком гостя:** «Здесь слышно друг друга».","group":"5. Позиционирование","order":20,"section":"gap","status":"Гипотеза","title":"Светлый лаунж для разговоров"},{"id":"gp-43","body":"**Что уже занято конкурентами:** Гозе берёт кухню у ресторана-партнёра. Остальные — чай и снеки.\n**Где возможность:** Своя кухня с шефом рядом с сильными мастерами.\n**На чём строить отличие:** Кальяны — 60–70% концепции, кухню поднимаем до их уровня.\n**Чем доказать:** Блюда-герои, фото еды, отзывы о еде, стандарт кальяна.\n**Как сказать языком гостя:** «Пришли за кальяном — останетесь ужинать».","group":"5. Позиционирование","order":30,"section":"gap","status":"Гипотеза","title":"Кальян и кухня одного уровня"},{"id":"gp-44","body":"**Что уже занято конкурентами:** У конкурентов обязательный кальян и минимальные заказы.\n**Где возможность:** Никто не обращается к некурящим.\n**На чём строить отличие:** Формат «ресторан и лаунж», полная кухня.\n**Чем доказать:** Правило «курить не обязательно» в меню и хайлайтах. ⚠️ Нужно решение владельца.\n**Как сказать языком гостя:** «Курить не обязательно — у нас есть кухня, кофе и коктейли».","group":"5. Позиционирование","order":40,"section":"gap","status":"Гипотеза","title":"Рады всей компании"},{"id":"gp-45","body":"**Что уже занято конкурентами:** Тематика рядом уже занята: Вальхалла в БЦ «Капитал».\n**Где возможность:** Лёгкий, светлый, «нормальный» остров без игры в племя.\n**На чём строить отличие:** Леопард 2 м, аквариум 6 м, тропики, принт.\n**Чем доказать:** Фото-точка, «Леопардовый бум» по городу, маскот в контенте.\n**Как сказать языком гостя:** Эмоциональная обёртка для позиций 1–4. Сама по себе причиной выбора не станет: доказательства дают кальян, кухня и свет.","group":"5. Позиционирование","order":50,"section":"gap","status":"Гипотеза","title":"Леопард на острове (упаковка, а не отстройка)"},{"id":"gp-50","body":"Идеи на период после открытия, с декабря. Утверждённый контент-план на 10–22 ноября они не меняют.\n\n## Контентные идеи\n| Сегмент | Проблема | Идея | Почему тестировать |\n|---|---|---|---|\n| Подруги | «Друг друга не слышно» | Рилс «Здесь слышно друг друга»: шёпот за столом, и его слышно | Бьёт в главный страх: темно и громко |\n| Подруги | Тёмные фото в лаунжах | Карусель «Где в Māори лучший свет для фото» | Фото — критерий выбора, будет UGC |\n| Некурящий | Неловкость без кальяна | Рилс «Подруга, которая не курит»: её завтрак, кофе, десерт | Сообщения для некурящих в Рязани нет ни у кого |\n| Ценитель | Кальяны-лотерея | Ритуал мастера: три вопроса, угли по таймеру, перезабивка | Показывает стандарт вместо слов «лучший кальян» |\n| Офис | «Успеем за час?» | Сторис «Обед за 15 минут» с таймером на экране | Проверяем скорость как оффер |\n| Ноутбук | «Можно поработать?» | Пост «Днём у нас тихо»: розетки, Wi‑Fi, чай | Будний дневной трафик |\n| Именинник | Страх испорченного ДР | Карусель «Стол на 8: как мы готовим ваш день рождения» | Самая высокая цена ошибки и самый громкий сарафан |\n| Все | «Наверное, дорого» | Пост «Сколько стоит вечер на троих» с реальным чеком | Прозрачность цены ⚠️ после утверждения меню |\n\n## Гипотезы воронок\n| Сегмент | Воронка | Что проверяем |\n|---|---|---|\n| Офис | Стикер с QR в лифтах БЦ «Капитал» и своего БЦ → меню недели в Telegram → предзаказ | Конверсия из QR в обеды |\n| Подруги | Розыгрыш депозитов: отметить подругу → бронь на 22–30.11 | Сколько броней приходит из розыгрыша |\n| Именинник | Хайлайт «День рождения» → директ → пакет | Брони ДР в месяц |\n| Ноутбук | Пин в 2ГИС «Дневной кальян и Wi‑Fi» → визит днём | Загрузка с 12:00 до 17:00 |\n| Все | QR на чеке → отзыв в 2ГИС или Яндексе | Число отзывов и рейтинг в первый месяц |\n| Подруги | Отметка у леопарда → репост в сторис Māори | Доля гостей, которые отмечают место |","group":"6. Контент и воронки","info":true,"order":10,"section":"gap","title":"Контентные идеи и гипотезы воронок"},{"id":"gp-60","body":"Оценка от 1 до 5 по каждому критерию, итог — сумма.\n\n| Направление | Важно для ЦА | Сила доказательств | Слабость конкурентов | Реализуемость | Итог |\n|---|---|---|---|---|---|\n| Светло и слышно друг друга | 5 | 4 | 4 | 5 | **18** |\n| Стандарт кальяна без лотереи | 5 | 4 | 3 | 4 | **16** |\n| Курить не обязательно | 4 | 4 | 5 | 3 ⚠️ | **16** |\n| Бронь с зонами и пакет «день рождения» | 4 | 3 | 4 | 4 | **15** |\n| Дневной режим: ланч и работа | 4 | 3 | 4 | 3 ⚠️ | **14** |\n| Кухня одного уровня с кальяном | 4 | 2 | 3 | 3 | 12 |\n| Цены видны заранее | 3 | 2 | 3 | 4 | 12 |\n\n**Пять приоритетов:**\n1. Светлый тихий зал.\n2. Стандарт кальяна.\n3. «Курить не обязательно».\n4. Бронь и пакет «день рождения».\n5. Дневной режим для соседних офисов.\n\n**Вывод для позиционирования:** основа — «Место на каждый день» (нормальность). Доказательства — свет, стандарт кальяна и кухня. Леопард и остров — упаковка.","group":"7. Приоритеты","info":true,"order":10,"section":"gap","title":"Приоритизация направлений"},{"id":"gp-70","body":"**Решения владельца, ⚠️:**\n- Можно ли сидеть без кальяна и какой минимальный чек.\n- Цены бизнес-ланча и дневного кальяна.\n- Стандарт углей и перезабивки: закрепить и обучить мастеров.\n- Есть ли вечером свободный доступ в БЦ и где вход.\n- Будет ли меню с ценами к 22.11.\n- Камерные столы и зоны для броней: у леопарда, у аквариума, у окна.\n\n**Проверка исследованием:**\n- Опрос сотрудников трёх соседних офисов, примерно 30 человек: обед, бюджет, время.\n- 10 интервью с девушками 22–28: как выбирают место на вечер.\n- Отзывы о конкурентах в Яндекс Картах и VK, чтобы подтвердить выводы из 2ГИС.\n- Через месяц после открытия — разбор своих отзывов, обновить JTBD и GAP.","group":"7. Приоритеты","info":true,"order":20,"section":"gap","title":"Что спросить у владельца и что проверить"},{"id":"jt-00","body":"**Цель:** понять, КТО приходит в лаунж и ЗАЧЕМ, какую работу гость поручает заведению. Сегменты собраны по общей Job Story, а не по возрасту и полу.\n\n**Источники (ноябрь 2026):**\n- Отзывы гостей шести кальянных Рязани в 2ГИС, около 100 отзывов: Гозе, Вальхалла (БЦ «Капитал», наш сосед), Smoke Elements, Mafia House, Барбарис, HookahPlace Terra (Горького, 102).\n- Выдача 2ГИС: 39 кальянных и лаунжей города, бизнес-ланчи и средние чеки.\n- Ответы владельца на созвоне 06.11 и статистика прошлых проектов: около 70% гостей — девушки, ядро 22–28 лет.\n\n**Как читать:**\n- «Цитата» — дословно из отзыва, со ссылкой.\n- «Мысли в голове» — реконструкция по мотивам отзывов, а не прямая речь.\n- Статус «Гипотеза» — данных пока мало, нужна проверка.\n\n**Ограничения:**\n- Не разбирали Яндекс Карты, VK и Telegram.\n- Интервью не проводили.\n- Отзывы в 2ГИС смещены в позитив: заведения просят гостей их оставлять. Поэтому негатив весит больше.\n\n**Что дальше:** 10 коротких интервью с девушками 22–28 и опрос в лифтах соседних БЦ. По итогам — подтвердить или убрать гипотезы.\n\nСписок кальянных: https://2gis.ru/ryazan/search/кальянная","group":"1. Об исследовании","info":true,"order":10,"section":"jtbd","title":"Как и на чём собрана сегментация"},{"id":"jt-01","body":"**Core Job:** вечер с подругами, на котором можно спокойно поговорить, вкусно покурить и уйти с красивыми фото.\n\n**Job Story:** КОГДА мы с подругами наконец договорились встретиться после рабочей недели, Я ХОЧУ выбрать светлое и чистое место с хорошим кальяном и негромкой музыкой, ЧТОБЫ наговориться, сделать пару красивых кадров и не просидеть вечер в тёмном подвале.\n\n**Главный триггер:** в общем чате спросили «куда идём в пятницу?». Поводом бывает встреча после перерыва, новости или просто конец недели.\n\n**Последняя капля:** в прошлый раз было темно, громко и накурено. Не поговорили, и фото не получились.\n\n**Главный страх:** отдать вечер и 2–3 тыс. ₽ месту, где не слышно друг друга, кальян горчит, а за соседним столом шумная компания.\n\n**Мысли в голове:**\n- «Куда пойдём, чтобы и посидеть, и сфоткаться?»\n- «Только не опять в тёмную кальянную, где друг друга не слышно».\n- «Посмотрю фото гостей в 2ГИС: там правда так красиво?»\n- «Главное, чтобы кальян не горчил и были нормальные лимонады».\n\n**Критерии выбора:**\n- Светло и чисто: видно интерьер и лица в кадре.\n- Музыка не мешает разговору.\n- Стабильный кальян средней крепости, фруктовые вкусы.\n- Кофе в будни, коктейли и лимонады в пятницу и субботу.\n- Есть фотогеничная точка.\n\n**Как принимает решение:** видит сторис подруги или Instagram заведения → открывает карточку в 2ГИС или Яндексе: рейтинг, фото гостей, свежие отзывы → верит подругам и фото гостей больше, чем рекламе → проверяет свет, шум и отзывы про кальян → выбирает место, где «красиво и уютно» и где подруги уже были.\n\n**Ключевое сообщение:** здесь светло и тихо. Можно наговориться и уйти с хорошими фото.\n\n**Подтверждения:**\n- Владелец: около 70% гостей прошлых проектов — девушки, они приходят с подругами (созвон 06.11).\n- Гозе: гости жалуются, что из-за громкой музыки тяжело разговаривать, и на слишком тёмный столик: https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews\n- Вальхалла: гостям не хватает освещения, чтобы рассмотреть интерьер: https://2gis.ru/ryazan/firm/70000001076263270/tab/reviews","group":"2. Сегменты","order":10,"section":"jtbd","status":"Подтверждено","title":"Подруги на вечер — наговориться в светлом и красивом месте"},{"id":"jt-02","body":"**Core Job:** провести вечер с курящими друзьями, самому не куря и не переплачивая за ненужный кальян.\n\n**Job Story:** КОГДА друзья зовут в кальянную, а я не курю или сегодня не хочу, Я ХОЧУ спокойно заказать кофе, еду или коктейль и сидеть сколько нужно, ЧТОБЫ не быть лишним и не платить за кальян, который мне не нужен.\n\n**Главный триггер:** компания выбрала кальянную, а он или она не курит. Или днём хочется просто посидеть с напитком.\n\n**Последняя капля:** попросили уйти или «докупить кальян», хотя гости уже оставили больше 700 ₽ за напитки. Другой вариант: «странное правило» заказывать два кальяна.\n\n**Главный страх:** неловкость и спор с персоналом при друзьях и выброшенные деньги.\n\n**Мысли в голове:**\n- «А меня пустят, если я не буду курить?»\n- «Не хочу платить за кальян, который мне не нужен».\n- «Там можно нормально поесть, кроме чая?»\n\n**Критерии выбора:**\n- Нет обязательного кальяна, или минимальный чек известен заранее.\n- Полноценная кухня и напитки.\n- Хорошая вытяжка: за столом не дымно.\n- Персонал не давит.\n\n**Как принимает решение:** идёт за компанией → заранее спрашивает в директе или читает отзывы → проверяет правила посадки и меню → выбирает место, где рады всем.\n\n**Ключевое сообщение:** мы рады всей компании. Курить не обязательно: есть кухня, кофе и коктейли.\n\n**Подтверждения:**\n- Барбарис: двух некурящих гостий днём попросили уйти, потому что они не заказали кальян, хотя чек за напитки был больше 700 ₽: https://2gis.ru/ryazan/firm/70000001034070398/tab/reviews\n- Гозе: гостья называет «очень странным» правило заказывать два кальяна: https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews\n\n⚠️ Чтобы использовать это сообщение, нужно решение владельца о правилах минимального заказа.","group":"2. Сегменты","order":20,"section":"jtbd","status":"Есть подтверждения","title":"Некурящий в компании — не чувствовать себя лишним"},{"id":"jt-03","body":"**Core Job:** хороший кальян под свой вкус каждый раз, а не через раз.\n\n**Job Story:** КОГДА я после работы иду покурить с друзьями, Я ХОЧУ, чтобы мастер забил именно то, что я попросил, и весь вечер следил за углями, ЧТОБЫ не отдать 1 000–1 800 ₽ за горький или «пустой» кальян.\n\n**Главный триггер:** конец рабочего дня или выходные, хочется попробовать новый табак или вкус, друг посоветовал мастера.\n\n**Последняя капля:** кальян горчит и быстро прогорает, угли не меняют, вместо заказанного забили «то, что было».\n\n**Главный страх:** плохой кальян испо
