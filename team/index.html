ртит вечер, а деньги уже потрачены.\n\n**Мысли в голове:**\n- «Главное — кто сегодня на смене».\n- «Есть ли нормальная полка: Darkside, Tangiers, Трофимов?»\n- «Угли будут менять сами или каждый раз звать?»\n- «Если горчит, перезабьют бесплатно?»\n\n**Критерии выбора:**\n- Конкретный мастер и стабильное качество.\n- Ассортимент табака.\n- Угли меняют по времени, без напоминаний.\n- Бесплатная перезабивка.\n- Вытяжка.\n- Цена соответствует качеству.\n\n**Как принимает решение:** сарафан и «свой мастер» → отзывы в 2ГИС, где мастеров хвалят по имени → проверяет полку табака и цену кальяна → выбирает «стабильное» место и ходит туда годами.\n\n**Ключевое сообщение:** за этот кальян не страшно: стабильный вкус, угли по таймеру и бесплатная перезабивка, если что-то не так.\n\n**Подтверждения:**\n- Mafia House: кальян за 1 800 ₽ принесли непрогретым, жара не хватило. В позитивных отзывах хвалят, что угли меняют раз в 30 минут, а один гость ходит туда больше 7 лет: https://2gis.ru/ryazan/firm/70000001030233166/tab/reviews\n- Барбарис: жалобы «горчит, быстро прогорает» и «просили с ягодами — принесли безвкусный». В плюсах — табаки от Darkside до Tangiers и бесплатная перезабивка: https://2gis.ru/ryazan/firm/70000001034070398/tab/reviews\n- Владелец: кальяны — главная сильная сторона, мастера — профи из его бывших учеников, ставка на стабильность.","group":"2. Сегменты","order":30,"section":"jtbd","status":"Подтверждено","title":"Ценитель кальяна — стабильный кальян без лотереи"},{"id":"jt-04","body":"**Core Job:** нормальный обед в двух шагах, который укладывается в обеденный перерыв.\n\n**Job Story:** КОГДА у меня обед в бизнес-центре, Я ХОЧУ быстро и сытно поесть рядом, ЧТОБЫ вернуться вовремя и уложиться в привычные 400–600 ₽.\n\n**Главный триггер:** с 12:30 до 14:00 коллеги зовут на обед, а столовая и доставка надоели.\n\n**Последняя капля:** блюдо несли так долго, что опоздал на встречу.\n\n**Главный страх:** не успеть, переплатить, остаться голодным после «ресторанной» порции.\n\n**Мысли в голове:**\n- «Успеем за час?»\n- «Есть бизнес-ланч или только меню?»\n- «Сколько будет стоить обедать там каждый день?»\n\n**Критерии выбора:**\n- Скорость отдачи.\n- Цена ланча на уровне города: от 290 до 850 ₽, чаще от 500 ₽.\n- Можно дойти пешком, парковка не нужна.\n- Понятное меню на неделю.\n- Предзаказ.\n\n**Как принимает решение:** слышит от коллег, видит баннер или стикер в лифте БЦ → смотрит меню ланча в Telegram, Instagram или 2ГИС → пробует один раз с коллегами → если быстро и сытно, ходит регулярно.\n\n**Ключевое сообщение:** обед в соседнем доме: быстро, сытно и по понятной цене.\n\n**Подтверждения:**\n- Владелец: первые 4–5 часов работы — трафик ближних офисов, ставка на скорость, позже предзаказ через приложение.\n- Рынок в 2ГИС: бизнес-ланчи в Рязани от 290 до 850 ₽. В «Небе» ланч от 500 ₽. «Хинкальный дом» по будням до 17:00 даёт скидку 25%: https://2gis.ru/ryazan/search/бизнес-ланч\n- Отзывов офисных гостей о кальянных нет. Сегмент проверяем опросом в БЦ «Капитал», своём БЦ и офисе МТС.","group":"2. Сегменты","order":40,"section":"jtbd","status":"Гипотеза","title":"Сотрудник соседнего офиса — быстро и сытно пообедать"},{"id":"jt-05","body":"**Core Job:** несколько продуктивных часов вне дома и офиса, без неудобств.\n\n**Job Story:** КОГДА мне нужно поработать вне дома или офиса, Я ХОЧУ тихое место с розеткой, Wi‑Fi, чаем и недорогим дневным кальяном, ЧТОБЫ спокойно поработать пару часов и не чувствовать, что меня торопят.\n\n**Главный триггер:** удалёнка, окно между встречами, дома не работается.\n\n**Последняя капля:** шумно, нет розетки, официант намекает, что пора освободить стол.\n\n**Главный страх:** потерять рабочие часы и переплатить.\n\n**Мысли в голове:**\n- «Можно там посидеть с ноутбуком?»\n- «Есть дневной кальян подешевле?»\n- «У стола будет розетка?»\n\n**Критерии выбора:**\n- Днём тихо.\n- Розетки и Wi‑Fi.\n- Дневной или бизнес-кальян: у конкурентов около 700 ₽.\n- Чай без ограничений.\n- Удобный стол.\n\n**Как принимает решение:** находит место рядом на карте → читает отзывы о том, можно ли там поработать → пробует → если удобно, ходит почти каждый день. Это самый частый гость из всех сегментов.\n\n**Ключевое сообщение:** днём здесь тихо: розетки, Wi‑Fi, чай и дневной кальян. Работайте сколько нужно.\n\n**Подтверждения:**\n- Smoke Elements: постоянный гость почти каждый день берёт бизнес-кальян за 700 ₽ и отмечает, что с ноутбуком там удобно. Ещё один гость пришёл поработать на удалёнке: https://2gis.ru/ryazan/firm/70000001021366903/tab/reviews\n- Гозе: место хвалят как подходящее «для продуктивного рабочего дня»: https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews\n- Mafia House: гостья заходит в перерывах между работой: https://2gis.ru/ryazan/firm/70000001030233166/tab/reviews","group":"2. Сегменты","order":50,"section":"jtbd","status":"Есть подтверждения","title":"Днём с ноутбуком — поработать в тишине с чаем и кальяном"},{"id":"jt-06","body":"**Core Job:** праздник для своей компании без накладок.\n\n**Job Story:** КОГДА я собираю друзей на день рождения, Я ХОЧУ заранее забронировать стол, за которым все поместятся, с вкусной едой и кальянами, ЧТОБЫ праздник прошёл гладко и мне не было неловко перед гостями.\n\n**Главный триггер:** до дня рождения или другого повода 1–3 недели.\n\n**Последняя капля:** на прошлом празднике стол был маленький, еда невкусная, а пересесть не дали, хотя зал пустовал.\n\n**Главный страх:** праздник испорчен у всех на глазах, и виноват тот, кто выбрал место.\n\n**Мысли в голове:**\n- «Мы все поместимся за этот стол?»\n- «Еда там нормальная или только кальяны?»\n- «Будет ли что-то для именинника?»\n- «Сколько выйдет на человека?»\n\n**Критерии выбора:**\n- Стол или зона под количество гостей.\n- Уверенность в кухне.\n- Персонал идёт навстречу.\n- Понятный счёт на компанию, который можно разделить.\n- Бонус имениннику.\n\n**Как принимает решение:** начинает за 1–3 недели → сравнивает 3–4 места по фото зала и отзывам о еде → звонит или пишет, уточняет стол и депозит → выбирает тех, кто ответил быстро и понятно.\n\n**Ключевое сообщение:** отметьте у нас: подберём стол под вашу компанию, вкусно накормим, а имениннику — подарок.\n\n**Подтверждения:**\n- Гозе, два отзыва о днях рождения. В первом: маленький стол у приставки, пересесть не дали из-за брони, невкусная паста. Во втором гостья жалеет, что выбрала это место для своего праздника. Скидку имениннику 10% там дали: https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews","group":"2. Сегменты","order":60,"section":"jtbd","status":"Есть подтверждения","title":"Именинник-организатор — отметить так, чтобы не было неловко перед гостями"},{"id":"jt-07","body":"**Core Job:** уютный вечер вдвоём, где можно поговорить наедине.\n\n**Job Story:** КОГДА мы хотим провести вечер вдвоём, Я ХОЧУ место с уединённым столиком, приятным светом и вкусной едой, ЧТОБЫ было романтично, но без пафоса и цен дорогого ресторана.\n\n**Главный триггер:** свидание, годовщина или «давно никуда не выбирались».\n\n**Главный страх:** посадят в проходе или у туалета, рядом окажется шумная компания.\n\n**Мысли в голове:**\n- «Есть там уединённые столики?»\n- «Можно и поесть, не только покурить?»\n- «Не слишком ли пафосно и дорого?»\n\n**Критерии выбора:**\n- Камерные столики или VIP-зона без доплаты.\n- Свет приглушённый, но не тёмный.\n- Кухня.\n- Адекватный чек на двоих.\n\n**Как принимает решение:** рекомендации или Instagram → фото зала → бронь конкретного стола.\n\n**Ключевое сообщение:** уютный столик на двоих в тропиках, без пафоса и по понятной цене.\n\n**Подтверждения:**\n- Барбарис: пара сидела в VIP-комнате, с понедельника по четверг она без доплаты: https://2gis.ru/ryazan/firm/70000001034070398/tab/reviews\n- Гозе: хвалят столики «в отдалении» для уединения, но в другом отзыве жалуются, что при пустом зале посадили у туалета: https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews\n\nСегмент пока на гипотезе: у Māори нет данных о камерных зонах.","group":"2. Сегменты","order":70,"section":"jtbd","status":"Гипотеза","title":"Пара на свидание — уединение без ресторанного пафоса"},{"id":"jt-10","body":"| Сегмент | Core Job | Job Story | Главный триггер | Главный страх | Мысли в голове | Критерии выбора | Как принимает решение | Ключевое сообщение |\n|---|---|---|---|---|---|---|---|---|\n| Подруги на вечер | Наговориться, вкусно покурить, уйти с красивыми фото | Когда наконец встречаемся после недели → хочу светлое место с хорошим кальяном и негромкой музыкой → чтобы наговориться и не сидеть в подвале | «Куда идём в пятницу?» в чате | Темно, громко, горчит — вечер и 2–3 тыс. ₽ впустую | «Только не опять тёмная кальянная» | Свет и чистота, тишина, стабильный кальян, напитки, фото-точка | Сторис подруг → 2ГИС (фото гостей) → верит подругам → место, где подруги уже были | Светло и тихо: можно наговориться и уйти с хорошими фото |\n| Некурящий в компании | Быть с друзьями и не платить за ненужный кальян | Когда компания идёт в кальянную, а я не курю → хочу сидеть с кофе или едой → чтобы не быть лишним | Компания выбрала кальянную | Попросят уйти или «докупить кальян» | «А меня пустят без кальяна?» | Нет обязательного кальяна, кухня, вытяжка, нет давления | Идёт за компанией → спрашивает в директе или читает отзывы | Рады всей компании: курить не обязательно |\n| Ценитель кальяна | Стабильно хороший кальян каждый раз | Когда иду покурить после работы → хочу, чтобы забили то, что прошу, и следили за углями → чтобы не отдать 1 000–1 800 ₽ за горечь | Конец дня, новый табак, совет друга | Горький или «пустой» кальян за полную цену | «Кто сегодня на смене?» | Мастер, полка табака, угли по таймеру, перезабивка | Сарафан → отзывы о мастерах → полка и цена → ходит годами | За этот кальян не страшно: стабильно и с бесплатной перезабивкой |\n| Сотрудник соседнего офиса | Быстрый сытный обед рядом | Когда обед в БЦ → хочу поесть в двух шагах → чтобы успеть и уложиться в 400–600 ₽ | 12:30–14:00, коллеги зовут | Не успеть, переплатить | «Успеем за час?» | Скорость, цена ланча, пешком, меню недели | Коллеги или лифт → меню онлайн → проба → регулярно | Обед в соседнем доме: быстро, сытно, по понятной цене |\n| Днём с ноутбуком | Продуктивные часы вне дома | Когда надо поработать вне дома → хочу тихо, розетку, Wi‑Fi и дневной кальян → чтобы не торопили | Удалёнка, окно между встречами | Шум, нет розетки, торопят | «Можно с ноутбуком?» | Тишина, розетки, Wi‑Fi, дневной кальян около 700 ₽, чай | Карта рядом → отзывы про работу → ходит почти каждый день | Днём тихо: розетки, Wi‑Fi и дневной кальян |\n| Именинник-организатор | Праздник без накладок | Когда собираю друзей на ДР → хочу стол на всех, вкусную еду и кальяны → чтобы не было неловко | Повод через 1–3 недели | Испорченный праздник на глазах у всех | «Мы все поместимся?» | Стол под компанию, кухня, гибкость, делёж счёта, бонус | Сравнивает 3–4 места → звонит → выбирает, кто ответил понятно | Подберём стол, вкусно накормим, имениннику подарок |\n| Пара на свидание | Уютный вечер вдвоём | Когда хотим вечер вдвоём → хочу уединённый столик и вкусную еду → чтобы романтично без пафоса | Свидание, годовщина | Посадят у туалета или рядом с шумной компанией | «Есть уединённые столики?» | Камерность, свет, кухня, чек на двоих | Рекомендации → фото зала → бронь стола | Уютный столик на двоих, без пафоса |","group":"3. Сводная JTBD-таблица","info":true,"order":10,"section":"jtbd","title":"Сравнительная JTBD-таблица"},{"id":"jt-11","body":"| Сегмент | Наблюдение | Что подтверждает | Тип | Ссылка |\n|---|---|---|---|---|\n| Подруги на вечер | Около 70% гостей прошлых проектов владельца — девушки, приходят с подругами | Размер и ядро сегмента | Данные владельца | Созвон 06.11 |\n| Подруги на вечер | «Музыка играет громко, разговаривать тяжело» | Страх «не поговорим» | Цитата | https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews |\n| Подруги на вечер | Жалобы: «было слишком темно» (Гозе), «не хватает немного освещения» (Вальхалла) | Свет как критерий выбора | Цитаты | https://2gis.ru/ryazan/firm/70000001076263270/tab/reviews |\n| Некурящий в компании | Некурящих гостий попросили уйти, потому что они не заказали кальян, хотя чек был больше 700 ₽ | Последняя капля и страх | Пересказ отзыва | https://2gis.ru/ryazan/firm/70000001034070398/tab/reviews |\n| Некурящий в компании | «Очень странное правило заказать 2 кальяна» | Обязаловка раздражает | Цитата | https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews |\n| Ценитель кальяна | Кальян за 1 800 ₽ не раскурен, жара не хватало | Цена ошибки и страх | Пересказ отзыва | https://2gis.ru/ryazan/firm/70000001030233166/tab/reviews |\n| Ценитель кальяна | «Горчит и быстро прогорает» | Главная боль | Цитата | https://2gis.ru/ryazan/firm/70000001034070398/tab/reviews |\n| Ценитель кальяна | Хвалят угли «раз в 30 минут» и «вовремя, без напоминаний» | Критерий: угли по таймеру | Цитаты | https://2gis.ru/ryazan/firm/70000001030233166/tab/reviews |\n| Сотрудник офиса | Бизнес-ланчи в городе от 290 до 850 ₽, у конкурентов скидки до 17:00 | Ценовой коридор | Данные 2ГИС | https://2gis.ru/ryazan/search/бизнес-ланч |\n| Сотрудник офиса | Первые 4–5 часов — офисы рядом, парковки нет | Сценарий и ограничение | Данные владельца | Созвон 06.11 |\n| Днём с ноутбуком | Бизнес-кальян за 700 ₽ почти ежедневно, «удобно для работы с ноутбуком» | Сегмент существует и ходит часто | Пересказ отзыва | https://2gis.ru/ryazan/firm/70000001021366903/tab/reviews |\n| Днём с ноутбуком | Место хвалят «для продуктивного рабочего дня» | Повторяется у разных заведений | Цитата | https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews |\n| Именинник | Маленький стол у приставки, не пересадили, невкусная паста | Страх испорченного праздника | Пересказ отзыва | https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews |\n| Пара | VIP-комната без доплаты с понедельника по четверг, пришёл с женой | Запрос на уединение | Пересказ отзыва | https://2gis.ru/ryazan/firm/70000001034070398/tab/reviews |\n| Все | Сосед по БЦ «Капитал» (Вальхалла) любят за тематику и рассказы мастера о легендах | Тематика работает, но рядом уже занята | Вывод | https://2gis.ru/ryazan/firm/70000001076263270/tab/reviews |","group":"4. Доказательства и выводы","info":true,"order":20,"section":"jtbd","title":"Таблица доказательств"},{"id":"jt-12","body":"- **Вечер и день — две разные работы.** Вечером гость покупает разговор и атмосферу (подруги, пара, именинник). Днём — время и скорость (офис, ноутбук). Эти сообщения нельзя смешивать в одном посте.\n- **Подруги и ценитель кальяна платят за разное.** Для подруг кальян — фон, важны свет, тишина и фото. Для ценителя кальян — главное, интерьер вторичен. Владелец прав, что парни приходят за девушками, но удерживает их только стабильный кальян.\n- **Некурящий — скрытый сегмент.** Он сам не выбирает место, но может развернуть всю компанию. Почти в каждой компании девушек есть кто-то, кто не курит.\n- **У именинника самая высокая цена ошибки.** Один плохой праздник даёт громкий негативный отзыв, один хороший — сразу 6–10 новых гостей.\n- **Офис и ноутбук дают будний трафик**, а значит загрузку зала с 12:00 до 18:00, когда лаунж обычно пустой.\n- **Что не стало отдельным сегментом.** «Студенты» — это не работа, а ценовая чувствительность внутри других сегментов. «Фото-гости» — критерий подруг, а не отдельная задача. «Гости города» встречаются в отзывах, но их мало. Старые гипотезы — в разделе «Аудитория».","group":"4. Доказательства и выводы","info":true,"order":30,"section":"jtbd","title":"Чем сегменты отличаются друг от друга"},{"id":"kb-01","body":"Маори — коренной народ Новой Зеландии, часть большой полинезийской семьи. Их предки приплыли на больших каноэ «вака» из Восточной Полинезии примерно в 1250–1300 годах. Прародину в преданиях называют Гаваики.\n\nСвою страну маори называют **Аотеароа**. Обычно это переводят как «земля длинного белого облака». Сегодня маори — это примерно 17–18% населения Новой Зеландии.\n\nСлово «māori» на языке маори значит «обычный, естественный, настоящий». Так люди называли себя, чтобы отличать от пришельцев-европейцев (их называют «пакеха»).\n\n## Что взять в бренд\n- Идею «настоящего, естественного»: она хорошо ложится на тёплый, неглянцевый тон.\n- Историю плавания к новой земле: Māори как остров, к которому приплываешь из обычной Рязани.","group":"Маори","order":10,"section":"knowledge","title":"Кто такие маори"},{"id":"kb-02","body":"Черта над буквой (макрон) в языке маори обозначает долгий гласный: «Mā» тянется. По-русски слово обычно пишут «маори» с ударением на первый слог: ма́ори. Во множественном числе слово не меняется.\n\nВладелец пишет название смешанно: латинская «Mā» и кириллица «ори». Это сильный визуальный ход: макрон превращается в фирменный знак.\n\n## Что предложить\n- Сделать макрон самостоятельным элементом айдентики: черта над буквой как линия горизонта острова.\n- Зафиксировать в брендбуке одно написание и следить, чтобы в макетах не терялась «ā».\n- Уточнить на брифе ударение. От него зависят видео, аудиореклама и то, как гости будут называть место.","group":"Маори","order":20,"section":"knowledge","title":"Название и макрон: Māори"},{"id":"kb-03","body":"## Манаакитанга (manaakitanga)\nЗабота о госте, щедрость и уважение. Буквально — поднимать «ману» (достоинство, силу) гостя. Хозяин, который хорошо принимает гостя, сам становится уважаемее. Это готовая философия сервиса.\n## Фанаунгатанга (whanaungatanga)\nЧувство родства и принадлежности. Именно оно даёт ощущение, что ты среди своих.\n## Фа́нау (whānau)\nСемья в широком смысле: родные, друзья, своя компания.\n## Ка́и (kai)\nЕда. Хорошее короткое слово для рубрик меню.\n## Хонги (hongi)\nТрадиционное приветствие: люди касаются носами и лбами и обмениваются дыханием жизни. Красивая метафора, но изображать её в рекламе стоит осторожно.\n## Киа ора (kia ora)\nСамое известное приветствие: «будь здоров», «привет», «спасибо». В Новой Зеландии его используют все, оно подходит для бережного использования.\n\n## Что взять в бренд\n- Сервисный манифест на основе манаакитанги.\n- Названия зон или рубрик: «Ка́и», «Фа́нау».\n- Каждому элементу даём короткую расшифровку смысла.","group":"Маори","order":30,"section":"knowledge","title":"Ценности маори, которые подходят гостеприимству"},{"id":"kb-04","body":"## Можно использовать бережно и с объяснением\n- **Кору** — спираль разворачивающегося побега папоротника. Символ нового начала, роста и гармонии. Подходит месту, которое только открывается, и хорошо сочетается с тропической зеленью.\n- **Серебристый папоротник** — национальный символ Новой Зеландии.\n- **Пуна́му** — новозеландский нефрит, зелёный камень. Ценный подарок, символ связи между людьми. Красивая отсылка для палитры.\n- **Мата́рики** — новый год маори, связанный с восходом Плеяд в конце июня или начале июля. С 2022 года это государственный праздник Новой Зеландии. Готовый повод для летнего ивента.\n## Лучше не использовать\n- **Та моко** — традиционная татуировка лица и тела. Это сакральный знак рода и личной истории, а не орнамент. Если копировать его на мерч, меню или стены, бренд быстро обвинят в присвоении чужой культуры.\n- **Хака** — ритуальный танец. Самая известная хака, «Ka Mate», в Новой Зеландии закреплена законом за племенем Нгати Тоа (2014). Пародии и «хака-флешмобы» воспринимаются плохо.\n- **Хеи-тики и резные фигуры предков** — священные изображения. Тики-кружки в барах относятся к американской культуре, а не к маори, и подавать их нужно как поп-тропики.\n## Вывод\nОпираемся на ценности, природу и путешествие по океану. Сакральные знаки не берём.","group":"Маори","order":40,"section":"knowledge","title":"Символы и узоры: что можно, а что нельзя"},{"id":"kb-05","body":"Полинезия — это тысячи островов в Тихом океане внутри огромного треугольника: Гавайи на севере, Новая Зеландия на юго-западе, остров Пасхи (Рапа-Нуи) на юго-востоке. Внутри находятся Таити, Самоа, Тонга, Острова Кука, Маркизские острова.\n\nПолинезийцы — одни из лучших мореплавателей в истории. Без компаса и карт они ориентировались по звёздам, волнам, ветрам и птицам и заселили острова на тысячи километров вокруг.\n\n## Что взять в бренд\n- Мотив путешествия и навигации по звёздам.\n- Аквариум на 6 метров как частица океана, по которому шли каноэ.\n- Остров как место, где «всё будет иначе»: другие правила, другой ритм, тепло.","group":"Полинезия","order":50,"section":"knowledge","title":"Полинезийский треугольник"},{"id":"kb-06","body":"Почти всё, что мы называем «тропическим баром», придумано в США. В 1933 году в Голливуде открылся бар Don the Beachcomber с ромовыми коктейлями и «полинезийским» декором. Затем появился Trader Vic's. Именно там в 1940-х придумали **Май Тай**: по легенде, гость с Таити попробовал коктейль и сказал «maita'i», то есть «хорошо».\n\n## Что взять в бренд\n- Классику тики: Май Тай, Зомби, Пина Колада. Их можно переосмыслить в авторской линейке.\n- Подачу: фрукты, зелень, огонь, необычная посуда.\n- Важно помнить, что тики — это американская фантазия о Полинезии. Подаём её с иронией и любовью и не выдаём за подлинную культуру маори.","group":"Полинезия","order":60,"section":"knowledge","title":"Тики-культура и коктейли"},{"id":"kb-07","body":"Леопард (Panthera pardus) — большая кошка из рода пантер. Живёт в Африке и Азии: от саванн и тропических лесов до гор и снежной тайги.\n\n## Факты, которые цепляют\n- Узор из розеток у каждого леопарда уникален, как отпечаток пальца.\n- Лучший древолаз среди больших кошек: затаскивает добычу на дерево, иногда тяжелее себя.\n- Одиночка и ночной охотник. Активнее всего в сумерках и ночью, как и лаунж.\n- Бегает до 58 км/ч, прыгает до 6 метров в длину и до 3 метров вверх.\n- Хорошо плавает.\n- Чёрная пантера чаще всего тот же леопард, только с тёмным окрасом. Розетки у неё никуда не деваются, их видно при правильном свете.\n- Голос леопарда похож на звук пилы: короткий хриплый «распил».\n\n## Что взять в бренд\n- «Уникальный, как розетки леопарда» — про каждого гостя и каждый вечер.\n- Ночную природу хищника — для поздних вечеринок и ночного меню.\n- Скрытые розетки чёрной пантеры — для тёмной версии айдентики и тизеров в духе «присмотритесь».","group":"Леопард","order":70,"section":"knowledge","title":"Леопард: главное о звере"},{"id":"kb-08","body":"В России живут два подвида леопарда, и это сильный локальный повод.\n- **Дальневосточный (амурский) леопард** — самый редкий в мире. В начале 2000-х их оставалось около 30–40, а сейчас, по данным нацпарка «Земля леопарда» в Приморье, больше 100. Это одна из самых успешных историй спасения вида.\n- **Переднеазиатский леопард** возвращается на Кавказ: животных разводят в центре восстановления в Сочинском нацпарке и выпускают в дикую природу.\n\n## Что взять в бренд\n- Благотворительную механику: часть выручки с фирменного коктейля или мерча передаём фонду защиты леопарда. Формат и партнёра нужно проверить отдельно.\n- Только искусственный мех и принт. Позиция бренда: «мы любим леопардов живыми».","group":"Леопард","order":80,"section":"knowledge","title":"Леопарды в России"},{"id":"kb-09","body":"- **Дионис**, греческий бог вина и праздника, ездил на колеснице, запряжённой пантерами, и носил пятнистую шкуру. Выходит, что леопард — древний покровитель бара.\n- В Древнем Египте шкуру леопарда носили жрецы, а в Африке её веками считали знаком власти вождей.\n- В сказке Редьярда Киплинга «Откуда у леопарда пятна» (1902) пятна появляются, чтобы леопард мог прятаться в пёстрой тени леса.\n- В геральдике «леопардами» называли идущих львов на гербах Англии и Нормандии.\n\n## Что взять в бренд\n- Легенду о Дионисе — для барной карты и тоста заведения.\n- Сюжет Киплинга — для своей сказки о том, как леопард получил пятна на острове Māори. Готовая история для маскота.","group":"Леопард","order":90,"section":"knowledge","title":"Леопард в культуре и мифах"},{"id":"kb-10","body":"- В 1947 году Кристиан Диор показал в первой коллекции платья с леопардовым принтом. С тех пор принт считается символом смелой женственности.\n- В 1962 году Жаклин Кеннеди появилась в леопардовом пальто от Олега Кассини. Это вызвало ажиотаж и массовую охоту на леопардов, и позже Кассини об этом сожалел. Отсюда важная позиция: принт — да, натуральный мех — никогда.\n- Потом принт носили панки и рок-звёзды, его любили Roberto Cavalli и Saint Laurent. Сегодня в моде его считают почти нейтральным: он сочетается со многим.\n- Значения: уверенность, игра, немного дерзости, «я не боюсь быть заметным».\n\n## Правило дозировки\nНа светлой базе принт работает как акцент: примерно 10–20% поверхности. Если принта больше, он перестаёт быть фишкой и превращается в шум.","group":"Леопард","order":100,"section":"knowledge","title":"Леопардовый принт в моде"},{"id":"kb-11","body":"Главный парадокс концепции: в Полинезии и Новой Зеландии леопарды не водятся. В Новой Зеландии вообще нет местных наземных хищников: из коренных млекопитающих там живут только летучие мыши.\n\nЭто не проблема, а сюжет. Леопард на острове — пришелец, который нашёл место, где «всё будет иначе». Как гость, который приходит из обычного города и остаётся, потому что здесь тепло и все свои.\n\n## Черновик легенды\nЛеопард устал от жизни, где все бегут и прячутся. Он доплыл до острова, где никто не охотится, где тепло и зелено, а вода прозрачная, как в аквариуме. Здесь он перестал прятать пятна и стал хозяином, который встречает гостей. Каждая розетка на его шкуре — история человека, который пришёл сюда впервые.\n\n## Как использовать\n- Имя маскоту выбираем вместе с подписчиками. Голосование само по себе прогревает аудиторию.\n- Двухметровый леопард в зале — главный персонаж контента: у него есть характер, привычки и любимый коктейль.\n- «Леопардовый бум в Рязани» — это следы того, что леопард уже в городе.","group":"Как связать остров и леопарда","order":110,"section":"knowledge","title":"Леопард на острове: легенда бренда"},{"id":"kb-12","body":"У каждого элемента бренда есть короткая расшифровка. Список пополняем: всё, что придумываем для дизайна и PR, получает свою строку.\n- **Макрон над «ā»** — линия горизонта: за ней начинается остров.\n- **Розетки** — каждая уникальна, как каждый гость.\n- **Кору, побег папоротника** — новое начало.\n- **Аквариум** — частица океана, по которому плыли к острову.\n- **Банановые листья** — тень и укрытие, место, где можно выдохнуть.\n- **Леопард-хозяин** — манаакитанга: гость здесь важнее всех.","group":"Как связать остров и леопарда","order":120,"section":"knowledge","title":"Словарь смыслов: зачем каждая деталь"},{"id":"kb-13","body":"Māori — название реального народа, и бренды уже получали за это критику.\n- В 2001 году LEGO после жалоб маори переименовала часть персонажей линейки Bionicle, в именах которых были слова языка маори.\n- В Новой Зеландии при ведомстве по товарным знакам работает консультативный комитет маори. Он проверяет, не оскорбительны ли товарные знаки с маорийскими словами и образами.\n\n## Наши правила\n- Не используем сакральные знаки: та моко, изображения предков, хаку.\n- Не делаем карикатуры: «дикари», юбки из травы, раскрашенные лица.\n- Говорим о вдохновении: «остров, близкий по духу Полинезии», а не «настоящая культура маори».\n- Если используем слова маори, переводим и объясняем их с уважением.","group":"Риски и право","order":130,"section":"knowledge","title":"Культурная чувствительность"},{"id":"kb-14","body":"Это не юридическая консультация. Перед запуском всё нужно сверить с юристом.\n- **Кальяны.** Закон «О рекламе» (ст. 7) запрещает рекламу табака, никотиносодержащей продукции и курительных принадлежностей, включая кальяны. В контенте кальян показываем только как часть атмосферы: без цен, призывов и акций.\n- **Алкоголь.** Статья 21 того же закона жёстко ограничивает рекламу алкоголя, в том числе в интернете. Коктейли показываем как гастрономию и атмосферу, без призывов к употреблению и без скидок на алкоголь.\n- **Маркировка.** Платную рекламу в интернете (блогеры, посевы, таргет) нужно маркировать и регистрировать через ОРД (erid).\n- **Instagram.** Компания Meta признана в России экстремистской, таргетированную рекламу там не запускаем. Instagram оставляем витриной, а платное продвижение ведём через VK, Telegram, Яндекс Карты и 2ГИС.\n- **Уличные акции.** За граффити и стикеры на чужой собственности предусмотрена административная ответственность. Для «Леопардового бума» ищем согласованные поверхности, партнёров и легальные форматы.","group":"Риски и право","order":140,"section":"knowledge","title":"Реклама кальянов и алкоголя, Instagram и уличные акции"},{"id":"pass-01","body":"**Māори**: латинская «ā» с макроном и кириллица «ори». Произношение — как удобно (маори/маури), владелец не настаивает. Смысл: «обычный человек».","order":10,"section":"passport","title":"Название"},{"id":"pass-02","body":"На 60–70% лаунж, но и полноценный ресторан. Сильные стороны — кальяны и кухня; бар в пиаре притушаем. 4 завтрака весь день, немного игровых консолей. Без танцев.","order":20,"section":"passport","title":"Формат"},{"id":"pass-03","body":"Азиатско-европейская.","order":30,"section":"passport","title":"Кухня"},{"id":"pass-04","body":"Здесь будет иначе.","order":40,"section":"passport","title":"Слоган"},{"id":"pass-05","body":"Тропики, тепло и уют, стиль и качество. Островная тема, близкая по духу Полинезии.","order":50,"section":"passport","title":"Вайб"},{"id":"pass-06","body":"Леопардовый принт как главный акцент: униформа персонала, обивка мебели, детали. Интерьер в целом светлый, много тропической зелени, например банановых листьев.","order":60,"section":"passport","title":"Айдентика"},{"id":"pass-07","body":"Двухметровый леопард в центре зала. Это инста-объект и маскот бренда. Имя пока не выбрано.","order":70,"section":"passport","title":"Маскот"},{"id":"pass-08","body":"Шестиметровый аквариум с рыбами, остался от прежних владельцев. Вместе с зеленью поддерживает островную тему.","order":80,"section":"passport","title":"Аквариум"},{"id":"pass-09","body":"Средний и ниже среднего, массовый. Строго 18+, аудитория 18–35 (ядро 22–28), ~70% девушки. День — офисы рядом, с 18:00 — лаунж.","order":90,"section":"passport","title":"Сегмент"},{"id":"pass-10","body":"Рязань, офисное здание напротив МТС. Рядом офисы, есть потенциал бизнес-ланчей. Точный адрес уточнить.","order":100,"section":"passport","title":"Место"},{"id":"pass-11","body":"22 ноября 2026, по плану.","order":110,"section":"passport","title":"Открытие"},{"id":"pass-12","body":"https://www.instagram.com/maori.lounge\n2 574 подписчика на 4 ноября. В описании: «здесь будет иначе», kitchen · hookah · bar.","order":120,"section":"passport","title":"Instagram"},{"id":"pass-13","body":"Женя — руководитель проекта. Максим — дизайн, продукт, аудитория. Лиза — PR и запуск. Алёна — контент-стратегия.","order":130,"section":"passport","title":"Команда"},{"id":"pass-14","body":"Нормальность в хорошем смысле: стабильно, вкусно, сытно, красиво, недорого, понятно. Место на каждый день. В аутентичность племени не уходим.","order":45,"section":"passport","title":"Идея"},{"id":"pr-01","body":"Где и как появляется принт: людные места, радиус вокруг заведения, район МТС. Показываем владельцу на брифе.","channel":"Карта размещений","date":"2026-11-06","group":"Согласовано 6.11","order":10,"section":"pr","status":"Ушло клиенту","title":"Интерактивная карта «Леопардовый бум в Рязани»"},{"id":"pr-02","body":"Леопардовые плакаты и наклейки без названия в легальных местах (по мотивам KitKat «Phone Break», Cannes 2025: бренд узнают по объекту). Можно совместить с розыском.","channel":"Город","date":"2026-11-10","group":"Наши гипотезы","order":20,"section":"pr","status":"Оцениваем","title":"Плакаты и принты без логотипа"},{"id":"pr-03","body":"Клиент: «100%», но цветные и яркие, не ч/б. Тексты и макет — на согласование ему. «Пропажу» не делаем — скользко, делаем «разыскивается» с приметами.","channel":"Город","date":"2026-11-10","group":"Согласовано 6.11","order":30,"section":"pr","status":"Ушло клиенту","title":"«Разыскивается леопард»"},{"id":"pr-04","body":"Клиент: «100%, если нормально по хулиганству». Трафарет лапки с логотипом, дату открытия НЕ пишем. Районы: Почтовая, центр, ТЦ «Малина», подходы к заведению.","channel":"Район МТС","date":"2026-11-12","group":"Согласовано 6.11","order":40,"section":"pr","status":"Ушло клиенту","title":"Леопардовые следы до двери"},{"id":"pr-05","body":"Клиент: офисы и так придут в первые дни. Из БЦ-историй оставляем только лифты и баннеры на входе.","channel":"Офисы рядом","date":"2026-11-12","group":"Отложено","order":50,"section":"pr","status":"Отказались","title":"Леопардовый десант в бизнес-центрах"},{"id":"pr-06","body":"Амбассадоры в вузах Рязани: леопардовые детали, промокоды, приглашения на открытие.","channel":"Вузы","date":"2026-11-13","group":"Наши гипотезы","order":60,"section":"pr","status":"Оцениваем","title":"Студенческие амбассадоры"},{"id":"pr-07","body":"Посылка без объяснений: леопардовая вещь и загадочная записка. Распаковки рождают вопрос «что происходит?». Платные интеграции маркируем.","channel":"Блогеры Рязани","date":"2026-11-14","group":"Наши гипотезы","order":70,"section":"pr","status":"Оцениваем","title":"Леопардовые посылки блогерам"},{"id":"pr-08","body":"Клиент: фигурки-приглашения — «если найдём дёшево и прикольно, но сам пытался — не нашёл». Альтернатива — карточки с хорошей печатью. Леопардовый курьер для блогеров — дорого.","channel":"Город","date":"2026-11-14","group":"Отложено","order":80,"section":"pr","status":"Оцениваем","title":"Плюшевые леопарды в городе"},{"id":"pr-09","body":"Когда принт заметят, подаём историю в городские паблики и медиа как городской феномен, затем раскрываем ответ.","channel":"Городские медиа и паблики","date":"2026-11-17","group":"Наши гипотезы","order":90,"section":"pr","status":"Берём","title":"Новость «Леопардовый бум в Рязани»"},{"id":"pr-10","body":"«Если вы замечали леопарда — это мы». Приглашения гостям, партнёрам и блогерам.","channel":"Рассылка","date":"2026-11-19","group":"Наши гипотезы","order":100,"section":"pr","status":"Берём","title":"Раскрытие и приглашения на открытие"},{"id":"pr-11","body":"Часть выручки с фирменного коктейля или мерча направляем на защиту дальневосточного леопарда. Формат и партнёра проверить.","channel":"Фонд защиты леопарда","group":"Наши гипотезы","order":110,"section":"pr","status":"Оцениваем","title":"Партнёрство с проектом по защите леопардов"},{"id":"prn-01","body":"Клиент: «100% без вариантов». Максимальный реализм, популярные локации. Генерации — из рекламного бюджета.","channel":"Instagram · дёшево","date":"2026-11-12","group":"Согласовано 6.11","order":120,"section":"pr","status":"Ушло клиенту","title":"Нейровидео «Леопард гуляет по Рязани»"},{"id":"prn-02","body":"У входа/на летнике на неделю + раздача на Почтовой с запиской. Риск: шары уносят — это ок, это тоже распространение.","channel":"«Воздушный слон» · дёшево","date":"2026-11-14","group":"Согласовано 6.11","order":130,"section":"pr","status":"Ушло клиенту","title":"Леопардовые шары вместо надувной лапы"},{"id":"prn-03","body":"В шубе клиента, без раскраски лица. Шары + лёгкий вопрос прохожим 18+ → шарик/брелок. 10 взаимодействий → 3 в рилс. Идея Лизы с гримом клиенту не зашла.","channel":"Почтовая · дёшево","date":"2026-11-17","group":"Согласовано 6.11","order":140,"section":"pr","status":"Ушло клиенту","title":"Леопардовый человек"},{"id":"prn-04","body":"Свой БЦ — спрашивает владелец (лифт один и пустой, возможен отказ). БЦ «Капитал» — спрашиваем мы.","channel":"БЦ · ждём разрешения","date":"2026-11-18","group":"Согласовано 6.11","order":150,"section":"pr","status":"Ушло клиенту","title":"Леопардовый лифт"},{"id":"prn-05","body":"4 × 5 000 ₽ депозита, анимация с билетами, условие — репост рилса. У него сработало на открытии прошлого заведения. Боль — честный рандомайзер: делаем через комментарии + проверку репоста. Без «отметь друга».","channel":"Instagram · 20–25 тыс.","date":"2026-11-12","group":"Согласовано 6.11","order":160,"section":"pr","status":"Берём","title":"Розыгрыш депозитов за репост (идея клиента)"},{"id":"prn-06","body":"Две версии:\n- **Максим:** баннер с шкурой без пятен, команда каждый день доклеивает розетки (уникальные, как у настоящего леопарда) — к открытию паттерн собран, таймлапс в контент.\n- **Лиза:** прохожие сами отклеивают наклейки и открывают надпись.\nКлиент боится вандализма → рекомендуем версию Максима. Место нужно посмотреть на месте.","channel":"Входная группа / терраса","group":"Оцениваем","order":170,"section":"pr","status":"Оцениваем","title":"Баннер «Леопард проявляется»"},{"id":"prn-07","body":"Через партнёров Жени, под ключ (ролик от нас). 2 недели до + 2 после открытия. Вопросы: адреса, маркировка, допустимость рекламы лаунжа 18+ (кальяны и алкоголь не показываем). Для сравнения: Вася Ложкин на всех билбордах, потому что владельцы бара = владельцы билбордов.","channel":"DOOH · 90 000 ₽/мес","group":"Оцениваем","order":180,"section":"pr","status":"Оцениваем","title":"32 городских экрана на месяц"},{"id":"prn-08","body":"Решили 10.11: вместо съёмки в вещах SkyRoom — совместный розыгрыш депозитов Māори среди покупателей SkyRoom. Сначала согласование с владельцем (task-42, pm-07 в клиентском пульте), потом переговоры со SkyRoom.","channel":"SkyRoom · бартер","group":"Оцениваем","order":190,"section":"pr","status":"Ушло клиенту","title":"Коллаборация с SkyRoom: розыгрыш депозитов за покупку"},{"id":"prn-09","body":"Клиент: «мечта, но точно не сейчас». Вернуться после открытия.","channel":"дорого","group":"Отложено","order":200,"section":"pr","status":"Отказались","title":"Леопардовый автобус / обклеенная машина"},{"id":"prn-10","body":"Клиент считает самым дорогим. Опыт Twiglles: LED-дорожка Victoria Plaza на премии — около 10 000 ₽ с частичным бартером. Разово для рилса — можно вернуться.","channel":"Victoria Plaza · дорого","group":"Отложено","order":210,"section":"pr","status":"Отказались","title":"Ночная проекция леопарда на здании"},{"id":"prn-11","body":"В клубе есть группа, которая и так бегает в леопарде. Леопардовые стаканы с Ozon — клиент оплатит, организация на нас.","channel":"Клуб пробежек","date":"2026-11-29","group":"Отложено","order":220,"section":"pr","status":"Ушло клиенту","title":"Забег с группой в леопардовом — после открытия"},{"id":"prn-12","body":"Закрытые коробочки только на открытии, внутри редкий «золотой леопард» = ужин. Риск: клиент уже искал фигурки и не нашёл дешёвых и красивых.","channel":"Открытие · ₽₽","group":"Подсмотрели в 2025–2026","order":230,"section":"pr","status":"Идея","title":"Блайнд-бокс мини-леопардов (по мотивам Labubu)"},{"id":"prn-13","body":"Подсказки на объявлениях и лапках, финал — у двери заведения, приз — ужин или кальян. Можно связать с розыгрышем.","channel":"Город · ₽","group":"Классика","order":240,"section":"pr","status":"Идея","title":"Квест по точкам «бума»"},{"id":"prn-14","body":"Закрытый вечер для постоянников прошлых проектов владельца и блогеров. Формат открытия с клиентом ещё не обсуждали.","channel":"Открытие · ₽","group":"Классика","order":250,"section":"pr","status":"Идея","title":"Soft opening по приглашениям"},{"id":"st-01","body":"Черновик SWOT уже есть в нашем анализе бренда — перенести и уточнить по итогам созвона.","group":"1. Компания","order":10,"owner":"Женя","section":"strategy","status":"В работе","title":"Общая информация о компании и SWOT"},{"id":"st-02","body":"Владелец — Максим. Без темы прошлого бизнеса.","group":"1. Компания","order":20,"owner":"Женя","section":"strategy","status":"В работе","title":"Об основателях и сотрудниках"},{"id":"st-03","group":"1. Компания","order":30,"owner":"Женя","section":"strategy","status":"Не начато","title":"Цели, планы, видение"},{"id":"st-04","group":"2. Услуги","order":40,"owner":"Максим","section":"strategy","status":"Не начато","title":"Описание и специфика: кухня, бар, кальяны, зал"},{"id":"st-05","group":"2. Услуги","order":50,"owner":"Максим","section":"strategy","status":"Не начато","title":"Качество, гарантии, стоимость (средний чек)"},{"id":"st-06","body":"Первая версия — в разделе «GAP-анализ» → «Конкуренты»: 7 кальянных и дневной рынок ланчей, по отзывам 2ГИС. Дополнить до 10–20 показателей: чек, кальян, кухня, часы работы, соцсети.","group":"3. Конкуренты","order":60,"owner":"Максим","section":"strategy","status":"В работе","title":"Сравнительная таблица конкурентов Рязани по 10–20 показателям"},{"id":"st-07","group":"3. Конкуренты","order":70,"owner":"Алёна","section":"strategy","status":"Не начато","title":"Оценка соцсетей конкурентов (хорошие/средние/слабые) и ER"},{"id":"st-08","body":"Черновик — в разделе «GAP-анализ»: 10 разрывов, продуктовая отстройка и приоритеты. Нужны решения владельца по пунктам с ⚠️.","group":"4. Преимущества","order":80,"owner":"Максим","section":"strategy","status":"В работе","title":"Преимущества и недостатки Māори"},{"id":"st-09","group":"5. Текущая реклама","order":90,"owner":"Алёна","section":"strategy","status":"Не начато","title":"Источники трафика и срез статистики Instagram (2 574 подписчика на 4 ноября)"},{"id":"st-10","body":"Готов черновик: 7 JTBD-сегментов с доказательствами (раздел «JTBD-сегменты») и путь гостя (раздел «CJM: путь гостя»). Дальше — 10 интервью и опрос в соседних БЦ.","group":"6. Аудитория","order":100,"owner":"Максим","section":"strategy","status":"В работе","title":"Целевая аудитория и путь клиента до покупки"},{"id":"st-11","body":"Опора: легенда «Леопард на острове» и словарь смыслов из базы знаний.","group":"7. Смыслы","order":110,"owner":"Максим","section":"strategy","status":"В работе","title":"Концепция и офферы (сложение + смысл + доказательство)"},{"id":"st-12","group":"8. Финансы","order":120,"owner":"Женя","section":"strategy","status":"Не начато","title":"Ёмкость рынка, финплан, система скидок"},{"id":"st-13","group":"9. Стратегия продвижения","order":130,"owner":"Лиза","section":"strategy","status":"В работе","title":"Позиционирование и «Леопардовый бум»"},{"id":"st-14","group":"9. Стратегия продвижения","order":140,"owner":"Алёна","section":"strategy","status":"Не начато","title":"Требования к соцсетям, обработка заявок, работа с отзывами"},{"id":"st-15","group":"10. План","order":150,"owner":"Женя","section":"strategy","status":"Не начато","title":"Пошаговый план работ на месяц / полгода с целями"},{"id":"task-01","body":"Первая версия: паспорт, бриф, база знаний, разделы для PR, контента, ивентов и отзывов. Дальше пополняем.","date":"2026-11-04","order":10,"owner":"Максим","section":"tasks","status":"Готово","title":"Собрать пульт проекта и карту бренда"},{"id":"task-02","body":"Решили: стратегию по шаблону делаем после открытия. База — этот пульт.","date":"2026-11-05","order":20,"owner":"Женя","section":"tasks","status":"Готово","title":"Прислать команде шаблон стратегии"},{"id":"task-03","body":"Без ограничений по бюджету. Где и как в Рязани появляется леопардовый принт: плакаты, принты, графика, игрушки, объекты в людных местах. Идеи складываем в PR-план.","date":"2026-11-05","order":30,"owner":"Вся команда","section":"tasks","status":"Готово","title":"Накидать идеи для «Леопардового бума»"},{"id":"task-04","body":"Черновик уже в разделе «Первый бриф». После шаблона сверяем и дополняем.","date":"2026-11-05","order":40,"owner":"Вся команда","section":"tasks","status":"Готово","title":"Составить вопросы к владельцу по шаблону стратегии"},{"id":"task-05","body":"Всё собрано в разделе «База: маори и леопард».","date":"2026-11-05","order":50,"owner":"Вся команда","section":"tasks","status":"Готово","title":"Изучить маори, Полинезию и леопарда"},{"id":"task-06","body":"Пятница, 6 ноября, ориентировочно 13:00–15:00 по Москве.","date":"2026-11-05","order":60,"owner":"Женя","section":"tasks","status":"Готово","title":"Назначить созвон с владельцем на пятницу"},{"id":"task-07","body":"Запрос висит в клиентском пульте «Нужно от вас».","date":"2026-11-09","order":70,"owner":"Максим","section":"tasks","status":"Ждём клиента","title":"Запросить у клиента логотип SVG/PNG и мудборд"},{"id":"task-08","body":"Показали на созвоне 6.11 — итоги в «Идеях Леопардового бума».","date":"2026-11-06","order":80,"owner":"Лиза","section":"tasks","status":"Готово","title":"Интерактивная карта «Леопардовый бум в Рязани»"},{"id":"task-09","date":"2026-11-06","order":90,"owner":"Женя","section":"tasks","status":"Готово","title":"Провести первый бриф с владельцем"},{"id":"task-10","body":"Этап 2. Основа — пульт + исследование реальных гостей. Чек-лист — в «Стратегии по КП».","date":"2026-11-30","order":100,"owner":"Женя","section":"tasks","status":"Сделать","title":"Стратегия по шаблону КП (после открытия)"},{"id":"task-11","body":"Постинг стартует на неделе с 9.11. Первое — карусель «в движении» и нейровидео леопарда. Сторис — Алёна, вт/чт.","date":"2026-11-08","order":110,"owner":"Алёна","section":"tasks","status":"В работе","title":"Контент-стратегия прогрева без показа стройки"},{"id":"task-12","body":"После открытия, на реальных гостях. Уже известно: 70/30 девушки, 18–35, ядро 22–28, два режима дня.","date":"2026-12-05","order":120,"owner":"Максим","section":"tasks","status":"Сделать","title":"Проверить гипотезы по аудитории"},{"id":"task-13","body":"Связать леопарда, остров, аквариум и зелень в одну систему для контента и PR.","date":"2026-11-10","order":130,"owner":"Максим","section":"tasks","status":"В работе","title":"Единая визуальная история бренда"},{"id":"task-14","body":"Старт — вместе с нейровидео «Леопард ходит по Рязани» (task-24). Публикуем сегодня, 10.11, — значит и запуск сегодня. Если публикация сдвигается, сдвигается и запуск.","date":"2026-11-10","order":140,"owner":"Лиза","section":"tasks","status":"В работе","title":"Запуск «Леопардового бума» в городе"},{"id":"task-15","body":"Сначала обсудить с Максимом: формат открытия, кого зовём, сколько человек вмещает зал. Дату задачи пока не меняем.","date":"2026-11-12","order":150,"owner":"Лиза","section":"tasks","status":"Сделать","title":"План открытия: список гостей, приглашения, рассылка"},{"id":"task-16","date":"2026-11-22","order":160,"owner":"Вся команда","section":"tasks","status":"Сделать","title":"Открытие Māори"},{"id":"task-20","date":"2026-11-06","order":200,"owner":"Максим","section":"tasks","status":"Готово","title":"Разделить пульт на клиентский и командный, внести итоги созвона"},{"id":"task-21","body":"Просьба клиента на созвоне.","date":"2026-11-08","order":210,"owner":"Лиза","section":"tasks","status":"Сделать","title":"Разделить идеи бума на «до» и «после» открытия и расставить приоритеты"},{"id":"task-22","body":"Готовое — в клиентский пульт со статусом «На согласовании» (карточка pm-01).","date":"2026-11-09","order":220,"owner":"Лиза","section":"tasks","status":"Сделать","title":"Макет и тексты «Разыскивается леопард» (цветные)"},{"id":"task-23","body":"Без даты открытия. Проверить смываемую краску / обратное граффити и правила благоустройства Рязани.","date":"2026-11-10","order":230,"owner":"Лиза","section":"tasks","status":"Сделать","title":"Трафарет лапки с логотипом + где легально наносить"},{"id":"task-24","body":"Первая публикация прогрева. Качество выше, чем первое видео в аккаунте. Финальный кадр «Скоро. Здесь будет иначе». С него же запускаем розыгрыш (репост).","date":"2026-11-10","order":240,"owner":"Максим","section":"tasks","status":"Сделать","title":"Нейровидео «Леопард ходит по Рязани» (пост 10.11)"},{"id":"task-25","body":"6 смазанных кадров + короткие фразы.","date":"2026-11-11","order":250,"owner":"Алёна","section":"tasks","status":"Готово","title":"Съёмка деталей «в движении» и размазанная карусель (пост 12.11)"},{"id":"task-26","date":"2026-11-11","order":260,"owner":"Лиза","section":"tasks","status":"Сделать","title":"Договориться с «Воздушным слоном» про леопардовые шары"},{"id":"task-27","date":"2026-11-10","order":270,"owner":"Лиза","section":"tasks","status":"Сделать","title":"Спросить БЦ «Капитал» про лифт и баннер на входе"},{"id":"task-28","body":"90 000 ₽/мес через партнёров. Маркировка и требования к рекламе лаунжа — клиент переживает за юридическую сторону.","date":"2026-11-10","order":280,"owner":"Женя","section":"tasks","status":"Сделать","title":"Адреса 32 экранов и юридический ответ по 18+"},{"id":"task-29","body":"Печать, трафареты, шары, брелоки, генерации видео, призы розыгрыша, экраны. В клиентском пульте — запрос rq-05.","date":"2026-11-10","order":290,"owner":"Женя","section":"tasks","status":"Сделать","title":"Смета рекламного бюджета для клиента"},{"id":"task-30","body":"Одно простое действие (репост рилса + комментарий для списка), рандомайзер по комментариям, ручная проверка репоста. 4 депозита по 5 000 ₽. Запуск — не позже 12.11.","date":"2026-11-11","order":300,"owner":"Алёна","section":"tasks","status":"Сделать","title":"Механика розыгрыша и честный выбор победителей"},{"id":"task-31","body":"Первые 5–6 постов «Мира» и первые ~20 второго проекта — это то, что ему нравится. Всё «смешное» за последние полгода там — антиреференс.","date":"2026-11-10","order":310,"owner":"Алёна","section":"tasks","status":"Сделать","title":"Разобрать первые посты прошлых проектов владельца как референс"},{"id":"task-32","date":"2026-11-25","order":320,"owner":"Алёна","section":"tasks","status":"Сделать","title":"Обзорная съёмка с моделями после открытия"},{"id":"task-33","body":"Клиенту — только ссылку на клиентский пульт, уровень «Участник» (чтобы мог согласовывать). Команде — «Редактор» в обоих. Ссылку на командный пульт клиенту не передаём.","date":"2026-11-10","order":330,"owner":"Вся команда","section":"tasks","status":"Сделать","title":"Выдать доступы: клиенту — клиентский пульт, команде — оба"},{"id":"task-40","body":"Формат обзора: красивая девушка или парень «расследует» странные объявления. Объявления и лапки должны висеть в городе до 12.11 (task-22, task-23). Из объявлений делаем и сторис-опрос 12.11.","date":"2026-11-12","order":400,"owner":"Алёна, Лиза","section":"tasks","status":"Сделать","title":"Рилс «Разыскиваем леопарда»: сценарий, ведущий, съ кале от −2 до +2. Этапы связаны с JTBD-сегментами и GAP-анализом."},"content":{"intro":"Черновики и идеи контента. Готовое заводим в клиентский пульт («Контент-план») и ставим здесь «Ушло клиенту». Правила владельца: никаких «смешных» рилсов с персоналом, липсингов и танцев; маскот — почти везде; только качественная нейронка. По тарифу — 10 постов/мес + сторис вт/чт."},"contract":{"intro":"Условия по КП «Издание о Рязани» (редакция Twiglles). Выбран тариф «Эконом» — 110 000 ₽ в месяц. Рекламный бюджет (блогеры, таргет) оплачивается отдельно. Всё, что сверх пакета, — допуслуги."},"events":{"intro":"Открытие и всё, что вокруг него. После открытия здесь появится календарь регулярных вечеринок и поводов."},"gap":{"intro":"Где конкуренты в Рязани не закрывают потребности гостей и что из этого может сделать Māори. Каждый пункт подтверждён отзывами или помечен как гипотеза. ⚠️ — нужно решение владельца."},"jtbd":{"intro":"Сегменты по работе гостя, а не по демографии: КТО приходит и ЗАЧЕМ. Основа — около 100 отзывов о шести кальянных Рязани в 2ГИС, выдача по бизнес-ланчам и ответы владельца на созвоне 06.11. Цитаты взяты из отзывов дословно, «мысли в голове» собраны по их мотивам. Первые гипотезы с кик-оффа — в разделе «Аудитория»."},"knowledge":{"intro":"Подноготная концепции: кто такие маори, что такое Полинезия, почему леопард и как связать всё без ошибок. Читать всей команде до брифа: владелец ценит, когда команда понимает смыслы."},"overview":{"intro":"Пульт проекта: здесь видно, на каком этапе работа, какие задачи у команды и что нужно от клиента. Главная дата — открытие 22 ноября. До него около двух с половиной недель, чтобы Рязань заговорила о леопарде."},"pr":{"intro":"Все механики «Леопардового бума» и их судьба. Группы: согласовано клиентом 6.11, оцениваем, отложено, наши гипотезы, классика и подсмотренное в 2025–2026. Согласованное дублируем в клиентский пульт («Продвижение») и ставим здесь «Ушло клиенту». Клиент просил разделить идеи на «до» и «после» открытия. function rich(src){

  const flushT = () => { if(!tbl.length) return; const rows = tbl.filter(r=>!/^\|?[\s:|-]+\|?$/.test(r.trim()));
    const [hd,...bd] = rows; html += `<div class="tbl"><table><thead><tr>${cells(hd).map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${bd.map(r=>`<tr>${cells(r).map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; tbl = []; };

    if (/^\s*[-•]\s+/.test(l)){ flush(); if(!ul){html+="<ul>";ul=true} html += "<li>"+inline(l.replace(/^\s*[-•]\s+/,""))+"</li>"; continue; }
    if (ul){ html+="</ul>"; ul=false; }
    if (/^##\s+/.test(l)){ flush(); html += "<h4>"+inline(l.replace(/^##\s+/,""))+"</h4>"; continue; }
    if (!l.trim()){ flush(); continue; }
    para.push(l);
  }
  flush(); flushT(); if (ul) html += "</ul>"; return html;
}
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const parseD = s => { const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return m? new Date(+m[1],m[2]-1,+m[3]) : null; };
function plural(n,a,b,c){ n=Math.abs(n)%100; const k=n%10; if(n>10&&n<20)return c; if(k>1&&k<5)return b; if(k===1)return a; return c; }
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2200); }
const ofSec = k => items.filter(i=>i.section===k);
function tone(sec, st){ const i = (sec.statuses||[]).indexOf(st); if(i<0) return "t0"; const n=sec.statuses.length; if(i===n-1) return "t3"; if(sec.key==="tasks"&&i===2) return "t2"; return i===0?"t0":(i===1?"t1":"t2"); }

/* ---------- леопардовая полоса ---------- */
function drawLeo(){
  const c = $("#leo"), r = c.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio||1);
  c.width = Math.round(r.width*dpr); c.height = Math.round(r.height*dpr);
  const x = c.getContext("2d"); x.scale(dpr,dpr);
  const W=r.width, H=r.height; let seed=7;
  const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,"#D9A146"); g.addColorStop(1,"#B97F22");
  x.fillStyle=g; x.fillRect(0,0,W,H);
  const step=46;
  for(let yy=-20; yy<H+40; yy+=step*0.82){
    for(let xx=-20; xx<W+40; xx+=step){
      const cx=xx+(rnd()-.5)*22+((yy/step|0)%2)*step/2, cy=yy+(rnd()-.5)*18, R=9+rnd()*8;
      x.fillStyle="rgba(140,80,20,.55)"; x.beginPath(); x.ellipse(cx,cy,R*.75,R*.6,rnd()*3,0,7); x.fill();
      x.fillStyle="#1D1610";
      const parts=3+(rnd()*3|0), base=rnd()*6.28;
      for(let p=0;p<parts;p++){
        const a=base+p*(6.28/parts)+(rnd()-.5)*.5, len=.9+rnd()*.7;
        x.beginPath(); x.ellipse(cx+Math.cos(a)*R, cy+Math.sin(a)*R*.85, R*.42*len, R*.22, a+1.57, 0, 7); x.fill();
      }
      if(rnd()<.35){ x.beginPath(); x.arc(xx+step*.5+(rnd()-.5)*10, yy+step*.4, 2+rnd()*3, 0, 7); x.fill(); }
    }
  }
}

/* ---------- навигация ---------- */
function renderNav(){
  let html="", last="";
  for(const s of S){
    if(!visible(s)) continue;
    if(s.nav!==last){ html+=`<div class="navgroup">${esc(s.nav)}</div>`; last=s.nav; }
    const n = s.key==="overview" ? "" : (loaded ? ofSec(s.key).length : "");
    html+=`<a href="#${s.key}" ${route===s.key?'aria-current="page"':""}><span>${esc(s.label)}</span><span class="n">${n}</span></a>`;
  }
  $("#nav").innerHTML = html;
  const cur = $("#nav [aria-current]"); if(cur && innerWidth<900) cur.scrollIntoView({block:"nearest",inline:"center"});
}
function go(){ const h=(location.hash||"").slice(1); route = BY[h] && visible(BY[h]) ? h : "overview"; filter={status:"all",q:""}; render(); scrollTo({top:0}); }
addEventListener("hashchange", go);

/* ---------- шапка: обратный отсчёт ---------- */
function renderTop(){
  const p = pages.project || {};
  if(p.city) $("#brandSub").textContent = `Restaurant & Lounge · ${p.city} · пульт команды`;
  const od = parseD(p.openDate);
  if(od){
    const d = Math.round((od - today())/864e5);
    $("#countBox").hidden=false;
    if(d>0){ $("#countN").textContent=d; $("#countT").innerHTML=`${plural(d,"день","дня","дней")} до открытия<br>${od.getDate()} ${MONTHS[od.getMonth()]}`; }
    else if(d===0){ $("#countN").textContent="0"; $("#countT").textContent="Открытие сегодня"; }
    else { $("#countN").textContent=-d; $("#countT").innerHTML=`${plural(-d,"день","дня","дней")}<br>после открытия`; }
  }
}

/* ---------- обзор ---------- */
function renderOverview(){
  const p = pages.project || {};
  const passport = ofSec("passport").sort(sorter({}));
  const tasks = ofSec("tasks").filter(t=>t.status!=="Готово").sort((a,b)=>(a.date||"9")<(b.date||"9")?-1:1).slice(0,6);
  const openQ = ofSec("brief").filter(t=>t.status==="Спросить"||!t.status).length;
  const tiles = [
    ["brief", openQ, `${plural(openQ,"вопрос","вопроса","вопросов")} к брифу без ответа`],
    ["tasks", ofSec("tasks").filter(t=>t.status!=="Готово").length, "задач в работе"],
    ["content", ofSec("content").length, "единиц в контент-плане"],
    ["pr", ofSec("pr").filter(i=>i.status!=="Отказались").length, "идей для бума"],
    ["strategy", ofSec("strategy").filter(i=>i.status!=="Готово").length, "разделов стратегии в работе"],
    ["events", ofSec("events").length, "ивентов"],
    ["knowledge", ofSec("knowledge").length, "статей в базе"],
  ];
  let h = `<div class="eyebrow">Проект${p.client?" · "+esc(p.client):""}</div>
  <div class="head"><h1>${esc(p.slogan||"Māори — место, где всё будет иначе")}</h1></div>
  ${pages.overview?.intro ? `<div class="intro">${rich(pages.overview.intro)}</div>`:""}
  ${p.clientUrl?`<div class="banner">Клиент видит отдельный пульт: <a href="${esc(STATIC ? "../" : p.clientUrl)}" target="_blank" rel="noopener">открыть клиентский пульт ↗</a>. Готовые публикации, активности на согласование, запросы и решения ведём там.</div>`:""}
  ${canWrite?`<div class="quick">
    <button class="btn primary" data-add="tasks">+ Задача</button>
    <button class="btn" data-add="brief">+ Вопрос к брифу</button>
    <button class="btn" data-add="content">+ Публикация</button>
    <button class="btn" data-add="pr">+ PR</button>
    <button class="btn" data-add="events">+ Ивент</button>
    <button class="btn" data-add="reviews">+ Отзыв</button>
    ${isTeam?`<button class="btn" data-add="calls">+ Созвон</button>`:""}
  </div>`:""}
  <div class="tiles">${tiles.map(([k,n,t])=>`<a class="tile" href="#${k}"><b>${loaded?n:"—"}</b><small>${t}</small></a>`).join("")}</div>
  <div class="cols">
    <section class="group"><h2>Паспорт бренда</h2>
      ${passport.length ? `<dl class="passport">${passport.map(i=>`<div class="pp"><dt>${esc(i.title)}</dt><dd>${rich(i.body||"")}</dd>${canWrite?`<div class="row-btns"><button class="btn ghost" data-edit="${i.id}" aria-label="Изменить">✎</button></div>`:""}</div>`).join("")}</dl>`
        : empty("Паспорт пока пуст","Здесь будут ключевые факты о бренде: формат, концепция, город, дата открытия.")}
      ${canWrite?`<div class="quick"><button class="btn ghost" data-add="passport">+ Строка паспорта</button></div>`:""}
    </section>
    <section class="group"><h2>Ближайшие задачи</h2>
      ${tasks.length ? `<div class="list">${tasks.map(i=>card(BY.tasks,i)).join("")}</div>` : empty("Открытых задач нет","Добавьте задачу кнопкой «+ Задача».")}
      <div class="quick"><a class="btn ghost" href="#tasks">Все задачи →</a></div>
    </section>
  </div>`;
  return h;
}
function empty(t,s){ return `<div class="empty"><strong>${esc(t)}</strong>${esc(s)}</div>`; }

/* ---------- раздел ---------- */
function sorter(sec){
  return (a,b)=>{
    if(sec.byDate){ const da=a.date||"9999", dbb=b.date||"9999"; if(da!==dbb) return sec.desc? (da<dbb?1:-1) : (da<dbb?-1:1); }
    const oa=a.order??1e9, ob=b.order??1e9; if(oa!==ob) return oa-ob;
    return (a.createdAt||"")<(b.createdAt||"")?-1:1;
  };
}
function card(sec,i){
  const d = parseD(i.date), hasDate = sec.fields?.includes("date");
  const late = d && d<today() && sec.statuses && i.status!==sec.statuses[sec.statuses.length-1];
  const long = (i.body||"").length>420 || (i.body||"").split("\n").length>7;
  const isOpen = open.has(i.id);
  const tags = [];
  if(i.channel) tags.push(i.channel);
  if(i.owner) tags.push("👤 "+i.owner);
  if(i.rating) tags.push("★".repeat(Math.max(0,Math.min(5,+i.rating||0))));
  return `<article class="item ${hasDate?"":"nodate"}">
    ${hasDate?`<div class="date ${late?"late":""}">${d?`<b>${d.getDate()}</b>${MONTHS[d.getMonth()]}`:"без даты"}</div>`:""}
    <div><div class="it-title">${esc(i.title||"Без названия")}</div>
      ${tags.length||i.link?`<div class="meta">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}${i.link?`<a class="tag" href="${esc(i.link)}" target="_blank" rel="noopener">ссылка ↗</a>`:""}</div>`:""}
    </div>
    <div class="right">
      ${sec.statuses&&!i.info?`<button class="pill ${tone(sec,i.status)}" data-cycle="${i.id}" ${canWrite?"":"disabled"} title="${canWrite?"Нажмите, чтобы сменить статус":""}">${esc(i.status||sec.statuses[0])}</button>`:""}
      ${canWrite?`<div class="row-btns"><button class="btn ghost" data-edit="${i.id}" aria-label="Изменить">✎</button></div>`:""}
    </div>
    ${i.body?`<div class="body ${long&&!isOpen?"clamp":""} ${sec.long&&isOpen?"":""}">${rich(i.body)}</div>${long?`<button class="more" data-toggle="${i.id}">${isOpen?"Свернуть":"Читать полностью"}</button>`:""}`:""}
  </article>`;
}
function renderSection(sec){
  const all = ofSec(sec.key).sort(sorter(sec));
  const q = filter.q.trim().toLowerCase();
  const list = all.filter(i => (filter.status==="all" || i.info || (i.status||sec.statuses?.[0])===filter.status) &&
     (!q || [i.title,i.body,i.group,i.channel,i.owner].join(" ").toLowerCase().includes(q)));
  const intro = pages[sec.key]?.intro;
  let h = `<div class="eyebrow">${esc(sec.nav)}</div>
  <div class="head"><h1>${esc(sec.label)}</h1>
    <div class="actions">${canWrite?`<button class="btn primary" data-add="${sec.key}">+ ${esc(sec.add)}</button><button class="btn ghost" data-intro="${sec.key}">Описание раздела</button>`:""}</div></div>
  ${intro?`<div class="intro">${rich(intro)}</div>`:""}
  <div class="toolbar">
    ${sec.statuses?["all",...sec.statuses].map(st=>`<button class="chip" data-filter="${esc(st)}" aria-pressed="${filter.status===st}">${st==="all"?"Все":esc(st)} <span class="n">${st==="all"?all.length:all.filter(i=>!i.info&&(i.status||sec.statuses[0])===st).length}</span></button>`).join(""):""}
    <input class="search" id="q" type="search" placeholder="Поиск в разделе" value="${esc(filter.q)}" aria-label="Поиск в разделе">
  </div>`;
  if(!loaded){ h += empty("Загружаем данные…", stale?"Хранилище пока не отвечает. Данные появятся, как только связь восстановится.":"Обычно это занимает пару секунд."); return h; }
  if(!all.length){ h += empty("В разделе пока пусто", canWrite?`Нажмите «+ ${sec.add}», чтобы добавить первую запись.`:"Записи появятся, когда команда их добавит."); return h; }
  if(!list.length){ h += empty("Ничего не найдено","Сбросьте фильтр или измените запрос."); return h; }
  if(sec.groupBy){
    const groups = []; const m = new Map();
    for(const i of list){ const g=i.group||"Без рубрики"; if(!m.has(g)){m.set(g,[]);groups.push(g)} m.get(g).push(i); }
    h += groups.map(g=>`<section class="group"><h2>${esc(g)}</h2><div class="list">${m.get(g).map(i=>card(sec,i)).join("")}</div></section>`).join("");
  } else h += `<div class="list">${list.map(i=>card(sec,i)).join("")}</div>`;
  return h;
}
function render(){
  renderNav(); renderTop();
  const sec = BY[route];
  let html = STATIC ? `<div class="banner">Данные обновлены ${esc(snapDate())}.</div>` : noDb ? (SNAP ? `<div class="banner">Данные на ${esc(snapDate())}. Чтобы видеть изменения сразу и редактировать, откройте пульт под своей учётной записью claude.ai.</div>`
                          : `<div class="banner">Данные проекта не загрузились в этом окне. Откройте пульт под своей учётной записью claude.ai.</div>`) : "";
  if(stale && loaded) html += `<div class="banner">Связь с хранилищем прервалась, данные могут быть устаревшими.</div>`;
  html += route==="overview" ? renderOverview() : renderSection(sec);
  $("#view").innerHTML = html;
  const qi = $("#q"); if(qi){ qi.addEventListener("input", e=>{ filter.q=e.target.value; const pos=e.target.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos); }); }
}

/* ---------- действия ---------- */
$("#view").addEventListener("click", async e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.add) return openForm(b.dataset.add, null);
  if(b.dataset.edit) { const it = items.find(i=>i.id===b.dataset.edit); return it && openForm(it.section, it); }
  if(b.dataset.intro) return openIntro(b.dataset.intro);
  if(b.dataset.toggle){ const id=b.dataset.toggle; open.has(id)?open.delete(id):open.add(id); return render(); }
  if(b.dataset.filter){ filter.status=b.dataset.filter; return render(); }
  if(b.dataset.cycle && canWrite){
    const it = items.find(i=>i.id===b.dataset.cycle); const sec = BY[it.section]; const st = sec.statuses;
    const next = st[(st.indexOf(it.status||st[0])+1)%st.length];
    try{ await dbRef.collection(colOf(it.section)).doc(it.id).update({status:next, updatedAt:new Date().toISOString()}); toast(`Статус: ${next}`); }
    catch(err){ handleWriteErr(err); }
  }
});

const SECT_EXTRA = {passport:{key:"passport",label:"Паспорт бренда",fields:["title","body"],titleL:"Поле",bodyL:"Значение",add:"Строка паспорта"}};
function secOf(k){ return BY[k] || SECT_EXTRA[k]; }

function openForm(key, it){
  const sec = secOf(key); const f = $("#form");
  const v = it || {status: sec.statuses?.[0]};
  const groups = [...new Set(ofSec(key).map(i=>i.group).filter(Boolean))];
  const field = name=>{
    const lab = name==="title"?(sec.titleL||FIELD.title): name==="body"?(sec.bodyL||FIELD.body): name==="channel"?(sec.channelL||FIELD.channel): FIELD[name];
    const id = "f_"+name, val = esc(v[name]??"");
    if(name==="body") return `<div class="f wide"><label for="${id}">${lab}</label><textarea id="${id}" name="body" ${sec.long?'style="min-height:260px"':""}>${val}</textarea><span class="hint">Пустая строка — новый абзац, «- » — пункт списка, «## » — подзаголовок, **жирный**.</span></div>`;
    if(name==="status") return `<div class="f"><label for="${id}">${lab}</label><select id="${id}" name="status">${sec.statuses.map(s=>`<option ${s===(v.status||sec.statuses[0])?"selected":""}>${esc(s)}</option>`).join("")}</select></div>`;
    if(name==="date") return `<div class="f"><label for="${id}">${lab}</label><input id="${id}" name="date" type="date" value="${val}"></div>`;
    if(name==="rating") return `<div class="f"><label for="${id}">${lab}</label><input id="${id}" name="rating" type="number" min="1" max="5" value="${val}"></div>`;
    if(name==="group") return `<div class="f"><label for="${id}">${lab}</label><input id="${id}" name="group" list="groups" value="${val}"><datalist id="groups">${groups.map(g=>`<option value="${esc(g)}">`).join("")}</datalist></div>`;
    if(name==="title") return `<div class="f wide"><label for="${id}">${lab}</label><input id="${id}" name="title" required value="${val}"></div>`;
    return `<div class="f ${name==="link"?"wide":""}"><label for="${id}">${lab}</label><input id="${id}" name="${name}" ${name==="link"?'type="url" placeholder="https://"':""} value="${val}"></div>`;
  };
  f.innerHTML = `<h3>${it?"Изменить запись":esc(sec.add)} · ${esc(sec.label)}</h3>
    <div class="fgrid">${sec.fields.map(field).join("")}</div>
    <div class="dlg-foot">
      ${it?`<span id="delZone"><button type="button" class="btn danger" id="delBtn">Удалить</button></span>`:""}
      <div class="r"><button type="button" class="btn" id="cancelBtn">Отмена</button><button type="submit" class="btn primary">Сохранить</button></div>
    </div>`;
  f.onsubmit = async ev=>{
    ev.preventDefault();
    const fd = new FormData(f); const data = {};
    for(const n of sec.fields){ let x=(fd.get(n)??"").toString().trim(); if(n==="rating") x = x? Math.max(1,Math.min(5,+x)) : ""; data[n]=x; }
    if(!data.title){ $("#f_title").focus(); toast("Заполните название"); return; }
    const btn = f.querySelector('[type=submit]'); btn.disabled=true;
    try{
      if(it){ await dbRef.collection(colOf(key)).doc(it.id).update({...data, updatedAt:new Date().toISOString()}); toast("Сохранено"); }
      else{ const order = Math.max(0,...ofSec(key).map(i=>i.order||0))+10;
        await dbRef.collection(colOf(key)).add({...data, section:key, order, createdAt:new Date().toISOString()}); toast("Добавлено"); }
      $("#dlg").close();
    }catch(err){ btn.disabled=false; handleWriteErr(err); }
  };
  $("#cancelBtn").onclick = ()=>$("#dlg").close();
  const del = $("#delBtn");
  if(del) del.onclick = ()=>{
    $("#delZone").innerHTML = `<span class="hint">Удалить без возврата?</span> <button type="button" class="btn danger" id="delYes">Да, удалить</button>`;
    $("#delYes").onclick = async ()=>{ try{ await dbRef.collection(colOf(key)).doc(it.id).delete(); $("#dlg").close(); toast("Удалено"); }catch(err){ handleWriteErr(err); } };
  };
  $("#dlg").showModal(); setTimeout(()=>f.querySelector("input,textarea")?.focus(),30);
}
function openIntro(key){
  const sec = secOf(key); const f=$("#form");
  f.innerHTML = `<h3>Описание раздела · ${esc(sec.label)}</h3>
    <div class="f wide"><label for="f_intro">Текст над списком</label><textarea id="f_intro" name="intro">${esc(pages[key]?.intro||"")}</textarea></div>
    <div class="dlg-foot"><div class="r"><button type="button" class="btn" id="cancelBtn">Отмена</button><button type="submit" class="btn primary">Сохранить</button></div></div>`;
  f.onsubmit = async ev=>{ ev.preventDefault();
    try{ await dbRef.collection("pages").doc(key).set({...(pages[key]||{}), intro:$("#f_intro").value}); $("#dlg").close(); toast("Сохранено"); }catch(err){ handleWriteErr(err); } };
  $("#cancelBtn").onclick = ()=>$("#dlg").close();
  $("#dlg").showModal();
}
function handleWriteErr(err){
  const c = err?.code;
  if(c==="invalid_argument" && !dbRef){ toast("Нет доступа к хранилищу"); return; }
  if(c==="invalid_argument"){ canWrite=false; render(); toast("У вас доступ только на просмотр"); return; }
  if(c==="quota_exceeded"){ toast("Хранилище заполнено: удалите старые записи"); return; }
  toast("Не удалось сохранить. Попробуйте ещё раз.");
}

/* ---------- данные ---------- */
async function boot(){
  render();
  const use = n => STATIC ? Promise.resolve(null) : Promise.resolve(window.claude?.use?.(n) ?? null).catch(()=>null);
  const db = await use("db");
  if(!db){ noDb=true; canWrite=false; isTeam=false; loaded=true; if(!visible(BY[route])) route="overview"; render(); return; }
  dbRef = db;
  const user = await use("user");
  if(user){ try{ const w = await user.can("data.write"); if(w===false) canWrite=false; }catch(e){}
            try{ const ed = await user.canEdit(); if(ed===false) isTeam=false; }catch(e){} }
  if(!visible(BY[route])) route="overview";
  let gotItems=false, gotPages=false;
  const timer = setTimeout(()=>{ stale=true; render(); }, 10000);
  const done = ()=>{ if(gotItems&&gotPages){ loaded=true; } };
  const merge = ()=>{ items = [...mainItems, ...teamItems]; };
  if(isTeam) db.collection("team").onSnapshot(snap=>{
    teamItems = snap.docs.map(d=>({id:d.id, ...d.data()})); merge(); render();
  }, ()=>{});
  db.collection("items").onSnapshot(snap=>{
    mainItems = snap.docs.map(d=>({id:d.id, ...d.data()})); merge();
    if(!snap.metadata.fromCache){ gotItems=true; } else if(items.length) gotItems=true;
    if(!snap.metadata.fromCache){ clearTimeout(timer); stale=false; }
    done(); render();
  }, err=>{ clearTimeout(timer); loaded=true; stale=true; render(); });
  db.collection("pages").onSnapshot(snap=>{
    pages = Object.fromEntries(snap.docs.map(d=>[d.id, d.data()]));
    gotPages=true; done(); render();
  }, ()=>{ gotPages=true; done(); render(); });
}

if(SNAP){ mainItems = SNAP.items || []; items = [...mainItems]; pages = SNAP.pages || {}; loaded = true; }
if(STATIC){ canWrite = false; isTeam = false; noDb = true; }
drawLeo(); addEventListener("resize", ()=>{ clearTimeout(drawLeo.t); drawLeo.t=setTimeout(drawLeo,150); });
route = BY[(location.hash||"").slice(1)] ? location.hash.slice(1) : "overview";
boot();
</script>
