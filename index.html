<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.MAORI_STATIC=true</script>
</head>
<body>
<title>Māори · пульт проекта</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: рабочая панель проекта — шапка с леопардовой полосой, слева разделы, справа рабочая зона; на телефоне разделы уходят в горизонтальную ленту. */
:root{
  --bg:#EFF4EE; --surface:#FFFFFF; --sunk:#E5ECE4; --ink:#14211A; --muted:#5A6B61; --line:#D6E0D6;
  --leaf:#2D6A4A; --leaf-soft:#DCEBE1; --ochre:#B97F22; --ochre-soft:#F5E6C8; --lagoon:#23808D; --lagoon-soft:#D5ECEE;
  --spot:#1D1610; --danger:#A8402F; --danger-soft:#F6DCD6; --violet:#6250D6; --violet-soft:#E9E5FA; --s1:#2a78d6; --s2:#eb6834; --shadow:0 1px 2px rgba(20,33,26,.06),0 8px 24px rgba(20,33,26,.06);
  --f-display:"Unbounded","Onest",system-ui,sans-serif; --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1611; --surface:#16211A; --sunk:#111B15; --ink:#E6EDE7; --muted:#97A89D; --line:#26352C;
  --leaf:#72B892; --leaf-soft:#1D3327; --ochre:#E0A84C; --ochre-soft:#3A2D16; --lagoon:#5FBBC6; --lagoon-soft:#16333A;
  --spot:#0B0805; --danger:#E58A78; --danger-soft:#3D1F19; --violet:#9085E9; --violet-soft:#262044; --s1:#3987e5; --s2:#d95926; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1611; --surface:#16211A; --sunk:#111B15; --ink:#E6EDE7; --muted:#97A89D; --line:#26352C;
  --leaf:#72B892; --leaf-soft:#1D3327; --ochre:#E0A84C; --ochre-soft:#3A2D16; --lagoon:#5FBBC6; --lagoon-soft:#16333A;
  --spot:#0B0805; --danger:#E58A78; --danger-soft:#3D1F19; --violet:#9085E9; --violet-soft:#262044; --s1:#3987e5; --s2:#d95926; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--lagoon)}
:focus-visible{outline:2px solid var(--lagoon);outline-offset:2px;border-radius:6px}

/* шапка */
.top{position:relative;overflow:hidden;background:var(--ochre);color:#1D1610}
#leo{position:absolute;inset:0;width:100%;height:100%;display:block}
.top-in{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;
  padding-block:28px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
.brand{background:rgba(255,248,234,.92);border-radius:14px;padding:12px 18px 14px;box-shadow:0 6px 30px rgba(29,22,16,.25)}
.brand .word{font:700 clamp(28px,5vw,44px)/1 var(--f-display);letter-spacing:-.01em;color:#1D1610}
.brand .logo{display:block;height:clamp(30px,5vw,46px);width:auto;color:#1D1610}
.brand .sub{margin-top:6px;font:500 12px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:#5b4a35}
.count{background:#1D1610;color:#F7EBD3;border-radius:14px;padding:12px 18px;display:flex;gap:14px;align-items:center}
.count b{font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums;color:#F0B451}
.count span{font-size:13px;line-height:1.3}

/* каркас */
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;
  padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:2px}
.navgroup{font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
nav.side a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none;border-left:3px solid color-mix(in srgb,var(--g,var(--line)) 45%,transparent)}
nav.side a:hover{background:color-mix(in srgb,var(--g,var(--sunk)) 12%,transparent)}
nav.side a[aria-current="page"]{background:var(--spot);color:#F7EBD3;border-left-color:var(--g,var(--ochre))}
.navgroup{display:flex;align-items:center;gap:8px;color:var(--g,var(--muted))}
.navgroup::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--g,var(--muted));flex:none}
nav.side a[aria-current="page"] .n{color:#F0B451}
.n{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
main{min-width:0}

/* заголовок раздела */
.head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px 20px;margin-bottom:6px}
h1{font:500 clamp(22px,3vw,30px)/1.15 var(--f-display);margin:0;text-wrap:balance}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ochre);margin-bottom:10px}
.intro{max-width:70ch;color:var(--muted);margin:10px 0 0}
.intro p{margin:0 0 8px}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--spot);border-color:var(--spot);color:#F7EBD3}
.btn.primary:hover{background:#3a2a1c}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 10px}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* фильтры */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:22px 0 14px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.search{flex:1 1 200px;max-width:320px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px}

/* группы и карточки */
.group{margin-top:26px}
.group h2{font:500 12px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;gap:10px;align-items:center}
.group h2::after{content:"";flex:1;height:1px;background:var(--line)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:start}
.item.nodate{grid-template-columns:minmax(0,1fr) auto}
.date{font:500 12px/1.2 var(--f-mono);color:var(--muted);min-width:52px;padding-top:3px;font-variant-numeric:tabular-nums}
.date b{display:block;font:500 18px/1 var(--f-display);color:var(--ink)}
.date.late b{color:var(--danger)}
.it-title{font-weight:600;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font:500 11px/1 var(--f-mono);padding:4px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{border:0;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.pill[disabled]{cursor:default}
.t0{background:var(--sunk);color:var(--muted)} .t1{background:var(--lagoon-soft);color:var(--lagoon)} .t2{background:var(--ochre-soft);color:var(--ochre)} .t3{background:var(--leaf-soft);color:var(--leaf)} .t4{background:var(--danger-soft);color:var(--danger)}
.row-btns{display:flex;gap:2px}
.body{grid-column:1/-1;color:var(--ink);margin-top:6px;overflow-wrap:anywhere}
.item:not(.nodate) .body{grid-column:2/-1}
.body p{margin:0 0 8px} .body ul{margin:0 0 8px;padding-left:20px} .body li{margin:2px 0}
.tbl{overflow-x:auto;margin:4px 0 12px;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
.tbl table{border-collapse:collapse;width:100%;font-size:12.5px;line-height:1.45}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:7px 9px;border-bottom:1px solid var(--line);min-width:110px;max-width:280px}
.tbl th{background:var(--sunk);font-weight:600;position:sticky;top:0}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child,.tbl th:first-child{font-weight:600;min-width:130px}
.plan th,.plan td{max-width:none;vertical-align:middle}
.plan th{white-space:nowrap}
.plan td:first-child,.plan th:first-child{min-width:78px}
.pd-date{white-space:nowrap} .pd-date b{font-family:var(--f-display);font-size:14px} .pd-date small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.pd-topic{min-width:190px!important;font-weight:600}
.pd-com{min-width:190px!important;color:var(--muted)}
.plan tr.we td{background:color-mix(in srgb,var(--sunk) 60%,transparent)}
.plan tr.today td{background:var(--ochre-soft)}
.plan tr.open td{border-top:2px solid var(--ochre)}
.plan tr.emptyday td{padding-top:4px;padding-bottom:4px}
.chipv{font:500 12px/1.3 var(--f-body);border:1px solid transparent;border-radius:999px;padding:4px 8px;background:var(--sunk);color:var(--ink);max-width:150px;white-space:nowrap}
select.chipv{cursor:pointer;min-height:28px} select.chipv:focus-visible{outline:2px solid var(--ochre);outline-offset:1px}
.chipv.fa,.chipv.pd{background:var(--danger-soft)} .chipv.fb,.chipv.pb,.chipv.s1{background:var(--lagoon-soft)}
.chipv.fc,.chipv.pa,.chipv.s3{background:var(--leaf-soft)} .chipv.fd,.chipv.pc,.chipv.s2{background:var(--ochre-soft)}
.linkish{all:unset;cursor:pointer;font-weight:600} .linkish:hover,.linkish:focus-visible{text-decoration:underline}
.muted{color:var(--muted)}
/* метрики */
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.kpi b{display:block;font:600 clamp(20px,2.6vw,28px)/1.1 var(--f-display);font-variant-numeric:tabular-nums;margin:4px 0}
.kpi small{color:var(--muted);font-size:13px;line-height:1.35;display:block}
.kpi .lab{font:500 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi.main{background:var(--violet-soft);border-color:transparent}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:14px 0;min-width:0}
.panel h2{font:500 16px/1.3 var(--f-display);margin:0 0 4px}
.panel > .hint{display:block;margin:0 0 12px}
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px 14px}
.params label{font:500 11px/1.25 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
.minp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;font-variant-numeric:tabular-nums;min-width:0}
.seg{display:flex;gap:6px;align-items:center}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;cursor:pointer;font-weight:500;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--spot);color:#F7EBD3;border-color:var(--spot)}
.seg .minp{width:76px}
.funnel{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.fstep{flex:1 1 130px;background:var(--violet-soft);border-radius:12px;padding:12px 14px;min-width:0}
.fstep b{display:block;font:600 22px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.fstep small{display:block;color:var(--ink);font-weight:500}
.fstep .ideal{font:500 12px/1.3 var(--f-mono);color:var(--muted);margin-top:6px}
.farrow{align-self:center;font:500 12px/1.3 var(--f-mono);color:var(--muted);text-align:center;min-width:56px}
.farrow::before{content:"→";display:block;font-size:18px;color:var(--violet)}
.formula{font:500 13px/1.6 var(--f-mono);color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px;margin-top:12px;overflow-wrap:anywhere}
.formula b{color:var(--ink);font-weight:600}
.mrow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
.mrow .panel{margin:0}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:500 11px var(--f-body);fill:var(--muted)}
.chart .dl{font-weight:600;fill:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:2px 0 8px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.prog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:64px;margin-bottom:3px}
.prog i{display:block;height:100%;border-radius:3px}
.st-ok{color:var(--leaf)} .st-mid{color:var(--ochre)} .st-low{color:var(--danger)}
.tier{font:500 11px/1.4 var(--f-mono);padding:2px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.tier.key{background:var(--violet-soft);color:var(--ink)} .tier.support{background:var(--sunk);color:var(--ink)} .tier.vanity{border:1px dashed var(--line);color:var(--muted)}
.mtable td{vertical-align:top} .mtable td.num{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.mtable .minp{width:110px;padding:6px 8px}
.mcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mcols .panel{margin:0}
.mcols ul{margin:6px 0 0;padding-left:18px} .mcols li{margin:4px 0}
#vtip{position:fixed;z-index:60;pointer-events:none;background:var(--spot);color:#F7EBD3;font-size:12.5px;line-height:1.4;padding:7px 10px;border-radius:8px;max-width:260px;box-shadow:var(--shadow)}
.btn.sm{min-height:24px;padding:0 8px;font-size:12px}
.body h4{font:600 13px/1.3 var(--f-body);margin:12px 0 4px;color:var(--ochre)}
.body.clamp{max-height:7.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
.more{grid-column:1/-1;justify-self:start;background:none;border:0;color:var(--lagoon);cursor:pointer;padding:2px 0;font-size:13px}
.item:not(.nodate) .more{grid-column:2/-1}
.mono{font-family:var(--f-mono);font-size:13px;white-space:pre-wrap}

/* обзор */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--muted)}
.tile b{font:500 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:12.5px}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;margin-top:8px}
.passport{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pp{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.pp:first-child{border-top:0}
.pp dt{font:500 12px/1.5 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pp dd{margin:0;overflow-wrap:anywhere}
.pp dd p{margin:0 0 4px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}

.empty{border:1px dashed var(--line);border-radius:12px;padding:26px 20px;color:var(--muted);text-align:left;background:color-mix(in srgb,var(--surface) 50%,transparent)}
.empty strong{display:block;color:var(--ink);margin-bottom:4px}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.banner{border-radius:10px;padding:10px 14px;background:var(--ochre-soft);color:var(--ink);font-size:14px;margin-bottom:16px}

/* модалка */
dialog{border:0;border-radius:16px;padding:0;width:min(640px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(14,22,17,.55)}
.dlg{padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px;max-height:calc(100dvh - 40px);overflow:auto}
.dlg h3{font:500 18px/1.2 var(--f-display);margin:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;font-size:15px;width:100%}
.f textarea{min-height:150px;resize:vertical;line-height:1.5}
.dlg-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding-top:4px}
.dlg-foot .r{display:flex;gap:8px;margin-left:auto}
.hint{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--spot);color:#F7EBD3;padding:10px 16px;border-radius:999px;font-size:14px;z-index:50}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px;padding-top:12px}
  nav.side{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-direction:row;overflow-x:auto;background:var(--bg);padding-block:8px;margin-inline:-4px;scrollbar-width:none}
  .navgroup{display:none}
  nav.side a{flex:0 0 auto;border:1px solid var(--line);border-left:1px solid var(--line);border-bottom:3px solid color-mix(in srgb,var(--g,var(--line)) 60%,transparent);border-radius:999px;padding:6px 12px;font-size:14px}
  nav.side a[aria-current="page"]{border-bottom-color:var(--g,var(--ochre))}
  .mgrid{grid-template-columns:1fr 1fr!important}
  .mrow,.mcols{grid-template-columns:minmax(0,1fr)!important}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .fgrid{grid-template-columns:1fr}
  .pp{grid-template-columns:minmax(0,1fr) auto}
  .pp dt{grid-column:1/-1}
  .item{grid-template-columns:minmax(0,1fr) auto}
  .item .date{grid-column:1/-1;display:flex;gap:6px;align-items:baseline}
  .date b{display:inline;font-size:15px}
  .item:not(.nodate) .body,.item:not(.nodate) .more{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <canvas id="leo" aria-hidden="true"></canvas>

<script type="application/json" id="snapshot">{"generatedAt":"2026-11-12T13:30:02+00:00","items":[{"id":"asset-01","body":"Прислал 11.11: SVG и PNG. Файлы в папке проекта: maori/assets/logo-maori.svg и logo-maori.png. Логотип стоит в шапке пульта.","group":"От клиента","order":10,"section":"assets","status":"Получено","title":"Логотип в SVG и PNG"},{"id":"asset-02","body":"Мудборд на белом фоне — в общем чате (11.11). Pinterest-мудборд не нужен: дизайн почти завершён.","group":"От клиента","order":20,"section":"assets","status":"Получено","title":"Мудборд интерьера"},{"id":"asset-03","body":"Круг с леопардовым принтом, надпись «Māори» чёрным рукописным шрифтом.","group":"От клиента","link":"https://www.instagram.com/maori.lounge/","order":30,"section":"assets","status":"Получено","title":"Аватар с леопардовым принтом"},{"id":"asset-04","body":"Рендеров нет. Планировку владелец может прислать — попросить, нужна для схемы зон и хайлайта «Посадка». Для контента используем только фрагменты.","group":"От клиента","order":40,"section":"assets","status":"Запрошено","title":"Рендеры или планировка зала"},{"id":"asset-05","body":"Меню и барная карта ещё в разработке (11.11). Будет электронное меню по ссылке для Instagram, TG и VK, внутри — планшет.","group":"От клиента","order":50,"section":"assets","status":"Запросить","title":"Меню и барная карта (черновики)"},{"id":"asset-06","body":"Леопардовая мебель ещё не приехала (11.11).","group":"От клиента","order":60,"section":"assets","status":"Запросить","title":"Фото униформы и обивки в леопарде"},{"id":"asset-07","body":"Пришлёт Женя. По нему команда собирает вопросы к владельцу.","group":"От команды","order":70,"section":"assets","status":"Запрошено","title":"Шаблон стратегии"},{"id":"asset-08","group":"Ссылки","link":"https://www.instagram.com/maori.lounge/","order":80,"section":"assets","status":"Получено","title":"Instagram @maori.lounge"},{"id":"aud-01","body":"**Что сказал владелец:** активная аудитория с 18 лет, строго 18+, ядро 22–28. Вузы как канал — ок.\n**Что проверить:** средний чек, частота, куда ходят сейчас.\n**Где искать:** вузы Рязани, студенческие паблики.","order":10,"section":"audience","status":"Проверяем","title":"Студенты и зумеры"},{"id":"aud-02","body":"**Что сказал владелец:** первые 4–5 часов работы — только ближний трафик офисов (парковки нет). Им — скорость отдачи блюд, позже предзаказ через приложение. Считает, что офисы придут сами, поэтому только лифты/баннеры в БЦ, без подарков и купонов.\n**Рядом:** свой БЦ, БЦ «Капитал», офис МТС.","order":20,"section":"audience","status":"Подтверждено","title":"Офисные сотрудники по соседству"},{"id":"aud-03","body":"**Что сказал владелец:** с 18:00 — классическая лаунж-посадка: поболтать, кальян, немного консолей. Тихо, без танцев.","order":30,"section":"audience","status":"Подтверждено","title":"Компании друзей на вечер"},{"id":"aud-04","body":"**Почему:** тёплый уют, тропический вайб, аквариум.\n**Что проверить:** есть ли камерные зоны, сценарии свидания, средний чек на двоих.\n\n**Ответ владельца 11.11:** средний чек на двоих 2 500–3 500 ₽; будут VIP и полу-VIP. Сценарий свиданий пока не прорабатывали.","order":40,"section":"audience","status":"Гипотеза","title":"Пары на свидание"},{"id":"aud-05","body":"**Почему:** двухметровый леопард и аквариум — сильные инста-объекты.\n**Что проверить:** кто приходит фотографироваться и как превратить их в гостей с заказом.","order":50,"section":"audience","status":"Проверяем","title":"Гости, которые приходят ради фото"},{"id":"aud-06","body":"**Данные владельца:** по статистике Instagram и VK прошлых проектов ~70% — девушки.\n**Сценарий:** приходят с подругами покурить кальян и поговорить: кофе в будни, коктейли в пт/сб. Выбирают за эстетику и чистоту.\n**Следствие:** за ними приходят парни (замкнутый круг). Контент и продвижение делаем в первую очередь для них: эстетика, леопард, фото.","order":5,"section":"audience","status":"Подтверждено","title":"Девушки с подругами — главная аудитория"},{"id":"aud-07","body":"18–35, идут за стабильным качеством кальяна и туда, где красиво и где сидят девушки. Часть — постоянники прошлых проектов владельца.","order":6,"section":"audience","status":"Подтверждено","title":"Парни за кальяном"},{"id":"bb-01","body":"Стоит в описании Instagram. На брифе выясняем, что именно будет иначе.","group":"Основа","order":10,"section":"brandbook","status":"Факт от клиента","title":"Слоган «Здесь будет иначе»"},{"id":"bb-02","body":"Большой коктейльный бар, азиатско-европейская кухня, кальяны.","group":"Основа","order":20,"section":"brandbook","status":"Факт от клиента","title":"Прежде всего лаунж, но и полноценный ресторан"},{"id":"bb-03","body":"Это не реконструкция культуры маори, а тёплый вымышленный остров. Рамки описаны в статье базы «Культурная чувствительность».","group":"Основа","order":30,"section":"brandbook","status":"Факт от клиента","title":"Островная тема, близкая по духу Полинезии"},{"id":"bb-04","body":"Униформа персонала, обивка мебели, детали. Предлагаем правило: на светлой базе принт занимает 10–20% поверхности.","group":"Визуал","order":40,"section":"brandbook","status":"Факт от клиента","title":"Леопардовый принт — главная фишка айдентики"},{"id":"bb-05","body":"Проект очень светлый по оттенкам. Детали — в мудборде клиента.","group":"Визуал","order":50,"section":"brandbook","status":"Факт от клиента","title":"Светлая база интерьера"},{"id":"bb-06","body":"Банановые листья и другие тропические растения.","group":"Визуал","order":60,"section":"brandbook","status":"Факт от клиента","title":"Тропическая зелень"},{"id":"bb-07","body":"Остался от прежних владельцев, в нём много рыб. Вместе с зеленью связывает проект с островной темой.","group":"Визуал","order":70,"section":"brandbook","status":"Факт от клиента","title":"Аквариум на 6 метров"},{"id":"bb-08","body":"По аватару: чёрная рукописная надпись на круге с леопардовым принтом. Исходники в SVG и PNG запрашиваем у клиента.","group":"Визуал","order":80,"section":"brandbook","status":"Факт от клиента","title":"Логотип: «Māори» рукописным шрифтом"},{"id":"bb-09","body":"Светлая песочно-зелёная база, глубокий тропический зелёный, охра леопарда, почти чёрный для пятен и текста, бирюза воды аквариума. Утвердить после мудборда.","group":"Визуал","order":90,"section":"brandbook","status":"Гипотеза","title":"Палитра"},{"id":"bb-10","body":"Черта над «ā» — линия горизонта острова. Можно использовать отдельно: в навигации, на посуде, в сторис.","group":"Визуал","order":100,"section":"brandbook","status":"Гипотеза","title":"Макрон как фирменный элемент"},{"id":"bb-11","body":"Онлайн — на «вы», но без официоза: дружелюбно, загадочно и стильно (ответ владельца 11.11). Говорим смыслами и коротко. Внутри заведения персонал быстро переходит с гостями на «ты» — это только офлайн.","group":"Голос бренда","order":110,"section":"brandbook","status":"Факт от клиента","title":"Тон коммуникации"},{"id":"bb-12","body":"Каждый визуальный и сервисный элемент получает короткую расшифровку. См. статью базы «Словарь смыслов».","group":"Голос бренда","order":120,"section":"brandbook","status":"Гипотеза","title":"У каждой детали есть смысл"},{"id":"bb-13","body":"Позиция «мы любим леопардов живыми»: принт и искусственные материалы, натуральный мех не используем.","group":"Голос бренда","order":130,"section":"brandbook","status":"Гипотеза","title":"Только искусственный мех"},{"id":"bb-14","body":"Инста-объект и маскот бренда.","group":"Маскот","order":140,"section":"brandbook","status":"Факт от клиента","title":"Двухметровый леопард в центре зала"},{"id":"bb-15","body":"Варианты: «Лео» (уже звучит в сценариях) или «Māори» (māori — «обычный человек»).\n**Рекомендуем:** в контенте звать его «Лео» — коротко, тепло и не путается с названием заведения. Māори остаётся именем места: «Лео выбрал Māори». Если владелец хочет одно имя на всё — берём «Māори».\nРаскрыть имя можно на открытии 10.12.","group":"Маскот","order":150,"section":"brandbook","status":"Гипотеза","title":"Имя маскота"},{"id":"bb-16","body":"Черновик легенды — в базе знаний. Показываем владельцу на брифе.","group":"Маскот","order":160,"section":"brandbook","status":"Гипотеза","title":"Легенда «Леопард на острове»"},{"id":"bb-17","body":"**Основной архетип — Искуситель:** стиль, вкус, удовольствие, атмосфера, лёгкая загадка. Это лаунж, куда приходят за ощущениями, а не за едой «на бегу».\n**Второй — Славный малый:** māori = «обычный человек». Нормальность в хорошем смысле: понятные цены, стабильное качество, место на каждый день, без пафоса.\n\n**Если бы Māори был человеком**, это был бы статный, неторопливый и уверенный хищник: его уважают, он не суетится и не заискивает. Держится по-дружески, но на «вы», говорит коротко и со вкусом, оставляет немного недосказанности.\n\n**Черты личности:**\n- уверенный и спокойный, вальяжный;\n- загадочный, но не холодный;\n- стильный и внимательный к деталям;\n- гостеприимный без панибратства;\n- честный и надёжный: что обещал — то и есть.\n\n**Каким не бывает:** милым и сюсюкающим, суетливым, кричащим, пошлым, «смешным» ради смеха, пафосным.","group":"Архетип и ассоциации","order":170,"section":"brandbook","status":"Гипотеза","title":"Архетип бренда: каким был бы Māори, если бы был человеком"},{"id":"bb-18","body":"Пять ассоциаций — проверяем по ним каждый пост, коллаб, текст и приглашение.\n1. **Леопард — хищная грация.** Мягкая сила, следы, взгляд, движение. Не плюшевый котик.\n2. **Загадка.** «В городе что-то происходит»: недосказанность, интрига, «он выбрал своё место».\n3. **Тёплый остров.** Зелень, аквариум, мягкий свет, ощущение отпуска посреди Рязани.\n4. **Ритуал вкуса.** Кальян от мастеров, огромная полка табака, угли меняют вовремя; еда и подача, которыми хочется поделиться.\n5. **Нормальность высокого уровня.** Стабильно, понятно, без пафоса — сюда можно возвращаться каждый день.","group":"Архетип и ассоциации","order":180,"section":"brandbook","status":"Гипотеза","title":"Ассоциации, которые закладываем"},{"id":"bb-19","body":"Решили на созвоне команды 12.11.\n- **«Депозит», а не «бесплатно».** Всё, что дарим, называем депозитом: «депозит на кальян», «сертификат-депозит». Так и в постах, и в письмах блогерам. «Бесплатно» обесценивает продукт.\n- **«Следы», а не «лапки».** Лапки — это игрушка из магазина; леопард не милый.\n- **Хищник одиночка.** Не используем «стая» и подобное: леопарды живут поодиночке.\n- Подходят слова: следы, хищник, территория, приручить, выбрал своё место, вальяжно.","group":"Голос бренда","order":135,"section":"brandbook","status":"Согласовано","title":"Слова: говорим и не говорим"},{"id":"bb-20","body":"Для рилсов, обложек и подписей. Тон — на «вы», загадочно, уверенно.\n- **«Хищник выбрал своё место. Теперь ваша очередь».** Главный для приглашения: продолжает серию «Он выбрал своё место».\n- «Приручите своего зверя».\n- «Māори. Здесь приручают вечер».\n- «Он уже здесь. Ждёт вас 10 декабря».\n- «Мягко. Медленно. Māори».\n- Базовый слоган остаётся: «Здесь будет иначе».","group":"Голос бренда","order":137,"section":"brandbook","status":"Гипотеза","title":"Слоганы и короткие фразы"},{"id":"brief-101","body":"Решает владелец (Максим). Инвестор-партнёр дал свободу: «делай, как видишь». Тексты объявлений и сметы подтверждает сам.","group":"1. Знакомство и правила работы · Женя","order":101,"section":"brief","status":"Ответ есть","title":"Кто принимает решения и согласует материалы? Сколько времени обычно нужно на ответ?"},{"id":"brief-102","body":"Общий чат + этот пульт. Времени мало (стройка), отвечает не сразу.","group":"1. Знакомство и правила работы · Женя","order":102,"section":"brief","status":"Ответ есть","title":"Где вам удобнее общаться: общий чат, созвоны, этот пульт? В какие часы вас лучше не беспокоить?"},{"id":"brief-103","body":"Открыт к идеям, любит то, чего никто не делал. Сам себя считает «замороченным» заказчиком. В деталях интерьера и смыслах — твёрдое видение; в продвижении и контенте ждёт наших предложений.","group":"1. Знакомство и правила работы · Женя","order":103,"section":"brief","status":"Ответ есть","title":"Как вы хотите работать с нашими рекомендациями по позиционированию, униформе и контенту? Где у вас твёрдое видение, а где вы ждёте нашей экспертизы?"},{"id":"brief-201","body":"«Иначе» = нормально: стабильное качество, понятные цены и порции, сервис (убрать салфетку сразу), светлое помещение вместо подвала. Место на каждый день, а не по праздникам.","group":"2. Продукт и легенда бренда · Максим","order":201,"section":"brief","status":"Ответ есть","title":"Что значит «здесь будет иначе»? Назовите три вещи, которых гость не найдёт в других заведениях Рязани."},{"id":"brief-202","body":"Сначала появился леопард, потом подобрал слово. Смысл: māori = «обычный человек» (в отличие от богов). Произношение — как угодно (маори/маури). В аутентичность не уходим — это «только помешает».\n\n**Ответ владельца 11.11:** некоторые элементы аутентичности народа маори планирует использовать, но без фанатизма. База знаний и брендбук ему зашли.","group":"2. Продукт и легенда бренда · Максим","order":202,"section":"brief","status":"Ответ есть","title":"Почему Māори? Что для вас значит это слово, откуда пришла идея, как правильно произносить и где ударение?"},{"id":"brief-203","body":"Леопард — личная любовь владельца (сам носит леопард, есть леопардовая шуба). Маскот — пенопластовая фигура 2 м на заказ, обвивает колонну, как кот когтедёрку. В нейроконтенте может быть чуть разным. Имя маскота не обсуждали — спросить.","group":"2. Продукт и легенда бренда · Максим","order":203,"section":"brief","status":"Ответ есть","title":"Почему леопард? Какой у него характер и история, как он связан с островом? Есть ли у маскота имя или придумаем его вместе?"},{"id":"brief-204","body":"Кухня — вторая сильная сторона, поднимать до уровня кальянов. Шеф проектный, уйдёт, но будет курировать. 4 завтрака весь день (скрэмбл, яичница, каша…). Днём — скорость для офисов, через 2–4 месяца — предзаказ через приложение. Средний чек и часы работы — не озвучены.\n\n**Ответ владельца 11.11:** средний чек на двоих 2 500–3 500 ₽. Бизнес-ланч: скидка 25% на всё меню (кальян, кухня, бар) с 12:00 до 17:00 и комбо «мини-чаша + блюдо + напиток».","group":"2. Продукт и легенда бренда · Максим","order":204,"section":"brief","status":"Ответ есть","title":"Кухня: какие 3–5 блюд станут героями? Какой средний чек? Будет ли бизнес-ланч для офисов рядом? Часы работы?"},{"id":"brief-205","body":"Бар в пиаре притушаем: акцент на кальяны и кухню. Принт будет даже в коктейлях.","group":"2. Продукт и легенда бренда · Максим","order":205,"section":"brief","status":"Ответ есть","title":"Бар: будут ли авторские коктейли, тики-подача, безалкогольная линейка? Есть ли фирменный коктейль?"},{"id":"brief-206","body":"Сильнейшая сторона, 60–70% концепции — лаунж. Стабильное качество, гигантская полка табака, профи из бывших учеников. Без шоу и наворотов, как было в прошлом проекте.","group":"2. Продукт и легенда бренда · Максим","order":206,"section":"brief","status":"Ответ есть","title":"Кальяны: какое место они занимают в концепции и выручке? Есть ли фишки подачи?"},{"id":"brief-207","body":"Тихий спокойный лаунж, без танцев и знакомств. Немного игровых консолей — бонус, не акцент. Столы с небольшими фишками. Парковки нет. Посадка и музыка — не обсуждали.\n\n**Ответ владельца 11.11:** 70 посадок, включая барную стойку. 1 VIP-комната и 1 полу-VIP (зонированная, не отдельная комната); в каждой — PlayStation, но после открытия.","group":"2. Продукт и легенда бренда · Максим","order":207,"section":"brief","status":"Ответ есть","title":"Зал: сколько посадочных мест, какие зоны, какая музыка? Будут ли DJ или живая музыка?"},{"id":"brief-208","body":"Улучшают свет, рыбок и декор после прошлых владельцев, делают на аквариуме сильный визуальный акцент для фото. Делать героем контента — можно и нужно (ответ 11.11).","group":"2. Продукт и легенда бренда · Максим","order":208,"section":"brief","status":"Ответ есть","title":"Что вы планируете делать с шестиметровым аквариумом? Можно ли сделать его героем контента?"},{"id":"brief-209","body":"Нельзя: стройку; «смешные» рилсы с персоналом и липсинги («под запретом навсегда»); танцы; игру в племя («набедренные пояса»); нейрослоп; дату открытия на трафаретах.","group":"2. Продукт и легенда бренда · Максим","order":209,"section":"brief","status":"Ответ есть","title":"Что категорически нельзя: показывать стройку, использовать какие-то цвета, слова или приёмы?"},{"id":"brief-301","body":"По статистике Instagram и VK прошлых проектов — примерно 70/30 в пользу девушек. Девушки с подругами: кальян и разговоры за кофе в будни, коктейли в пт/сб. За ними приходят парни. Возраст 18–35, ядро 22–28. Строго 18+.","group":"3. Аудитория · Максим","order":301,"section":"brief","status":"Ответ есть","title":"Опишите 2–3 конкретных гостей, которых вы хотите видеть: кто они, сколько им лет, чем живут, с кем приходят?"},{"id":"brief-302","body":"Никаких танцев, знакомств и «разврата». Дети и пожилые — не аудитория (18+). Не «подвальная кальянная».","group":"3. Аудитория · Максим","order":302,"section":"brief","status":"Ответ есть","title":"Кого вы не хотите видеть? С чем место не должно ассоциироваться?"},{"id":"brief-303","body":"Первые 4–5 часов после открытия — ближний трафик офисов (парковки нет, издалека не поедут). С 18:00 — классическая лаунж-посадка.","group":"3. Аудитория · Максим","order":303,"section":"brief","status":"Ответ есть","title":"Будни и выходные, день и ночь: кто приходит в какое время? На какое время вы делаете ставку?"},{"id":"brief-304","body":"Основные конкуренты (по словам владельца — «на самом деле не особо»): **Гозе, Мирра, Хука, Подбелка, Эмбер**. Вальхаллу, Smoke Elements, Фил Фри и подобных можно вычеркнуть: пропасть по дизайну, сервису и локации, за ними не следят (ответ 11.11).","group":"3. Аудитория · Максим","order":304,"section":"brief","status":"Ответ есть","title":"Куда эти люди ходят сейчас? Кого вы считаете конкурентами в Рязани?"},{"id":"brief-305","body":"Ответ 11.11, своими словами владельца, чуть смягчили:\n- «Вы видели у них леопарда в центре зала?!»\n- Еда — бомба, посуда и подача крутые, очень вкусно.\n- Сервис классный: кнопки вызова, стильный персонал, коктейли тоже топ.\n- Кальян шикарный, уголь меняют часто, огромная полка табака, мастера — профи.","group":"3. Аудитория · Максим","order":305,"section":"brief","status":"Ответ есть","title":"Что гость должен рассказать друзьям после первого визита?"},{"id":"brief-306","body":"Есть статистика Instagram и VK прошлых проектов (70/30 девушки) и постоянники, часть команды переходит из прошлых заведений.","group":"3. Аудитория · Максим","order":306,"section":"brief","status":"Ответ есть","title":"Есть ли у вас данные с прошлых проектов: база гостей, отзывы, понимание рязанской аудитории?"},{"id":"brief-401","body":"Да: розыск (цветной), лапки по трафарету, нейровидео «леопард гуляет», шары вместо надувной лапы, леопардовый человек (в шубе, без грима), лифт. Нет/потом: автобус, проекция, фигурки (только если дёшево и красиво), клуб пробежек после открытия. Баннер со стикерами — не решили (клиент боится вандализма).","group":"4. PR и «Леопардовый бум» · Лиза","order":401,"section":"brief","status":"Решено","title":"Показываем карту: где и как леопардовый принт появляется в городе. Что из этого вам откликается?"},{"id":"brief-402","body":"Хулиганство — да, но с чётким порогом: только то, за что ничего не будет. Районы: Почтовая, центр, ТЦ «Малина». Надписи на асфальте и объявления — если легально. Тексты подтверждает сам.","group":"4. PR и «Леопардовый бум» · Лиза","order":402,"section":"brief","status":"Ответ есть","title":"Где проходят границы: стрит-арт, стикеры, костюмы, флешмобы, провокация? Что допустимо для бренда?"},{"id":"brief-403","body":"Рекламный бюджет не выделен. На розыгрыш готов 20–25 тыс. (4–5 депозитов по 5 000 ₽). Шары, стаканы, брелоки с Ozon — «ерунда, дам». Женя проговаривает с ним рекламный бюджет (включая генерации).","group":"4. PR и «Леопардовый бум» · Лиза","order":403,"section":"brief","status":"Спросили","title":"Какой порядок бюджета на запуск и на продвижение в первые месяцы?"},{"id":"brief-404","body":"«Воздушный слон» (шары), SkyRoom (леопардовая коллекция), клуб пробежек (есть группа в леопардовом), управляющая своего БЦ, БЦ «Капитал», партнёры Жени по городским экранам.","group":"4. PR и «Леопардовый бум» · Лиза","order":404,"section":"brief","status":"Ответ есть","title":"Есть ли знакомые и партнёры: блогеры, медиа, вузы, соседние офисы, МТС, поставщики?"},{"id":"brief-405","body":"Сам снимает нейроролики в леопарде для аккаунта, даёт свою шубу для съёмки. Прямого ответа про интервью не было.","group":"4. PR и «Леопардовый бум» · Лиза","order":405,"section":"brief","status":"Спросили","title":"Готовы ли вы лично быть лицом проекта: интервью, сторис, история основателя?"},{"id":"brief-501","body":"Можно: концепцию, смыслы, небольшие детали и атмосферу «в движении» (карусель из 10 смазанных кадров с фразами — видел у казанского заведения). Любит эстетику, фото блюд, интерьер, маскота почти в каждом посте, качественную нейронку, стильные (не смешные) тренды.","group":"5. Контент до открытия · Алёна","order":501,"section":"brief","status":"Ответ есть","title":"Что можно показывать: фрагменты интерьера, текстуры, униформу, команду, меню? Что нельзя ни при каких условиях?"},{"id":"brief-502","body":"Онлайн — на «вы», но без лишнего официоза, дружелюбно. Ещё — загадочно и стильно. Внутри заведения с гостями быстро переходят на «ты», но только офлайн и после первых контактов (ответ 11.11).","group":"5. Контент до открытия · Алёна","order":502,"section":"brief","status":"Ответ есть","title":"Как обращаемся к аудитории: на «вы» или на «ты»? Какой тон: дерзкий, тёплый, ироничный?"},{"id":"brief-503","body":"Сейчас аккаунт ведёт владелец, теперь — мы. SMM-специалиста будет искать позже. Доступ оставит, если продлим сотрудничество (ответ 11.11).","group":"5. Контент до открытия · Алёна","order":503,"section":"brief","status":"Ответ есть","title":"Кто ведёт аккаунт сейчас и кто будет вести после открытия? Нужен ли нам доступ?"},{"id":"brief-504","body":"Telegram нужно создать и гнать туда трафик во время конкурсов. В VK доступ дал. Яндекс Карты и 2ГИС ведёт сам; после открытия вручную выгрузит туда все позиции меню (ответ 11.11).","group":"5. Контент до открытия · Алёна","order":504,"section":"brief","status":"Ответ есть","title":"Какие площадки, кроме Instagram: Telegram, VK, Яндекс Карты, 2ГИС?"},{"id":"brief-505","body":"До открытия — короткая съёмка деталей (день согласовать). После открытия — обязательный обзор с моделями, прогон еды, кальяны. Персонала пока нет; в кадре — «50 на 50», только эстетика и истории.","group":"5. Контент до открытия · Алёна","order":505,"section":"brief","status":"Ответ есть","title":"Когда можно снимать в готовом зале и персонал в униформе?"},{"id":"brief-601","body":"Скорее всего, будут доделывать до последнего, поэтому soft opening 9 декабря под вопросом. 10 декабря — работа по броням с вечера, диджей для атмосферы, команда подходит ко всем столам и спрашивает мнение. Гранд-опенинг пока не делаем: нет времени, бюджета и команды (ответ 11.11).","group":"6. Открытие · Лиза, Женя","order":601,"section":"brief","status":"Ответ есть","title":"Каким будет открытие: одно событие или сначала soft opening для своих, а затем большое открытие?"},{"id":"brief-602","body":"Блогеров — точно, партнёров — можно, студентов — нет. Гостей прошлых проектов будет не меньше половины зала: база большая, многие ждут. Зал — 70 посадок, включая барную стойку (ответ 11.11).","group":"6. Открытие · Лиза, Женя","order":602,"section":"brief","status":"Ответ есть","title":"Кого зовём: блогеров, партнёров, соседние офисы, студентов, гостей прошлых проектов? Сколько человек вмещает зал?"},{"id":"brief-603","body":"Предложил розыгрыш: 4 депозита по 5 000 ₽ за репост рилса, за 1–2 недели до открытия. Можно предложить другую механику. Другие спецпредложения не обсуждали.\n\n**Ответ владельца 11.11:** после 17:00 скидок и акций нет, кроме системы лояльности: кэшбэк 3–4% для новых гостей, дальше растёт по мере трат. Днём — скидка 25% с 12:00 до 17:00.","group":"6. Открытие · Лиза, Женя","order":603,"section":"brief","status":"Спросили","title":"Будут ли спецпредложения на открытие и первые недели?"},{"id":"brief-604","body":"Дата может сдвинуться — поэтому дату не пишем на трафаретах и несъёмных носителях. Экскурсию по залу придумывает на ходу, времени мало.\n**11.11:** открытие перенесли с 22 ноября на 10 декабря.","group":"6. Открытие · Лиза, Женя","order":604,"section":"brief","status":"Ответ есть","title":"Насколько точна дата открытия? Что делаем, если стройка задержится?"},{"id":"brief-701","body":"Ответ 11.11:\n- Логотип SVG и PNG — прислал (в шапке пульта и в «Материалах»).\n- Мудборд — был выше в общем чате, на белом фоне. Pinterest-мудборд не нужен: дизайн почти завершён.\n- Рендеров нет. Планировку может скинуть, если нужна.\n- Фото леопардовой мебели пока нет — не приехала.\n- Меню и барная карта ещё в разработке.","group":"7. Материалы и сроки · все","order":701,"section":"brief","status":"Ответ есть","title":"Когда вы сможете прислать логотип в SVG и PNG, мудборд, рендеры или планировку, меню, барную карту и фото униформы?"},{"id":"brief-702","body":"Владелец спрашивает управляющую своего БЦ про лифт. Мы — БЦ «Капитал». Женя — адреса экранов и юридический ответ по 18+. Нужно его «да» по рекламному бюджету.","group":"7. Материалы и сроки · все","order":702,"section":"brief","status":"Спросили","title":"Какие решения нужны от вас в ближайшие три дня и кто их примет?"},{"id":"cj-00","body":"Эмоции по шкале от −2 до +2. Главные провалы — на этапах 2, 4 и 6.\n\n| Этап | Действия | Точки контакта | Эмоция | Главный барьер | Возможность |\n|---|---|---|---|---|---|\n| 1. Узнаёт | Видит леопарда в городе и сторис подруг | Рилсы, розыск, лифт, SkyRoom, сарафан | +1 интрига | «Очередная кальянная?» | Всё ведёт на @maori.lounge, раскрытие 19.11 |\n| 2. Изучает | Смотрит профиль, цены, 2ГИС | Instagram, 2ГИС, Яндекс | 0 сомнение | Нет цен и отзывов | Хайлайты «Меню и цены», первые отзывы с soft opening |\n| 3. Бронирует | Пишет в директ, уточняет стол | Директ, телефон, бронь в 2ГИС | +1 / −1 | Долгий ответ | Ответ за 15 минут, подтверждение с фото входа |\n| 4. Добирается | Ищет вход в офисном здании | Навигатор, вход, лифт, хостес | −1 → +1 | «Где вход?», нет парковки | Точка входа в 2ГИС, лапки до двери |\n| 5. Заказывает | Выбирает вкус, еду, напитки | Мастер, официант, меню | +1 | «Забьют что есть», давление | Три вопроса мастера, кальян за 15 минут |\n| 6. Вечер | Курит, говорит, фотографируется, ест | Кальян, угли, кухня, фото-точка, музыка | +2 / −2 | Горечь, угли, шум, темнота | Угли по таймеру, перезабивка, тихая музыка, свет |\n| 7. Уходит | Делит счёт, оставляет чаевые | Официант, терминал, QR | 0 | Сюрпризы в счёте | Раздельный счёт, чаевые и отзыв по QR |\n| 8. После | Сторис, отзыв, возврат | Instagram, 2ГИС, директ | +1 | Позитив не доходит до карт | Репосты, ответ за 24 ч, приглашение в будни |","group":"1. Карта целиком","order":10,"section":"cjm","status":"Черновик","title":"CJM одной таблицей: «Подруги на вечер»"},{"id":"cj-01","body":"**Действия клиента:** листает Instagram и сторис подруг, видит в городе объявления «Разыскивается леопард», лапки и шары, слышит от знакомых. После открытия видит Māори в подборках и на картах.\n\n**Точки контакта:**\n- Нейровидео и рилсы @maori.lounge.\n- Объявления о розыске на Почтовой и в центре.\n- Леопардовый лифт и баннер в БЦ.\n- Коллаборация со SkyRoom.\n- Сарафан.\n- Карточка в 2ГИС и Яндекс Картах.\n\n**Мотивация и ожидания:** новое место, «в Рязани что-то происходит», хочется узнать первой.\n\n**Страхи и барьеры:**\n- «Очередная кальянная».\n- «Что за Māори? Тематический клуб с племенем?»\n\n**Эмоции:** любопытство и интрига, +1.\n\n**Проблемы:**\n- Связь леопарда с местом пока не очевидна.\n- Дата открытия может сдвинуться.\n- Instagram в РФ доступен не всем.\n\n**Возможности:**\n- Каждый носитель ведёт на один адрес: @maori.lounge плюс QR.\n- К 19.11 раскрыть, что леопард — это Māори.\n- Карточку 2ГИС с фото и меню завести до открытия.","group":"2. Этапы пути: «Подруги на вечер»","order":10,"section":"cjm","status":"Черновик","title":"Этап 1. Узнаёт о Māори"},{"id":"cj-02","body":"**Действия клиента:** открывает профиль, смотрит интерьер и меню, ищет цены. В 2ГИС или Яндексе смотрит рейтинг, фото гостей и отзывы. Кидает ссылку подругам в чат.\n\n**Точки контакта:**\n- Шапка и хайлайты Instagram.\n- Карточка в 2ГИС и Яндексе.\n- Сторис.\n- Директ.\n\n**Мотивация и ожидания:** убедиться, что светло, красиво, вкусно и не дорого.\n\n**Страхи и барьеры:**\n- Нет цен — «наверное, дорого».\n- Нет отзывов — «а вдруг сыро».\n- Тёмные фото — «очередной подвал».\n\n**Эмоции:** сомнение, 0.\n\n**Проблемы:**\n- У нового места нет отзывов и фото гостей.\n- Меню может быть не готово к открытию 10.12.\n\n**Возможности:**\n- Хайлайты «Меню и цены», «Как нас найти», «Курить не обязательно».\n- Фото при дневном свете.\n- Ответ в директ за 15 минут.\n- Первые отзывы собрать на soft opening.","group":"2. Этапы пути: «Подруги на вечер»","order":20,"section":"cjm","status":"Черновик","title":"Этап 2. Изучает и сравнивает"},{"id":"cj-03","body":"**Действия клиента:** договаривается с подругами о дне, пишет в директ или звонит, уточняет стол, депозит и можно ли без кальяна.\n\n**Точки контакта:**\n- Директ.\n- Телефон.\n- Бронь в 2ГИС или Яндексе.\n- Хостес.\n\n**Мотивация и ожидания:** занять хороший стол у окна или у леопарда и быть уверенной, что всё будет.\n\n**Страхи и барьеры:**\n- Долго не отвечают.\n- Навязывают депозит.\n- Посадят у туалета.\n\n**Эмоции:** предвкушение +1. Если ответа нет, раздражение −1.\n\n**Проблемы:** в день открытия и первые выходные возможен наплыв, зал будет переполнен.\n\n**Возможности:**\n- Онлайн-бронь с выбором зоны.\n- Шаблоны быстрых ответов.\n- Подтверждение брони сообщением с адресом и фото входа.","group":"2. Этапы пути: «Подруги на вечер»","order":30,"section":"cjm","status":"Черновик","title":"Этап 3. Решает и бронирует"},{"id":"cj-04","body":"**Действия клиента:** едет на такси или идёт пешком (парковки нет), ищет вход в офисное здание напротив МТС, заходит, встречается с хостес.\n\n**Точки контакта:**\n- Навигация в 2ГИС.\n- Вывеска и вход в БЦ.\n- Лифт.\n- Хостес.\n- Гардероб.\n\n**Мотивация и ожидания:** быстро найти место и не плутать вечером по бизнес-центру.\n\n**Страхи и барьеры:**\n- «Где вход?»\n- Вечером БЦ закрыт или стоит охрана.\n\n**Эмоции:** напряжение −1, при встрече с хостес облегчение +1.\n\n**Проблемы:** вход в офисном здании неочевиден, парковки нет.\n\n**Возможности:**\n- Точка входа в 2ГИС.\n- Фото входа в хайлайтах и в подтверждении брони.\n- Леопардовые лапки от улицы до двери.\n- Леопардовый лифт.","group":"2. Этапы пути: «Подруги на вечер»","order":40,"section":"cjm","status":"Черновик","title":"Этап 4. Добирается и входит"},{"id":"cj-05","body":"**Действия клиента:** садится, смотрит меню, обсуждает с кальянным мастером вкус и крепость, заказывает напитки и еду.\n\n**Точки контакта:**\n- Хостес.\n- Официант.\n- Кальянный мастер.\n- Меню, бумажное или по QR.\n\n**Мотивация и ожидания:** получить именно свой вкус и быстро.\n\n**Страхи и барьеры:**\n- Забьют «из того, что есть».\n- Непонятные цены.\n- Давят: «закажите кальян».\n\n**Эмоции:** интерес, +1.\n\n**Проблемы:** в первые недели работают новые официанты, на старте возможны сбои кухни.\n\n**Возможности:**\n- Мастер задаёт три вопроса: вкус, крепость, холодок.\n- Кальян приносят за 15 минут.\n- В меню цены и граммовки.\n- Правило «курить не обязательно».","group":"2. Этапы пути: «Подруги на вечер»","order":50,"section":"cjm","status":"Черновик","title":"Этап 5. Садится и заказывает"},{"id":"cj-06","body":"**Действия клиента:** курит, разговаривает, фотографируется у леопарда и аквариума, ест, играет в консоль, дозаказывает.\n\n**Точки контакта:**\n- Кальян и угли.\n- Кухня и бар.\n- Фото-точка.\n- Музыка и вытяжка.\n- Кнопка вызова или официант.\n\n**Мотивация и ожидания:** наговориться, красиво провести время, сделать фото.\n\n**Страхи и барьеры:**\n- Кальян горчит.\n- Угли не меняют.\n- Громко и накурено.\n- Официанта не дозваться.\n\n**Эмоции:** пик +2 при хорошем кальяне и удачных фото. Провал −2 при горечи или шуме.\n\n**Проблемы:** именно на этом этапе у конкурентов больше всего негатива: угли, горечь, музыка, темнота.\n\n**Возможности:**\n- Угли меняют по таймеру.\n- Бесплатная перезабивка в первые 10 минут.\n- Громкость музыки такая, что можно говорить.\n- Свет у фото-точки.\n- Кнопка вызова на столе: её хвалят у Smoke Elements.","group":"2. Этапы пути: «Подруги на вечер»","order":60,"section":"cjm","status":"Черновик","title":"Этап 6. Проводит вечер"},{"id":"cj-07","body":"**Действия клиента:** просит счёт, делит его с подругами, оставляет чаевые, вызывает такси.\n\n**Точки контакта:**\n- Официант.\n- Терминал или QR.\n- Чек.\n\n**Мотивация и ожидания:** быстро, прозрачно, без сюрпризов.\n\n**Страхи и барьеры:**\n- В счёте лишнее или «сервисный сбор».\n- Счёт долго не несут.\n\n**Эмоции:** спокойно, 0. При сюрпризах в счёте разочарование −1.\n\n**Проблемы:** счёт на компанию сложно разделить, чаевые без наличных неудобно оставить.\n\n**Возможности:**\n- Раздельный счёт по умолчанию.\n- Чаевые по QR: гости Гозе прямо об этом просят.\n- На чеке QR для отзыва.","group":"2. Этапы пути: «Подруги на вечер»","order":70,"section":"cjm","status":"Черновик","title":"Этап 7. Расплачивается и уходит"},{"id":"cj-08","body":"**Действия клиента:** выкладывает сторис с отметкой, обсуждает вечер в чате, пишет отзыв, если было очень хорошо или очень плохо. Возвращается или нет.\n\n**Точки контакта:**\n- Instagram: отметки и репосты.\n- Отзывы в 2ГИС и Яндексе.\n- Директ.\n- Программа лояльности, если появится.\n\n**Мотивация и ожидания:** поделиться находкой, найти «своё место».\n\n**Страхи и барьеры:** у гостя страхов почти нет. Риск для бренда — оставить негатив без ответа.\n\n**Эмоции:** удовлетворение и гордость за находку, +1.\n\n**Проблемы:** отзывы пишут в основном на сильных эмоциях. Без просьбы позитив не доходит до карт.\n\n**Возможности:**\n- Репостить отметки гостей.\n- Отвечать на каждый отзыв в течение 24 часов.\n- Просить отзыв через QR.\n- Звать вернуться в будни на кофе и завтраки.","group":"2. Этапы пути: «Подруги на вечер»","order":80,"section":"cjm","status":"Черновик","title":"Этап 8. После визита"},{"id":"cj-20","body":"| Этап | Действия | Точки контакта | Эмоция | Барьер | Возможность |\n|---|---|---|---|---|---|\n| Узнаёт | Видит стикер в лифте, слышит от коллег | Лифты и баннер БЦ «Капитал» и своего БЦ, офис МТС | 0 | «Это же кальянная, днём там нечего делать» | QR на меню ланча прямо в лифте |\n| Изучает | Смотрит меню и цену ланча | Telegram, Instagram, 2ГИС | 0 | Нет цены ланча в открытом доступе | Меню недели с ценой, обновлять по понедельникам |\n| Приходит | Идёт пешком в 12:30–14:00 | Вход, хостес | +1 | Ждать стол в пик | Стол для офисов, предзаказ |\n| Ест или работает | Ждёт блюдо, ест или работает с ноутбуком | Кухня, Wi‑Fi, розетки, дневной кальян | +1 / −2 | Долго несут, дымно, нет розетки | Отдаём за 15 минут, розетки у стен, дневной кальян |\n| Уходит | Платит за 2 минуты | Терминал, QR | 0 | Ждать счёт | Оплата по QR со стола |\n| Возвращается | Ходит регулярно, приводит коллег | Telegram, предзаказ | +1 | Скучное меню | Меню недели, позже приложение с предзаказом (через 2–4 месяца) |\n\n⚠️ Спросить владельца: будет ли днём зона без дыма и цена дневного кальяна.","group":"3. Другие пути","order":10,"section":"cjm","status":"Черновик","title":"Дневной путь: сотрудник офиса и гость с ноутбуком"},{"id":"cj-21","body":"| Этап | Действия | Точки контакта | Эмоция | Барьер | Возможность |\n|---|---|---|---|---|---|\n| Ищет | За 1–3 недели сравнивает 3–4 места | Instagram, 2ГИС, советы друзей | 0 | Непонятно, поместятся ли все | Хайлайт «День рождения»: фото столов на 6, 8 и 10 человек |\n| Договаривается | Звонит или пишет, уточняет стол и депозит | Директ, телефон | +1 / −1 | Расплывчатые условия | Понятный пакет: стол, сет, подарок имениннику |\n| Встречает гостей | Приходит раньше, проверяет стол | Хостес, официант | −1 → +1 | Стол меньше обещанного | Стол готов к приходу, табличка с именем |\n| Празднует | Еда, кальяны, тост, фото | Кухня, мастер, фото-точка | +2 / −2 | Невкусно, нельзя пересесть | Проверенный сет, гибкая посадка |\n| Расчёт | Делит счёт на компанию | Официант, QR | 0 | Долго и путано | Раздельный счёт по гостям |\n| После | Фото в сторис, отзыв | Instagram, 2ГИС | +1 | Негатив при сбое | Звонок или сообщение на следующий день, отметить и репостнуть |","group":"3. Другие пути","order":20,"section":"cjm","status":"Черновик","title":"Путь именинника-организатора"},{"id":"cj-30","body":"1. **Этап 2, изучение.** У нового места нет отзывов и цен. До открытия 10.12 нужны хайлайт «Меню и цены», фото при свете и заполненная карточка 2ГИС.\n2. **Этап 4, вход.** Офисное здание, вход неочевиден, парковки нет. Нужны точка входа на карте, фото входа и лапки до двери.\n3. **Этап 6, вечер.** Здесь копится весь негатив конкурентов: угли, горечь, шум, темнота. Нужен стандарт сервиса, и его надо показывать гостям.\n4. **Этап 3, бронь.** Скорость ответа решает выбор, особенно для именинников. Ответ в директ за 15 минут.\n5. **Этап 8, после визита.** Довольные гости молчат. Нужны QR на отзыв и ответ на каждый отзыв за 24 часа.","group":"4. Выводы","info":true,"order":10,"section":"cjm","title":"Где мы рискуем потерять гостя: пять точек"},{"id":"cp-01","author":"Алёна","comment":"Размазанные фото, 6 кадров","date":"2026-11-10","designer":"Алёна","effect":"","format":"Пост-карусель","order":10,"owner":"Алёна","promo":"план. охват 3 000 · факт. охват 3 000 · стоимость 0 ₽ · CPM 0 ₽ · приход 2 подписчика","section":"plan","status":"Опубликован","title":"Интерьер"},{"id":"cp-02","author":"Женя","comment":"Серия из четырёх коротких интригующих ИИ-роликов: леопард появляется в Рязани, постепенно приближается к своему новому месту и в финале находит Māори. Сначала публикуем в пробном режиме Instagram на 24 часа; залетевшие ролики переносим в профиль.\nРолик 1: леопард идёт по улицам Рязани — лапы, силуэт или движение издалека. Текст: «Рязань, кажется, у нас появился новый житель». Подпись: «Вы тоже его заметили?»","date":"2026-11-16","designer":"Максим","effect":"Охваты холодной аудитории, узнаваемость названия Māори, первые переходы в профиль, интрига","format":"Reels","order":20,"owner":"Максим","promo":"Instagram: пробный режим рилс на 24 часа, залетевшие — в профиль · в таблице: план 5 000 · факт 1 000 · 30 000 ₽ · CPM 30 000 ₽ · приход 1 · подписчик 30 ₽","section":"plan","status":"В работе","title":"PR: Леопард гуляет по городу — 1 серия «Он уже в городе»"},{"id":"cp-03","author":"Алёна","comment":"Мини-рилс в основной профиль: детали, стены, фактуры и цвета. Женская рука в шубе, массивные серебряные украшения, леопардовый маникюр; рука стучит по стенам — звуки, немного дыма. Сам кальян в кадр не ставим: он режет охват. Без коллаба с блогером.","date":"2026-11-16","designer":"Алёна","effect":"Новые посты в профиле для тех, кто придёт с пробных рилсов: подробнее раскрыть место","format":"Reels","order":30,"owner":"Алёна","promo":"","section":"plan","status":"В работе","title":"Леопардовая рука и детали заведения"},{"id":"cp-04","author":"Женя","comment":"Крупный план лапы: леопард царапает поверхность, появляется принт или след. Текст: «Он явно что-то ищет…». Подпись: «Кажется, он здесь не просто так».","date":"2026-11-17","designer":"Максим","effect":"Удержание интереса продолжением сюжета, комментарии с догадками","format":"Reels","order":40,"owner":"Максим","promo":"Instagram: пробный режим 24 часа · план. охват 4 000 · стоимость 500 ₽","section":"plan","status":"В работе","title":"PR: Леопард гуляет по городу — 2 серия «Он оставляет следы»"},{"id":"cp-05","author":"Алёна","comment":"","date":"2026-11-17","designer":"","effect":"","format":"Сторис","order":50,"owner":"Алёна","promo":"","section":"plan","status":"","title":"Сторис «До открытия … дней»: что произошло сегодня на стройке"},{"id":"cp-06","author":"Женя","comment":"Леопард идёт по красивой узнаваемой улице Рязани, камера со спины: хвост, силуэт, движение. Текст: «До встречи осталось совсем немного». Подпись: «Рязань, вы готовы?»","date":"2026-11-18","designer":"Максим","effect":"","format":"Reels","order":60,"owner":"Максим","promo":"Instagram: пробный режим 24 часа · план. охват 5 000 · стоимость 500 ₽","section":"plan","status":"В работе","title":"PR: Леопард гуляет по городу — 3 серия «Он приближается»"},{"id":"cp-07","author":"Женя","comment":"Леопард подходит к заведению, впервые видна вывеска Māори. Заходит внутрь, садится на место настоящего леопарда и застывает скульптурой. Финал: LOUNGE MAORI. Скоро открытие.","date":"2026-11-19","designer":"Максим","effect":"Связать образ леопарда с Māори, закрепить «скоро открытие»","format":"Reels","order":70,"owner":"Максим","promo":"Instagram: в профиль + пробный · план. охват 7 500 · стоимость 500 ₽","section":"plan","status":"В работе","title":"PR: Леопард гуляет по городу — 4 серия «Он выбрал своё место»"},{"id":"cp-08","author":"Алёна","comment":"","date":"2026-11-19","designer":"","effect":"","format":"Сторис","order":80,"owner":"Алёна","promo":"","section":"plan","status":"","title":"Сторис «До открытия … дней»: что произошло сегодня на стройке"},{"id":"cp-09","author":"Алёна","comment":"Коллаб «Воздушный слон» + SkyRoom. Ведущая в леопардовом образе SkyRoom идёт по центру с шарами и спрашивает: «Как думаете, что скоро откроется в Рязани под названием Māори?» — каждому шарик, в финале сама раскрывает ответ. Вариант: спрашивать, что знают о леопардах, за факт — шарик, по ходу рассказать про открытие. Ведущая — похожая на леопарда (статная, вальяжная); кандидат — Настя Новицкая, согласовать с владельцем.","date":"2026-11-23","designer":"Алёна","effect":"Охваты, вовлечение, узнаваемость, аудитория партнёров, органические репосты участников","format":"Reels","order":90,"owner":"Лиза","promo":"Рилс-опрос на Почтовой + блогер + SkyRoom + «Воздушный слон» · план. охват 22 000 · стоимость 5 000 ₽","section":"plan","status":"В работе","title":"PR: Опрос на улице — раздаём шарики и спрашиваем, что такое Māори"},{"id":"cp-10","author":"Алёна","comment":"","date":"2026-11-24","designer":"","effect":"","format":"Сторис","order":100,"owner":"Алёна","promo":"","section":"plan","status":"","title":"Сторис «До открытия … дней»: что произошло сегодня на стройке"},{"id":"cp-11","author":"Женя","comment":"Продолжение мини-сериала, уже не ИИ: кадры реальные, озвучка ИИ для киношного эффекта. Сцена 1 — лифт в БЦ «Зарядский», офисный сотрудник по телефону: «Весь город обсуждает леопарда» — «А я знаю, где его видели». Сцена 2 — подружки: «Мы его тоже на Почтовой видели!» Сцена 3 — компания друзей: «И куда он пошёл?» — «В Māори». \n**Концовка (рекомендуем):** «И куда он пошёл?» — камера разворачивается к двери Māори: на стекле свежий след, за стеклом в полумраке блестят глаза леопарда (ИИ-вставка). Титр: «Он выбрал своё место. Māори. Скоро». Связывает ролик с 4-й серией и конкурсом «Собери след».\n**Запасной вариант:** офисный сотрудник из первой сцены доходит до закрытой двери Māори, говорит в трубку «Нашёл», слышен низкий рык, табличка «Скоро».","date":"2026-11-25","designer":"Алёна","effect":"Три сегмента ЦА узнают себя (офис, подруги, друзья); интрига и мотивация делиться","format":"Reels","order":110,"owner":"Лиза","promo":"","section":"plan","status":"Идея","title":"Весь город обсуждает леопарда"},{"id":"cp-12","author":"Женя","comment":"Главные преимущества проекта по CJM: интригу держали, теперь подробнее раскрываем, что будет в лаунже (стабильная кухня, кальян, сервис, зал).","date":"2026-11-27","designer":"Максим","effect":"Целостное представление о заведении, снять вопросы о формате, подготовить к броням","format":"Пост-карусель","order":120,"owner":"Алёна","promo":"","section":"plan","status":"Идея","title":"Что такое Māори?"},{"id":"cp-13","author":"Алёна","comment":"","date":"2026-11-27","designer":"","effect":"","format":"Сторис","order":130,"owner":"Алёна","promo":"","section":"plan","status":"","title":"Сторис «До открытия … дней»: что произошло сегодня на стройке"},{"id":"cp-14","author":"Женя","comment":"Формат: «Скоро в Рязани откроется новое место»; соавторство.","date":"2026-11-30","designer":"Максим","effect":"Охват аудитории Twiglles, узнаваемость, переходы, сохранения, запросы на бронь","format":"Пост-карусель","order":140,"owner":"Лиза","promo":"Пост в Twiglles в соавторстве · план. охват 25 000 (в таблице с «₽»)","section":"plan","status":"Идея","title":"PR: Пост совместно с Twiglles"},{"id":"cp-15","author":"Женя","comment":"Говорящая голова: мужчина в шубе идёт и говорит по телефону, снимаем как будто подслушиваем: «Да. Четыре, по пять тысяч каждому». Замечает камеру: «Раз вы уже всё услышали — рассказываю официально». В кадре появляется леопард: «Ты тоже слушал? Ладно, оставайся. Объявляем вместе». Māори разыгрывает 4 сертификата по 5 000 ₽: подписка + репост видео в сторис. Ведущий — Валера Епифанов, согласовать с владельцем.","date":"2026-12-01","designer":"Алёна","effect":"Прирост подписчиков, охват, узнаваемость, вовлечённость, переходы в профиль","format":"Reels","order":150,"owner":"Лиза","promo":"Instagram + репосты участников + сторис Twiglles + ведущий · план. охват 50 000 · стоимость 20 000 ₽","section":"plan","status":"Идея","title":"PR: Конкурс на депозит к открытию"},{"id":"cp-16","author":"Женя","comment":"Первое касание к открытию. Девушка за столом: кальян, коктейль, блюдо; напротив — леопард. Он подходит, кладёт голову ей на колени, она его гладит («приручила»). Эстетика ощущений гостя. Слоган: «Хищник выбрал своё место. Теперь ваша очередь». Запасной: «Приручите своего зверя. Māори, 10 декабря».","date":"2026-12-03","designer":"Алёна","effect":"Объявляем открытие и бронь столов на 10.12; прогноз — 50% столов занято после прогрева","format":"Reels","order":160,"owner":"Лиза","promo":"Рассылка приглашений блогерам, сторис блогеров — добавить ссылки · план. охват 40 000 · стоимость 5 000 ₽","section":"plan","status":"Идея","title":"Приглашение на открытие: бронь открыта"},{"id":"cp-17","author":"Женя","comment":"Вместо объявлений о розыске. Следы клеим у партнёров (например, SkyRoom, Тай спа, «Малина»). Ведущая клеит след на стекло: «Наш Лео оставил следы по городу. Найди 5 следов и получи депозит на кальян». Следы выглядят хищно, не мило. 3 депозита — 3 первых победителя (уточнить у владельца). Партнёры репостят рилс.","date":"2026-12-04","designer":"Алёна","effect":"Вовлечение, охваты и обсуждение через офлайн-активность, заявки на бронь","format":"Reels","order":170,"owner":"Лиза","promo":"Instagram + дубль в сторис Twiglles (Instagram, TG, VK) · план. охват 13 000","section":"plan","status":"Идея","title":"PR: Конкурс «Собери след»"},{"id":"cp-18","author":"Алёна","comment":"","date":"2026-12-04","designer":"","effect":"","format":"Сторис","order":180,"owner":"Алёна","promo":"","section":"plan","status":"Запланирован","title":"Сторис: подсказка к месту следа"},{"id":"cp-19","author":"Алёна","comment":"","date":"2026-12-05","designer":"","effect":"","format":"Сторис","order":190,"owner":"Алёна","promo":"","section":"plan","status":"Запланирован","title":"Сторис: подсказка к месту следа"},{"id":"cp-20","author":"Алёна","comment":"","date":"2026-12-06","designer":"","effect":"","format":"Сторис","order":200,"owner":"Алёна","promo":"","section":"plan","status":"Запланирован","title":"Сторис: подсказка к месту следа"},{"id":"cp-21","author":"Алёна","comment":"","date":"2026-12-07","designer":"","effect":"","format":"Сторис","order":210,"owner":"Алёна","promo":"","section":"plan","status":"Запланирован","title":"Сторис: подсказка к месту следа"},{"id":"cp-22","author":"Алёна","comment":"","date":"2026-12-08","designer":"","effect":"","format":"Сторис","order":220,"owner":"Алёна","promo":"","section":"plan","status":"Запланирован","title":"Сторис: подсказка к месту следа"},{"id":"cp-23","author":"Алёна","comment":"","date":"2026-12-09","designer":"","effect":"","format":"Сторис","order":230,"owner":"Алёна","promo":"","section":"plan","status":"Запланирован","title":"Сторис: подсказка к месту следа"},{"id":"cp-24","author":"Женя","comment":"Второе касание. Информационный пост-обложка: дата, адрес, формат вечера, дресс-код, как забронировать стол.","date":"2026-12-07","designer":"Алёна","effect":"Донести информацию, вызвать интерес к первому вечеру, переходы, сохранения, брони","format":"Пост","order":240,"owner":"Лиза","promo":"","section":"plan","status":"Идея","title":"Открытие: официальный анонс"},{"id":"cp-25","author":"","comment":"Команда на открытии; лайв-фото и сторис в Māори и в Twiglles.","date":"2026-12-10","designer":"","effect":"","format":"","order":250,"owner":"Алёна","promo":"Лайв в Twiglles с открытия · план. охват 5 000","section":"plan","status":"Запланирован","title":"Официальное открытие"},{"id":"cp-26","author":"Алёна","comment":"","date":"2026-12-10","designer":"","effect":"","format":"Сторис","order":260,"owner":"Алёна","promo":"","section":"plan","status":"Запланирован","title":"Сторис: лайв с открытия"},{"id":"ct-01","body":"Первые кадры леопардового принта в городе без объяснений. Подпись-вопрос: «Вы тоже это заметили?»","channel":"Instagram · Reels","date":"2026-11-07","order":10,"section":"content","status":"Идея","title":"«В Рязани что-то происходит»"},{"id":"ct-02","body":"Крупные планы фактур интерьера, по которым нельзя угадать зал целиком. Интрига «соберите пазл».","channel":"Instagram · карусель","date":"2026-11-08","order":20,"section":"content","status":"Ушло клиенту","title":"Макротекстуры: принт, лист, вода"},{"id":"ct-03","body":"3–4 варианта имени маскота, у каждого свой смысл. Итог объявляем в день открытия.","channel":"Stories · опрос","date":"2026-11-10","order":30,"section":"content","status":"Идея","title":"Как зовут леопарда? Голосование"},{"id":"ct-04","body":"Перенесли из ноябрьского плана: до открытия посты уже расписаны в контент-плане. Хороший пост на первую неделю после открытия: «māori = обычный человек», манифест нормальности.","channel":"Instagram · пост","date":"2026-11-11","order":40,"section":"content","status":"Идея","title":"Что значит Māори"},{"id":"ct-05","body":"ASMR: пузырьки аквариума, шелест листьев, лёд в шейкере. Только звук и детали, интерьер не показываем.","channel":"Reels","date":"2026-11-13","order":50,"section":"content","status":"Идея","title":"Звук острова"},{"id":"ct-06","body":"Собираем отметки подписчиков, которые нашли принт в городе. Подсказка: все следы ведут к одному адресу.","channel":"Reels · репосты","date":"2026-11-15","order":60,"section":"content","status":"Идея","title":"Карта леопардовых следов"},{"id":"ct-07","body":"Леопардовые детали формы крупным планом, без лиц. Персонал готовится.","channel":"Stories","date":"2026-11-17","order":70,"section":"content","status":"Идея","title":"Униформа в деталях"},{"id":"ct-08","body":"«Если вы замечали леопарда в городе — это мы». Дата, адрес и то, что ждёт на открытии.","channel":"Пост + Stories","date":"2026-11-19","order":80,"section":"content","status":"Ушло клиенту","title":"Раскрытие: открытие 10 декабря"},{"id":"ct-09","body":"Каждый день сторис с таймером до открытия.","channel":"Stories","date":"2026-11-20","order":90,"section":"content","status":"Ушло клиенту","title":"Обратный отсчёт: 3, 2, 1"},{"id":"ct-10","body":"Первый показ зала целиком, леопард в центре, имя маскота.","channel":"Reels · эфир","date":"2026-11-22","order":100,"section":"content","status":"Ушло клиенту","title":"День открытия"},{"id":"ct-11","body":"Владелец (11.11): аквариум улучшают по свету, рыбкам и декору и делают на нём сильный акцент для фото; героем контента — можно и нужно. Идеи: тизер «что-то живёт в Māори», леопард и рыбы в одном кадре, фото-точка у аквариума.\n\nСвязанная идея — леопардовые рыбки и часы кормления (раздел «Идеи Леопардового бума»).","channel":"Reels / фото","order":110,"section":"content","status":"Идея","title":"Аквариум 6 м — герой контента"},{"id":"ct-pkg-01","body":"Дублирование постов в VK и Telegram в тариф не входит (это «Стандарт» за 127 000 ₽ и «Премиум» за 144 000 ₽).","group":"Тариф «Эконом» · 110 000 ₽/мес","order":10,"section":"contract","title":"Соцсеть: только Instagram"},{"id":"ct-pkg-02","body":"Креативная стратегия, упаковка соцсети, контент-план на месяц, единый стиль SMM-коммуникации. Структура стратегии — в разделе «Стратегия по КП».","group":"Тариф «Эконом» · 110 000 ₽/мес","order":20,"section":"contract","title":"Стратегия и упаковка профиля"},{"id":"ct-pkg-03","body":"По КП посты выходят через день, кроме выходных; сторис — по вторникам и четвергам (≈8–9 в месяц). Форматы: карусели, рилсы, креативные и сюжетные фото и видео. Под постами ведём комментарии и работаем с негативом.","group":"Тариф «Эконом» · 110 000 ₽/мес","order":30,"section":"contract","title":"10 постов в месяц + сторис 2 раза в неделю"},{"id":"ct-pkg-04","body":"Мудборд, обработка, даты и места, сюжеты, реквизит, модели, модерация съёмки. На выходе — пакет фото и видео для рилсов, сторис и интеграций. Дополнительная съёмка — 2 500 ₽/час.","group":"Тариф «Эконом» · 110 000 ₽/мес","order":40,"section":"contract","title":"3 съёмки в месяц"},{"id":"ct-pkg-05","body":"Анализ ЦА, отбор блогеров и брендов для коллабораций, переговоры с партнёрами, блогерами и СМИ, контроль выходов по медиаплану. Условия: бартер или за отдельную плату — рекламный бюджет отдельно.","group":"Тариф «Эконом» · 110 000 ₽/мес","order":50,"section":"contract","title":"До 5 интеграций у блогеров и PR в месяц"},{"id":"ct-pkg-06","body":"В конце месяца — отчёт «до/после»: показы, реакции, комментарии, репосты, охваты, переходы и клики, прирост и отток подписчиков, упоминания в сторонних сообществах и блогах.","group":"Тариф «Эконом» · 110 000 ₽/мес","order":60,"section":"contract","title":"Аналитика и месячный отчёт"},{"id":"ct-pkg-07","body":"- Фотосъёмка сверх пакета — 2 500 ₽/час\n- Таргет VK (настройка и сопровождение) — 35 000 ₽\n- Контекст в Яндексе — 45 000 ₽\n- Яндекс Карты — 20 000 ₽\nРекламный бюджет во всех случаях отдельно.","group":"Допуслуги","order":70,"section":"contract","title":"Что можно докупить"},{"id":"ct-pkg-08","body":"PR-менеджер, SMM-специалист, копирайтер, дизайнер, рилсмейкер, проектный менеджер, таргетолог/директолог (при необходимости).","group":"Команда по КП","order":80,"section":"contract","title":"Роли, обещанные клиенту"},{"id":"ct-pkg-09","body":"- «Леопардовый бум» по городу — это PR-активности; в пакете до 5 интеграций, остальное — отдельный бюджет или бартер.\n- VK, Telegram, Яндекс Карты в «Эконом» не входят, а таргет в Instagram в РФ не запускаем — платное продвижение возможно только через допуслуги.\n- Ивент открытия в КП не описан — договориться отдельно, что делаем мы.","group":"Риски объёма","order":90,"section":"contract","title":"Где пакет может не совпасть с ожиданиями"},{"id":"ev-01","body":"Под вопросом (11.11): скорее всего, будут доделывать до последнего. Если получится — закрытый вечер накануне для своих: проверяем кухню и сервис, снимаем первый контент.","date":"2026-12-09","order":10,"section":"events","status":"Идея","title":"Soft opening для своих"},{"id":"ev-02","body":"Формат от владельца (11.11):\n- работаем по броням, с вечера;\n- диджей для атмосферы;\n- команда подходит ко всем столам и спрашивает мнение;\n- зовём блогеров и партнёров; гостей прошлых проектов — не меньше половины зала;\n- зал — 70 посадок.\nГранд-опенинг пока не делаем: нет времени, бюджета и команды.\nИдеи на вечер: раскрытие имени маскота, первый показ зала целиком, леопардовый дресс-код, фирменный коктейль.\n\n**Созвон команды 12.11:** команда идёт на открытие: лайв-фото и сторис в Māори и в Twiglles. 3.12 — рассылка приглашений блогерам, 7.12 — официальный анонс.","date":"2026-12-10","order":20,"section":"events","status":"Подтверждено","title":"Открытие Māори"},{"id":"ev-03","body":"Конец июня или начало июля. Летний ивент про звёзды, навигацию и новое начало. Подробнее — в базе знаний.","order":30,"section":"events","status":"Идея","title":"Матарики — новый год маори"},{"id":"gp-00","body":"**Задача:** найти потребности гостей, которые конкуренты в Рязани не закрывают или закрывают плохо, и понять, на чём Māори строит отстройку.\n\n**Основа:**\n- JTBD-сегменты (раздел «JTBD-сегменты»).\n- Отзывы гостей шести кальянных в 2ГИС.\n- Выдача 2ГИС по 39 кальянным и бизнес-ланчам.\n- Ответы владельца на созвоне 06.11.\n\n**Правила:**\n- Каждый GAP подтверждён отзывами, иначе помечен как гипотеза.\n- Отсутствие информации у конкурента не значит, что у него этого нет.\n- Где нужно решение владельца, стоит ⚠️.\n\n**Типы GAP:**\n- Продуктовый: функция или сервис отсутствует либо слабый.\n- Позиционирования: преимущество есть, но не раскрыто.\n- Покупательского опыта: сложно выбрать, забронировать, дойти, оплатить.\n\nВсе кальянные Рязани: https://2gis.ru/ryazan/search/кальянная","group":"1. Источники и конкуренты","info":true,"order":10,"section":"gap","title":"Об анализе"},{"id":"gp-01","body":"По словам владельца (11.11), основные конкуренты — **Гозе, Мирра, Хука, Подбелка, Эмбер**. Вальхалла, Smoke Elements, Фил Фри и подобные — «параллельная вселенная» по дизайну, сервису и локации, их убираем из сравнения.\n\n| Заведение | Адрес | 2ГИС | Что знаем | Что собрать |\n|---|---|---|---|---|\n| Гозе | ТК «Городские ряды», Краснорядская, 2 | 4,9 · 200 | Дизайн и брендинг в деталях, вид на улицу Ленина, кухня от «Пламя и вино», бизнес-кальян. Жалобы: обязательно два кальяна, маленькие столы, слабая паста, громкая музыка | Цены, соцсети, акции |\n| Подбелка (Podbelka Lounge) | Почтовая, 54 к2 | 4,8 · 47 | На Почтовой — зона нашего «бума» | Отзывы, цены, соцсети |\n| Мирра | — | — | — | Адрес, отзывы, цены, соцсети |\n| Хука | — | — | — | Адрес, отзывы, цены, соцсети |\n| Эмбер | — | — | — | Адрес, отзывы, цены, соцсети |\n\nОтзывы Гозе: https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews","group":"1. Источники и конкуренты","info":true,"order":20,"section":"gap","title":"Конкуренты: кто рядом и за что их любят и ругают"},{"id":"gp-10","body":"Десять разрывов, от самых обоснованных к гипотезам. Ссылки на отзывы — в карточках ниже.\n\n| GAP | Потребность ЦА | Доказательства | Что дают конкуренты | Где разрыв | Наша возможность | Уверенность |\n|---|---|---|---|---|---|---|\n| Светло и слышно друг друга | Подругам и парам важно наговориться и сделать фото. | Гозе: «музыка играет громко», «было слишком темно». Вальхалла: «не хватает освещения» | Лаунжи в Рязани — тёмные залы с громкой музыкой. Это норма жанра. | Нет места, где светло и тихо, но при этом есть кальян. | Светлый интерьер уже есть (владелец: «светлое помещение вместо подвала»). Добавить стандарт громкости и показывать зал при свете. | Высокая |\n| Курить не обязательно | Некурящий в компании не хочет быть лишним и платить за ненужный кальян. | Барбарис: некурящих гостий попросили уйти. Гозе: обязательный заказ двух кальянов | Обязательный кальян или минимальный заказ, мягкий или жёсткий. | Ни один лаунж не говорит прямо: «рады и тем, кто не курит». | Māори — ресторан и лаунж, у него полная кухня и завтраки весь день. Можно открыто обещать: «курить не обязательно». | Высокая ⚠️ нужно решение владельца о минимальном заказе |\n| Кухня, а не добавка к кальяну | Имениннику, паре и офису нужна нормальная еда. Подругам — вкусные напитки и десерты. | Гозе: две жалобы на пасту на днях рождения. Один гость пишет, что поесть можно не во многих кальянных | В большинстве кальянных — чай и снеки. Гозе возит кухню из ресторана-партнёра. | Нет места, где кальяну и кухне одинаково доверяют. | Кухня — вторая сильная сторона, её кури
