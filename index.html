лать","title":"Открытие Māори"},{"id":"task-20","date":"2026-11-06","order":200,"owner":"Максим","section":"tasks","status":"Готово","title":"Внести итоги созвона 6.11 в пульт"},{"id":"task-21","body":"Просьба клиента на созвоне.","date":"2026-11-08","order":210,"owner":"Лиза","section":"tasks","status":"Сделать","title":"Разделить идеи бума на «до» и «после» открытия и расставить приоритеты"},{"id":"task-22","body":"Готовое — клиенту на согласование.\n\nОтменено на созвоне 12.11: вместо объявлений — конкурс «Собери след».","date":"2026-11-09","order":220,"owner":"Лиза","section":"tasks","status":"Готово","title":"Макет и тексты «Разыскивается леопард» (цветные)"},{"id":"task-23","body":"Без даты открытия. Проверить смываемую краску / обратное граффити и правила благоустройства Рязани.","date":"2026-11-10","order":230,"owner":"Лиза","section":"tasks","status":"Сделать","title":"Трафарет лапки с логотипом + где легально наносить"},{"id":"task-24","body":"Сценарии — в контент-плане (Женя). Ролики по 5 секунд. Публикуем в пробном режиме Instagram на 24 часа; если охваты хорошие — дублируем в профиль, если нет — продолжаем пробными. 4-я серия — сразу в профиль + пробный. Эта неделя даёт запас времени на съёмки следующей.","date":"2026-11-19","order":240,"owner":"Максим","section":"tasks","status":"В работе","title":"ИИ-серия «Леопард гуляет по городу»: 4 ролика (16–19.11)"},{"id":"task-25","body":"6 смазанных кадров + короткие фразы.","date":"2026-11-11","order":250,"owner":"Алёна","section":"tasks","status":"Готово","title":"Съёмка деталей «в движении» и размазанная карусель (пост 12.11)"},{"id":"task-26","body":"**Созвон команды 12.11:** «Воздушный слон» согласен участвовать в опросе 23.11.","date":"2026-11-11","order":260,"owner":"Лиза","section":"tasks","status":"Готово","title":"Договориться с «Воздушным слоном» про леопардовые шары"},{"id":"task-27","date":"2026-11-10","order":270,"owner":"Лиза","section":"tasks","status":"Сделать","title":"Спросить БЦ «Капитал» про лифт и баннер на входе"},{"id":"task-28","body":"90 000 ₽/мес через партнёров. Маркировка и требования к рекламе лаунжа — клиент переживает за юридическую сторону.\n\n**Мнение владельца 11.11:** много адресов не в центре, ролик 5 секунд — запомнят разве что принт и название, не адрес и не промокод. Смотрит на электронные экраны «Ашана» и «Круиза»: там есть 10 и 15 секунд. Ждёт от нас мнение о целесообразности и статистику у подрядчика, если такие кампании уже были. Старт экранов — с 1 декабря, время есть.","date":"2026-11-10","order":280,"owner":"Женя","section":"tasks","status":"Сделать","title":"Адреса 32 экранов и юридический ответ по 18+"},{"id":"task-29","body":"Печать, трафареты, шары, брелоки, генерации видео, призы розыгрыша, экраны. Нужно «да» клиента по сумме.","date":"2026-11-10","order":290,"owner":"Женя","section":"tasks","status":"Сделать","title":"Смета рекламного бюджета для клиента"},{"id":"task-30","body":"Утверждено владельцем 11.11: старт 1 декабря в Instagram, 4 сертификата по 5 000 ₽. Условие — репост любого поста к себе и подписка. Розыгрышу нужны охваты: Twiglles, дополнительная реклама у рязанских медиа или блогеров. Анонс — рилс с говорящей головой 30.11, итоги — до открытия 10.12. Победителей выбираем рандомайзером, репост проверяем вручную.\n\n**Созвон команды 12.11:** анонс рилсом 01.12 с ведущим Валерой Епифановым (согласовать). Разыгрываем только депозиты.","date":"2026-11-28","order":300,"owner":"Алёна","section":"tasks","status":"Сделать","title":"Свой розыгрыш с 1 декабря: механика и честный выбор победителей"},{"id":"task-31","body":"Первые 5–6 постов «Мира» и первые ~20 второго проекта — это то, что ему нравится. Всё «смешное» за последние полгода там — антиреференс.","date":"2026-11-10","order":310,"owner":"Алёна","section":"tasks","status":"Сделать","title":"Разобрать первые посты прошлых проектов владельца как референс"},{"id":"task-32","date":"2026-12-14","order":320,"owner":"Алёна","section":"tasks","status":"Сделать","title":"Обзорная съёмка с моделями после открытия"},{"id":"task-33","body":"Один пульт для команды и клиента. Команде — «Редактор», клиенту — по договорённости.","date":"2026-11-10","order":330,"owner":"Вся команда","section":"tasks","status":"Сделать","title":"Выдать доступы к общему пульту"},{"id":"task-40","body":"Псевдодокументальный детектив с юмором: ведущий «расследует» странные объявления о пропаже леопарда. Объявления и лапки должны висеть в городе до съёмки (task-22, task-23). По контент-плану: ответственный Лиза, автор Женя, монтаж Алёна.\n\nОтменено на созвоне 12.11: 23.11 вместо «Розыска» — рилс-опрос на улице; объявления заменили конкурсом «Собери след».","date":"2026-11-21","order":400,"owner":"Алёна, Лиза","section":"tasks","status":"Готово","title":"Рилс «Розыск леопарда»: сценарий, ведущий, съёмка (пост 23.11)"},{"id":"task-41","body":"Сценарий — в контент-плане 01.12. Ведущий — Валера Епифанов (эпатажный, с аудиторией) — согласовать с владельцем. Разыгрываем только депозиты, без партнёров.","date":"2026-11-29","link":"https://www.instagram.com/reel/DcdGAjiMO3u/","order":410,"owner":"Лиза","section":"tasks","status":"Сделать","title":"Рилс «Конкурс на депозит» с ведущим (01.12)"},{"id":"task-42","body":"Владелец согласен (11.11): даёт SkyRoom 3 сертификата по 5 000 ₽. Взамен хочет получить подписки или хотя бы охват онлайн — механику придумываем мы.\nВарианты: совместный пост в соавторстве; условие — подписка на оба аккаунта и покупка в SkyRoom или репост; итоги в сторис обоих брендов.\nПо контент-плану SkyRoom участвует в рилсе-опросе на Почтовой 08.12 (вместе с блогером).\n\n**Созвон команды 12.11:** SkyRoom (Наташа) участвует в рилсе-опросе 23.11 (одежда для ведущей) и просит за это депозит на открытие.","date":"2026-11-14","order":420,"owner":"Лиза","section":"tasks","status":"Сделать","title":"Коллаб со SkyRoom: розыгрыш сертификатов — придумать механику"},{"id":"task-43","body":"Пост с блюдами убрали из плана (12.11), чтобы не тратить слот. Когда будет меню и фото — собираем хайлайт «Блюда».","date":"2026-12-05","order":430,"owner":"Алёна","section":"tasks","status":"Сделать","title":"Хайлайт «Блюда» вместо поста"},{"id":"task-44","body":"Девушка за столом в углу заведения, леопард кладёт ей голову на колени. Совмещаем ИИ и реальную съёмку; нужен угол в зале, стол, красивая стена. Слоган подбирает Женя. Дату, время и программу открытия подтверждает владелец.","date":"2026-12-01","order":440,"owner":"Максим","section":"tasks","status":"Сделать","title":"Рилс-приглашение «Бронь открыта» (03.12)"},{"id":"task-45","body":"Правило: каждая публикация говорит, что открытие совсем скоро — в видео/посте или в тексте. До подтверждения даты пишем «совсем скоро», за две недели до открытия (с 26.11) — точный отсчёт. Готовые тексты — клиенту на согласование.","date":"2026-11-10","order":450,"owner":"Алёна","section":"tasks","status":"В работе","title":"Тексты под все 8 постов: в каждом — прогрев к открытию"},{"id":"task-46","body":"Māори — «обычный человек», нормальность в хорошем смысле. Без игры в племя. Автор — Женя, дизайн — Максим.\n\n**Созвон команды 12.11:** пост перенесён на 27.11.","date":"2026-11-25","order":460,"owner":"Алёна","section":"tasks","status":"Сделать","title":"Карусель «Что такое Māори?» по CJM (пост 27.11)"},{"id":"task-47","body":"70 посадок, включая барную стойку (ответ 11.11). В метриках обновили.","date":"2026-11-11","order":470,"owner":"Максим","section":"tasks","status":"Готово","title":"Узнать у клиента число посадочных мест"},{"id":"task-48","body":"Сравнить 32 экрана (5 с, много адресов не в центре) с экранами «Ашана» и «Круиза» (10–15 с). Запросить у подрядчика статистику прошлых кампаний. Предложить ролик «леопард выпрыгивает из экрана» с адресом и промокодом для подсчёта лидов. Старт — с 1 декабря.","date":"2026-11-14","order":480,"owner":"Женя","section":"tasks","status":"Сделать","title":"Мнение по билбордам и экранам + статистика подрядчика"},{"id":"task-49","body":"Владелец просит (11.11): TG нужен, туда гоним трафик во время конкурсов. Успеть до розыгрыша 1 декабря: оформление, первые посты, ссылка на электронное меню.","date":"2026-11-25","order":490,"owner":"Алёна","section":"tasks","status":"Сделать","title":"Создать Telegram-канал Māори"},{"id":"task-50","body":"Владелец просит дать розыгрышу охваты: пост в Twiglles, дополнительная реклама у рязанских медиа или блогеров. Подобрать площадки и стоимость.","date":"2026-11-28","order":500,"owner":"Лиза","section":"tasks","status":"Сделать","title":"Охваты для розыгрыша 1 декабря: Twiglles, медиа, блогеры"},{"id":"task-51","body":"Бронь и выбор зоны идут через хостес, поэтому вид посадки (VIP, полу-VIP, бар, аквариум, леопард) показываем в хайлайтах. В шапку — ссылку на электронное меню. Нужна планировка от владельца.","date":"2026-12-05","order":510,"owner":"Алёна","section":"tasks","status":"Сделать","title":"Хайлайты «Посадка и зоны» и «Меню» в Instagram"},{"id":"task-52","body":"Сделано 12.11: наша версия — «Аромат-карта Māори» (раздел «Идеи Леопардового бума» → «Ароматы и миксы в баночках»). Осталось показать владельцу.","date":"2026-11-18","order":520,"owner":"Максим","section":"tasks","status":"Готово","title":"Подробно расписать идею с ароматами в баночках"},{"id":"task-53","body":"Пн, 16.11. Нужны: леопардовое пальто или шуба, массивные серебряные кольца (можно с камнем), леопардовый маникюр, свет. Детали: зелень, фактуры, аквариум. Кальян в кадр не ставим.","date":"2026-11-16","order":530,"owner":"Алёна","section":"tasks","status":"Сделать","title":"Съёмка «Леопардовая рука и детали заведения»"},{"id":"task-54","body":"Опрос 23.11 — нужна ведущая, похожая на леопарда (статная, вальяжная, не «милая»): кандидат Настя Новицкая. Конкурс 01.12 — Валера Епифанов. Всех людей согласовываем с владельцем.","date":"2026-11-17","order":540,"owner":"Лиза","section":"tasks","status":"Сделать","title":"Согласовать с владельцем ведущих"},{"id":"task-55","body":"Сначала запросить у владельца, кого он хочет видеть: он согласует блогеров по своим предпочтениям. Добавить ссылки в контент-план. Нужно добрать от блогеров около 40 тыс. охвата.","date":"2026-11-14","order":550,"owner":"Лиза","section":"tasks","status":"Сделать","title":"Список блогеров от владельца и бюджет рассылки"},{"id":"task-56","body":"Начинаем 3.12, чтобы с 4-го блогеры рассказывали об открытии заранее, а 7.12 репостим. Формат приглашения обсудить с владельцем (бюджет): леопардовый конверт или брендированный мундштук.","date":"2026-12-03","order":560,"owner":"Лиза","section":"tasks","status":"Сделать","title":"Рассылка приглашений блогерам — 3 декабря"},{"id":"task-57","body":"Около 5 мест: SkyRoom, Тай спа, «Малина» и др. Договориться оперативно, согласовать с владельцем число победителей (3) и депозит на кальян.","date":"2026-11-27","order":570,"owner":"Лиза","section":"tasks","status":"Сделать","title":"Партнёры для конкурса «Собери след»"},{"id":"task-58","body":"Сделано 12.11: концовка и запасной вариант — в контент-плане (25.11). Жене — посмотреть и при желании доработать реплики.","date":"2026-11-20","order":580,"owner":"Женя","section":"tasks","status":"Готово","title":"Доработать концовку «Весь город обсуждает леопарда»"},{"id":"task-59","body":"Леопард будто выходит из экрана (перспектива, «проём»), 5 секунд, старт с 1 декабря. Собрать референс и отправить владельцу.","date":"2026-11-17","order":590,"owner":"Максим","section":"tasks","status":"Сделать","title":"Пример объёмного леопарда для 32 экранов — владельцу"},{"id":"task-60","body":"План контента и PR на согласование. Вопросы: брендированный мундштук (где, сколько), леопардовые десерты, леопардовые рыбки и часы кормления, число и номинал депозитов в «Собери след», ведущие.","date":"2026-11-13","order":600,"owner":"Алёна","section":"tasks","status":"Сделать","title":"Отправить владельцу план и вопросы"},{"id":"task-61","body":"Сделано 12.11: слоган «Хищник выбрал своё место. Теперь ваша очередь» + варианты — в брендбуке («Слоганы и короткие фразы») и в контент-плане 03.12.","date":"2026-11-28","order":610,"owner":"Женя","section":"tasks","status":"Готово","title":"Слоган для рилса-приглашения"}],"pages":{"assets":{"intro":"Всё, что нужно получить от клиента, и всё, что делаем сами: логотипы, мудборд, меню, фото, шаблоны."},"audience":{"intro":"Аудиторию не придумываем, а проверяем. Никаких наборов вроде «мужчины и женщины 18–28». Ниже рабочие гипотезы из кик-оффа. Каждую подтверждаем на брифе с владельцем, а затем исследованием: опросами, отзывами о конкурентах, наблюдением. Ответственный — Максим."},"brandbook":{"intro":"Брендбук собирается по мере решений. Статус показывает степень уверенности: «Факт от клиента» — так сказал владелец, «Гипотеза» — наше предложение, «Согласовано» — утверждено."},"brief":{"intro":"Первый стратегический созвон с владельцем — пятница, 6 ноября, ориентировочно 13:00–15:00 по Москве. Точное время подтвердит Женя. Цель — за 60–75 минут собрать всё для стратегии: продукт, аудиторию, рамки продвижения и материалы.\n\n## Как ведём\n- Женя открывает и модерирует, следит за временем.\n- Каждый блок ведёт ответственный: продукт и аудитория — Максим, PR и «Леопардовый бум» — Лиза, контент — Алёна.\n- Каждое предложение показываем с объяснением: что оно значит и что даст бизнесу.\n- Темп быстрый. В конце фиксируем, что клиент присылает и к какому числу.\n\n## Порядок\n- Знакомство и правила работы — 5 мин\n- Продукт и легенда бренда — 15 мин\n- Аудитория — 15 мин\n- Карта «Леопардовый бум» и PR — 15 мин\n- Контент до открытия — 10 мин\n- Открытие — 10 мин\n- Материалы и сроки — 5 мин\n\nВопросы ниже — черновик. Когда Женя пришлёт шаблон стратегии, сверяем и дополняем список. Нажимайте на статус, чтобы отмечать, что уже спросили и на что есть ответ."},"calls":{"intro":"Итоги созвонов. Раздел видят только участники команды с правами редактора."},"cjm":{"intro":"Путь главного сегмента «Подруги на вечер» от первого касания до возвращения, плюс дневной путь и путь именинника. Эмоции по шкале от −2 до +2. Этапы связаны с JTBD-сегментами и GAP-анализом."},"content":{"intro":"Черновики и идеи контента. Готовое переносим в «Контент-план» и ставим здесь «Ушло клиенту». Правила владельца: никаких «смешных» рилсов с персоналом, липсингов и танцев; маскот — почти везде; только качественная нейронка. По тарифу — 10 постов/мес + сторис вт/чт."},"contract":{"intro":"Условия по КП «Издание о Рязани» (редакция Twiglles). Выбран тариф «Эконом» — 110 000 ₽ в месяц. Рекламный бюджет (блогеры, таргет) оплачивается отдельно. Всё, что сверх пакета, — допуслуги."},"events":{"intro":"Открытие и всё, что вокруг него. После открытия здесь появится календарь регулярных вечеринок и поводов."},"gap":{"intro":"Где конкуренты в Рязани не закрывают потребности гостей и что из этого может сделать Māори. Каждый пункт подтверждён отзывами или помечен как гипотеза. ⚠️ — нужно решение владельца."},"jtbd":{"intro":"Сегменты по работе гостя, а не по демографии: КТО приходит и ЗАЧЕМ. Основа — около 100 отзывов о шести кальянных Рязани в 2ГИС, выдача по бизнес-ланчам и ответы владельца на созвоне 06.11. Цитаты взяты из отзывов дословно, «мысли в голове» собраны по их мотивам. Первые гипотезы с кик-оффа — в разделе «Аудитория»."},"knowledge":{"intro":"Подноготная концепции: кто такие маори, что такое Полинезия, почему леопард и как связать всё без ошибок. Читать всей команде до брифа: владелец ценит, когда команда понимает смыслы."},"metrics":{"facts":{},"params":{"capture":12,"hookah":20,"insta":50,"l2v":10,"load":45,"lunchDays":2,"lunchOut":30,"offices":2500,"pop":519300,"r2l":1,"real":50,"seats":70,"share":20,"turns":2,"young":19},"period":""},"overview":{"intro":"Пульт проекта: здесь видно, на каком этапе работа, какие задачи у команды и что нужно от клиента. Главная дата — открытие 10 декабря (перенесли с 22 ноября). До него около месяца, чтобы Рязань заговорила о леопарде."},"plan":{"intro":"Рабочий контент-план Instagram: одна строка — одна публикация. Формат, статус и роли меняются прямо в таблице, тему, комментарий и ссылку — по клику на тему, новую публикацию — кнопкой «+» в пустом дне. Сторис — отдельными строками с форматом «Сторис»."},"pr":{"intro":"Все механики «Леопардового бума» и их судьба. Группы: согласовано клиентом 6.11, оцениваем, отложено, наши гипотезы, классика и подсмотренное в 2025–2026. То, что отправили клиенту на согласование, отмечаем статусом «Ушло клиенту». Клиент просил разделить идеи на «до» и «после» открытия."},"project":{"city":"Рязань","client":"Māори, Рязань","openDate":"2026-12-10","slogan":"Māори — место, где всё будет иначе"},"reviews":{"intro":"Отзывы появятся после открытия. Собираем их с Яндекс Карт, 2ГИС, Instagram, Telegram и VK. Каждый отзыв фиксируем и отвечаем в течение суток. Повторяющиеся замечания переносим в задачи."},"strategy":{"intro":"Стратегия собирается по структуре из КП. Каждый пункт — раздел документа стратегии. Отмечайте статус нажатием на плашку."},"tasks":{"intro":"Всё, что нужно сделать до открытия 10 декабря. Просроченные даты подсвечиваются красным. Статус меняется нажатием на плашку."},"team":{"intro":"Внутренняя кухня: роли, договорённости и заметки о работе с клиентом. Клиент этот раздел не видит."}},"approvals":{}}</script>

function inline(t){
  return t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
          .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function rich(src){
  const lines = esc(src).split(/\r?\n/); let html = "", ul = false, para = [], tbl = [];
  const flush = () => { if (para.length){ html += "<p>"+inline(para.join("<br>"))+"</p>"; para = []; } };
  const cells = r => r.trim().replace(/^\||\|$/g,"").split("|").map(c=>inline(c.trim()));
  const flushT = () => { if(!tbl.length) return; const rows = tbl.filter(r=>!/^\|?[\s:|-]+\|?$/.test(r.trim()));
    const [hd,...bd] = rows; html += `<div class="tbl"><table><thead><tr>${cells(hd).map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${bd.map(r=>`<tr>${cells(r).map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; tbl = []; };
  for (const raw of lines){
    const l = raw.trimEnd();
    if (/^\s*\|/.test(l)){ flush(); if(ul){html+="</ul>";ul=false} tbl.push(l); continue; }
    flushT();
    if (/^\s*[-•]\s+/.test(l)){ flush(); if(!ul){html+="<ul>";ul=true} html += "<li>"+inline(l.replace(/^\s*[-•]\s+/,""))+"</li>"; continue; }
    if (ul){ html+="</ul>"; ul=false; }
    if (/^##\s+/.test(l)){ flush(); html += "<h4>"+inline(l.replace(/^##\s+/,""))+"</h4>"; continue; }
    if (!l.trim()){ flush(); continue; }
    para.push(l);
  }
  flush(); flushT(); if (ul) html += "</ul>"; return html;
}

function drawLeo(){
  const c = $("#leo"), r = c.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio||1);
  c.width = Math.round(r.width*dpr); c.height = Math.round(r.height*dpr);
  const x = c.getContext("2d"); x.scale(dpr,dpr);
  const W=r.width, H=r.height; let seed=7;
  const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,"#D9A146"); g.addColorStop(1,"#B97F22");
  x.fillStyle=g; x.fillRect(0,0,W,H);
  const step=46;
  for(let yy=-20; yy<H+40; yy+=step*0.82){
    for(let xx=-20; xx<W+40; xx+=step){
      const cx=xx+(rnd()-.5)*22+((yy/step|0)%2)*step/2, cy=yy+(rnd()-.5)*18, R=9+rnd()*8;
      x.fillStyle="rgba(140,80,20,.55)"; x.beginPath(); x.ellipse(cx,cy,R*.75,R*.6,rnd()*3,0,7); x.fill();
      x.fillStyle="#1D1610";
      const parts=3+(rnd()*3|0), base=rnd()*6.28;
      for(let p=0;p<parts;p++){
        const a=base+p*(6.28/parts)+(rnd()-.5)*.5, len=.9+rnd()*.7;
        x.beginPath(); x.ellipse(cx+Math.cos(a)*R, cy+Math.sin(a)*R*.85, R*.42*len, R*.22, a+1.57, 0, 7); x.fill();
      }
      if(rnd()<.35){ x.beginPath(); x.arc(xx+step*.5+(rnd()-.5)*10, yy+step*.4, 2+rnd()*3, 0, 7); x.fill(); }
    }
  }
}

  if(!M || !M.dirty) M = {params:{...MDEF, ...(p.params||{})}, facts:{...(p.facts||{})}, period:p.period||"", dirty:false};
  return M;
}
function mSave(){
  if(!canWrite || !dbRef) return;
  clearTimeout(mSaveT);
  mSaveT = setTimeout(async ()=>{
    try{ await dbRef.collection("pages").doc("metrics").set({...(pages.metrics||{}), params:{...M.params}, facts:{...M.facts}, period:M.period, updatedAt:new Date().toISOString()}); M.dirty=false; }
    catch(err){ handleWriteErr(err); }
  }, 700);
}
const num = v => { const x = parseFloat(String(v).replace(",",".")); return isFinite(x) ? x : 0; };
function mcalc(P){
  const cap = P.seats*P.turns*30, used = cap*P.load/100, gI = used*P.share/100;
  const lI = P.l2v>0 ? gI/(P.l2v/100) : 0, rI = P.r2l>0 ? lI/(P.r2l/100) : 0, k = P.real/100;
  return {cap, used, gI, lI, rI, gT:gI*k, lT:lI*k, rT:rI*k};
}
const fmt = n => Math.round(n).toLocaleString("ru-RU");

function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v||1))); const m = v/p; return ([1,1.2,1.5,2,2.5,3,4,5,6,8,10].find(x=>m<=x))*p; }
function seatChart(P){
  const W=640,H=250,ml=58,mr=64,mt=14,mb=34;
  const xs=[30,40,50,60,70,80,90,100]; const lo=Math.min(30,P.seats), hi=Math.max(100,P.seats);
  const pts = xs.map(s=>({s, ...mcalc({...P,seats:s})})); const cur = mcalc(P);
  const ymax = niceMax(Math.max(...pts.map(p=>p.rI), cur.rI)*1.05);
  const X = s => ml + (s-lo)/(hi-lo)*(W-ml-mr), Y = v => mt + (1-v/ymax)*(H-mt-mb);
  let g = "";
  for(let i=0;i<=4;i++){ const v=ymax*i/4, y=Y(v); g += `<line x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${ml-8}" y="${y+4}" text-anchor="end">${i?fmtK(v):0}</text>`; }
  for(const s of xs) g += `<text x="${X(s)}" y="${H-12}" text-anchor="middle">${s}</text>`;
  g += `<text x="${(ml+W-mr)/2}" y="${H}" text-anchor="middle">посадочных мест</text>`;
  const path = key => pts.map((p,i)=>`${i?"L":"M"}${X(p.s).toFixed(1)},${Y(p[key]).toFixed(1)}`).join("");
  g += `<line x1="${X(P.seats)}" x2="${X(P.seats)}" y1="${mt}" y2="${H-mb}" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1"/>`;
  g += `<path d="${path("rI")}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  g += `<path d="${path("rT")}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const last = pts[pts.length-1];
  g += `<text class="dl" x="${X(last.s)+8}" y="${Y(last.rI)+4}">Идеал</text><text class="dl" x="${X(last.s)+8}" y="${Y(last.rT)+4}">Цель</text>`;
  g += `<circle cx="${X(P.seats)}" cy="${Y(cur.rI)}" r="5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/><circle cx="${X(P.seats)}" cy="${Y(cur.rT)}" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>`;
  for(const p of [...pts, {s:P.seats, ...cur}]) g += `<rect x="${X(p.s)-14}" y="${mt}" width="28" height="${H-mt-mb}" fill="transparent" tabindex="0" data-tip="${p.s} мест: цель ${fmtK(p.rT)}, идеал ${fmtK(p.rI)} охвата · ${fmt(p.gT)}–${fmt(p.gI)} гостей из соцсетей"/>`;
  return `<div class="legend"><span><i style="background:var(--s1)"></i>Цель (реалистично)</span><span><i style="background:var(--s2)"></i>Идеал</span><span>пунктир — сейчас ${P.seats} мест</span></div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Нужный охват в месяц в зависимости от числа посадочных мест">${g}</svg>`;
}
function formatChart(T){
  const rows = [["Рилсы, 5 в месяц",0.65,5,"на рилс"],["Карусели и посты, 5",0.15,5,"на пост"],["Коллаборации и розыгрыш",0.15,0,""],["Сторис, 8–9",0.05,9,"на сторис"]];
  const W=380,rowH=46,ml=0,lw=W, H=rows.length*rowH; const max=rows[0][1];
  let g="";
  rows.forEach(([name,sh,n,u],i)=>{ const y=i*rowH, w=Math.max(4,(sh/max)*(lw-150)), v=T*sh;
    g += `<text x="0" y="${y+13}" style="fill:var(--ink)">${esc(name)}</text>
    <path d="M0,${y+20}h${w-4}a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-${w-4}z" fill="var(--s1)"/>
    <text class="dl" x="${w+8}" y="${y+33}">${fmtK(v)}${n?` · ≈${fmtK(v/n)} ${u}`:""}</text>
    <rect x="0" y="${y}" width="${W}" height="${rowH}" fill="transparent" tabindex="0" data-tip="${esc(name)}: ${Math.round(sh*100)}% охвата-цели = ${fmtK(v)}${n?`, в среднем ${fmtK(v/n)} ${u}`:""}"/>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Из чего складывается охват-цель">${g}</svg>`;
}

  </div>
  <section class="panel"><h2>Что важно помнить</h2><ul>
    <li><strong>160 тыс. в месяц — амбициозно</strong> для аккаунта с 2 574 подписчиками (4 ноября). Нужны 1–2 рилса, которые разойдутся на 50 тыс.+, совместные публикации с SkyRoom и «Воздушным слоном» и розыгрыш. В статистике смотрим долю Рязани в аудитории: охват из других городов гостей не приводит.</li>
    <li><strong>Таргета в Instagram нет</strong> (в РФ не запускаем, в пакет не входит). Платный охват — только через допуслуги: VK, Яндекс Карты.</li>
    <li><strong>Гостей из соцсетей надо считать на месте:</strong> хостес спрашивает «откуда узнали», брони из директа отмечаем, в постах даём кодовое слово.</li>
    <li><strong>Цифры конверсий — ориентиры</strong>, а не данные заведения. Через месяц после открытия заменяем их фактом.</li>
  </ul></section>`;
}
$("#view").addEventListener("input", e=>{
  const t = e.target;
  if(t.dataset.m){ const st=mState(); st.params[t.dataset.m] = num(t.value); st.dirty=true; render(); mSave(); }
  else if(t.dataset.fact){ const st=mState(); if(t.value==="") delete st.facts[t.dataset.fact]; else st.facts[t.dataset.fact] = num(t.value); st.dirty=true; render(); mSave(); }
  else if(t.dataset.period){ const st=mState(); st.period=t.value; st.dirty=true; mSave(); }
});
(function(){
  const tip = document.createElement("div"); tip.id="vtip"; tip.hidden=true; document.body.appendChild(tip);
  const show = (el,x,y)=>{ tip.textContent = el.dataset.tip; tip.hidden=false; const w=tip.offsetWidth; tip.style.left = Math.min(innerWidth-w-8, x+14)+"px"; tip.style.top = (y+14)+"px"; };
  document.addEventListener("mousemove", e=>{ const el=e.target.closest?.("[data-tip]"); if(el) show(el,e.clientX,e.clientY); else tip.hidden=true; });
  document.addEventListener("focusin", e=>{ const el=e.target.closest?.("[data-tip]"); if(el){ const r=el.getBoundingClientRect(); show(el,r.left+r.width/2,r.top); } else tip.hidden=true; });
})();

/* ---------- контент-план таблицей ---------- */
const PTONE = {"Алёна":"pa","Максим":"pb","Женя":"pc","Лиза":"pd"};
const WD = ["вс","пн","вт","ср","чт","пт","сб"];
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function cellSel(i, name, opts, toneFn){
  const v = i[name]||"", t = toneFn(v);
  if(!canWrite) return v ? `<span class="chipv ${t}">${esc(v)}</span>` : `<span class="muted">—</span>`;
  return `<select class="chipv ${t}" data-inline="${i.id}" data-field="${name}" aria-label="${esc(FIELD[name])}: ${esc(i.title||"")}"><option value=""></option>${opts.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
}
function renderPlan(sec, list, all){
  const filtered = filter.status!=="all" || !!filter.q.trim();
  const byDay = new Map(); for(const i of list){ const k=i.date||""; if(!byDay.has(k)) byDay.set(k,[]); byDay.get(k).push(i); }
  const dates = all.map(i=>i.date).filter(Boolean).sort();
  const od = pages.project?.openDate || "";
  let start = parseD(sec.from) || parseD(dates[0]) || today();
  if(dates[0] && parseD(dates[0])<start) start = parseD(dates[0]);
  let end = parseD([dates[dates.length-1], od].filter(Boolean).sort().pop()) || start;
  if(end<start) end = new Date(start);
  end.setDate(end.getDate()+2);
  const fTone = v => /reels|рилс/i.test(v)?"fa":/карус/i.test(v)?"fb":/сторис/i.test(v)?"fc":v?"fd":"";
  const sTone = v => "s"+Math.max(0,sec.statuses.indexOf(v||sec.statuses[0]));
  const pTone = v => PTONE[v]||(v?"pd":"");
  const t0 = iso(today()); let rows = "";
  const dateCell = (k,d) => `<td class="pd-date">${d?`<b>${d.getDate()}</b> ${MONTHS[d.getMonth()]}<small>${WD[d.getDay()]}${k===od?" · открытие":""}${k===t0?" · сегодня":""}</small>`:"<b>—</b><small>без даты</small>"}</td>`;
  const rowCls = (k,d) => [k===t0?"today":"", d&&(d.getDay()===0||d.getDay()===6)?"we":"", k===od?"open":""].join(" ");
  const itemRow = (k,d,i) => `<tr class="${rowCls(k,d)}">${dateCell(k,d)}
    <td class="pd-topic">${canWrite?`<button type="button" class="linkish" data-edit="${i.id}">${esc(i.title||"Без темы")}</button>`:esc(i.title||"Без темы")}</td>
    <td>${cellSel(i,"format",sec.opts.format,fTone)}</td>
    <td class="pd-com">${i.comment?inline(esc(i.comment)):""}${i.link?` <a href="${esc(i.link)}" target="_blank" rel="noopener">ссылка ↗</a>`:""}</td>
    <td class="pd-com">${i.effect?esc(i.effect):""}</td>
    <td>${cellSel(i,"status",sec.statuses,sTone)}</td>
    <td>${cellSel(i,"owner",sec.opts.owner,pTone)}</td>
    <td>${cellSel(i,"author",sec.opts.author,pTone)}</td>
    <td>${cellSel(i,"designer",sec.opts.designer,pTone)}</td>
    <td class="pd-com">${i.promo?esc(i.promo):""}</td></tr>`;
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const k = iso(d), day = new Date(d), its = byDay.get(k)||[];
    if(its.length) rows += its.map(i=>itemRow(k,day,i)).join("");
    else if(!filtered) rows += `<tr class="${rowCls(k,day)} emptyday">${dateCell(k,day)}<td class="pd-topic"><span class="muted">—</span>${canWrite?` <button type="button" class="btn ghost sm" data-addday="${k}" aria-label="Добавить публикацию на ${day.getDate()} ${MONTHS[day.getMonth()]}">+</button>`:""}</td><td colspan="8"></td></tr>`;
  }
  for(const [k,its] of byDay){ const d=parseD(k); if(!d || d<start || d>end) rows += its.map(i=>itemRow(k,d,i)).join(""); }
  if(!rows) return empty("Ничего не найдено","Сбросьте фильтр или измените запрос.");
  return `<div class="tbl plan"><table><thead><tr><th>Дата</th><th>Тема</th><th>Формат</th><th>Комментарий</th><th>Ожидаемый эффект</th><th>Статус</th><th>Ответственный</th><th>Автор</th><th>Дизайнер / монтажёр</th><th>Реклама и продвижение</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function render(){
  renderNav(); renderTop();
  const sec = BY[route];
  let html = STATIC ? `<div class="banner">Данные обновлены ${esc(snapDate())}.</div>` : noDb ? (SNAP ? `<div class="banner">Данные на ${esc(snapDate())}. Чтобы видеть изменения сразу и редактировать, откройте пульт под своей учётной записью claude.ai.</div>`
                          : `<div class="banner">Данные проекта не загрузились в этом окне. Откройте пульт под своей учётной записью claude.ai.</div>`) : "";
  if(stale && loaded) html += `<div class="banner">Связь с хранилищем прервалась, данные могут быть устаревшими.</div>`;
  html += route==="overview" ? renderOverview() : renderSection(sec);
  const ae = document.activeElement, fid = ae && ae.id && $("#view").contains(ae) && ae.id!=="q" ? ae.id : null;
  let sel = null; try{ sel = fid ? ae.selectionStart : null; }catch(e){}
  $("#view").innerHTML = html;
  if(fid){ const n = document.getElementById(fid); if(n){ n.focus({preventScroll:true}); try{ if(sel!=null) n.setSelectionRange(sel,sel); }catch(e){} } }
  const qi = $("#q"); if(qi){ qi.addEventListener("input", e=>{ filter.q=e.target.value; const pos=e.target.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos); }); }
}

/* ---------- действия ---------- */
$("#view").addEventListener("click", async e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.add) return openForm(b.dataset.add, null);
  if(b.dataset.addday) return openForm("plan", null, {date:b.dataset.addday});
  if(b.dataset.edit) { const it = items.find(i=>i.id===b.dataset.edit); return it && openForm(it.section, it); }
  if(b.dataset.intro) return openIntro(b.dataset.intro);
  if(b.dataset.toggle){ const id=b.dataset.toggle; open.has(id)?open.delete(id):open.add(id); return render(); }
  if(b.dataset.filter){ filter.status=b.dataset.filter; return render(); }
  if(b.dataset.cycle && canWrite){
    const it = items.find(i=>i.id===b.dataset.cycle); const sec = BY[it.section]; const st = sec.statuses;
    const next = st[(st.indexOf(it.status||st[0])+1)%st.length];
    try{ await dbRef.collection(colOf(it.section)).doc(it.id).update({status:next, updatedAt:new Date().toISOString()}); toast(`Статус: ${next}`); }
    catch(err){ handleWriteErr(err); }
  }
});

$("#view").addEventListener("change", async e=>{
  const s = e.target.closest("select[data-inline]"); if(!s || !canWrite) return;
  const it = items.find(i=>i.id===s.dataset.inline); if(!it) return;
  try{ await dbRef.collection(colOf(it.section)).doc(it.id).update({[s.dataset.field]:s.value, updatedAt:new Date().toISOString()}); toast("Сохранено"); }
  catch(err){ handleWriteErr(err); render(); }
});

const SECT_EXTRA = {passport:{key:"passport",label:"Паспорт бренда",fields:["title","body"],titleL:"Поле",bodyL:"Значение",add:"Строка паспорта"}};
function secOf(k){ return BY[k] || SECT_EXTRA[k]; }

function openForm(key, it, preset){
  const sec = secOf(key); const f = $("#form");
  const v = it || {status: sec.statuses?.[0], ...(preset||{})};
  const groups = [...new Set(ofSec(key).map(i=>i.group).filter(Boolean))];
  const field = name=>{
    const lab = name==="title"?(sec.titleL||FIELD.title): name==="body"?(sec.bodyL||FIELD.body): name==="channel"?(sec.channelL||FIELD.channel): FIELD[name];
    const id = "f_"+name, val = esc(v[name]??"");
    if(name==="body") return `<div class="f wide"><label for="${id}">${lab}</label><textarea id="${id}" name="body" ${sec.long?'style="min-height:260px"':""}>${val}</textarea><span class="hint">Пустая строка — новый абзац, «- » — пункт списка, «## » — подзаголовок, **жирный**.</span></div>`;
    if(name==="status") return `<div class="f"><label for="${id}">${lab}</label><select id="${id}" name="status">${sec.statuses.map(s=>`<option ${s===(v.status||sec.statuses[0])?"selected":""}>${esc(s)}</option>`).join("")}</select></div>`;
    if(name==="date") return `<div class="f"><label for="${id}">${lab}</label><input id="${id}" name="date" type="date" value="${val}"></div>`;
    if(sec.opts?.[name]) return `<div class="f"><label for="${id}">${lab}</label><select id="${id}" name="${name}"><option value=""></option>${sec.opts[name].map(o=>`<option ${o===v[name]?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
    if(name==="effect"||name==="promo") return `<div class="f wide"><label for="${id}">${lab}</label><input id="${id}" name="${name}" value="${val}"></div>`;
    if(name==="comment") return `<div class="f wide"><label for="${id}">${lab}</label><input id="${id}" name="comment" value="${val}"></div>`;
    if(name==="rating") return `<div class="f"><label for="${id}">${lab}</label><input id="${id}" name="rating" type="number" min="1" max="5" value="${val}"></div>`;
    if(name==="group") return `<div class="f"><label for="${id}">${lab}</label><input id="${id}" name="group" list="groups" value="${val}"><datalist id="groups">${groups.map(g=>`<option value="${esc(g)}">`).join("")}</datalist></div>`;
    if(name==="title") return `<div class="f wide"><label for="${id}">${lab}</label><input id="${id}" name="title" required value="${val}"></div>`;
    return `<div class="f ${name==="link"?"wide":""}"><label for="${id}">${lab}</label><input id="${id}" name="${name}" ${name==="link"?'type="url" placeholder="https://"':""} value="${val}"></div>`;
  };
  f.innerHTML = `<h3>${it?"Изменить запись":esc(sec.add)} · ${esc(sec.label)}</h3>
    <div class="fgrid">${sec.fields.map(field).join("")}</div>
    <div class="dlg-foot">
      ${it?`<span id="delZone"><button type="button" class="btn danger" id="delBtn">Удалить</button></span>`:""}
      <div class="r"><button type="button" class="btn" id="cancelBtn">Отмена</button><button type="submit" class="btn primary">Сохранить</button></div>
    </div>`;
  f.onsubmit = async ev=>{
    ev.preventDefault();
    const fd = new FormData(f); const data = {};
    for(const n of sec.fields){ let x=(fd.get(n)??"").toString().trim(); if(n==="rating") x = x? Math.max(1,Math.min(5,+x)) : ""; data[n]=x; }
    if(!data.title){ $("#f_title").focus(); toast("Заполните название"); return; }
    const btn = f.querySelector('[type=submit]'); btn.disabled=true;
    try{
      if(it){ await dbRef.collection(colOf(key)).doc(it.id).update({...data, updatedAt:new Date().toISOString()}); toast("Сохранено"); }
      else{ const order = Math.max(0,...ofSec(key).map(i=>i.order||0))+10;
        await dbRef.collection(colOf(key)).add({...data, section:key, order, createdAt:new Date().toISOString()}); toast("Добавлено"); }
      $("#dlg").close();
    }catch(err){ btn.disabled=false; handleWriteErr(err); }
  };
  $("#cancelBtn").onclick = ()=>$("#dlg").close();
  const del = $("#delBtn");
  if(del) del.onclick = ()=>{
    $("#delZone").innerHTML = `<span class="hint">Удалить без возврата?</span> <button type="button" class="btn danger" id="delYes">Да, удалить</button>`;
    $("#delYes").onclick = async ()=>{ try{ await dbRef.collection(colOf(key)).doc(it.id).delete(); $("#dlg").close(); toast("Удалено"); }catch(err){ handleWriteErr(err); } };
  };
  $("#dlg").showModal(); setTimeout(()=>f.querySelector("input,textarea")?.focus(),30);
}
function openIntro(key){
  const sec = secOf(key); const f=$("#form");
  f.innerHTML = `<h3>Описание раздела · ${esc(sec.label)}</h3>
    <div class="f wide"><label for="f_intro">Текст над списком</label><textarea id="f_intro" name="intro">${esc(pages[key]?.intro||"")}</textarea></div>
    <div class="dlg-foot"><div class="r"><button type="button" class="btn" id="cancelBtn">Отмена</button><button type="submit" class="btn primary">Сохранить</button></div></div>`;
  f.onsubmit = async ev=>{ ev.preventDefault();
    try{ await dbRef.collection("pages").doc(key).set({...(pages[key]||{}), intro:$("#f_intro").value}); $("#dlg").close(); toast("Сохранено"); }catch(err){ handleWriteErr(err); } };
  $("#cancelBtn").onclick = ()=>$("#dlg").close();
  $("#dlg").showModal();
}
function handleWriteErr(err){
  const c = err?.code;
  if(c==="invalid_argument" && !dbRef){ toast("Нет доступа к хранилищу"); return; }
  if(c==="invalid_argument"){ canWrite=false; render(); toast("У вас доступ только на просмотр"); return; }
  if(c==="quota_exceeded"){ toast("Хранилище заполнено: удалите старые записи"); return; }
  toast("Не удалось сохранить. Попробуйте ещё раз.");
}

/* ---------- данные ---------- */
async function boot(){
  render();
  const use = n => STATIC ? Promise.resolve(null) : Promise.resolve(window.claude?.use?.(n) ?? null).catch(()=>null);
  const db = await use("db");
  if(!db){ noDb=true; canWrite=false; isTeam=false; loaded=true; if(!visible(BY[route])) route="overview"; render(); return; }
  dbRef = db;
  const user = await use("user");
  if(user){ try{ const w = await user.can("data.write"); if(w===false) canWrite=false; }catch(e){}
            try{ const ed = await user.canEdit(); if(ed===false) isTeam=false; }catch(e){} }
  if(!visible(BY[route])) route="overview";
  let gotItems=false, gotPages=false;
  const timer = setTimeout(()=>{ stale=true; render(); }, 10000);
  const done = ()=>{ if(gotItems&&gotPages){ loaded=true; } };
  const merge = ()=>{ items = [...mainItems, ...teamItems]; };
  if(isTeam) db.collection("team").onSnapshot(snap=>{
    teamItems = snap.docs.map(d=>({id:d.id, ...d.data()})); merge(); render();
  }, ()=>{});
  db.collection("items").onSnapshot(snap=>{
    mainItems = snap.docs.map(d=>({id:d.id, ...d.data()})); merge();
    if(!snap.metadata.fromCache){ gotItems=true; } else if(items.length) gotItems=true;
    if(!snap.metadata.fromCache){ clearTimeout(timer); stale=false; }
    done(); render();
  }, err=>{ clearTimeout(timer); loaded=true; stale=true; render(); });
  db.collection("pages").onSnapshot(snap=>{
    pages = Object.fromEntries(snap.docs.map(d=>[d.id, d.data()]));
    gotPages=true; done(); render();
  }, ()=>{ gotPages=true; done(); render(); });
}

if(SNAP){ mainItems = SNAP.items || []; items = [...mainItems]; pages = SNAP.pages || {}; loaded = true; }
if(STATIC){ canWrite = false; isTeam = false; noDb = true; }
drawLeo(); addEventListener("resize", ()=>{ clearTimeout(drawLeo.t); drawLeo.t=setTimeout(drawLeo,150); });
route = BY[(location.hash||"").slice(1)] ? location.hash.slice(1) : "overview";
boot();
</script>
