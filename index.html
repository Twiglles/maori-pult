рует шеф. Доказываем блюдами-героями, фото и первыми отзывами. | Средняя: кухня ещё не проверена гостями |\n| Кальян без лотереи | Ценителю нужен стабильный вкус и угли без напоминаний. | Mafia House: кальян за 1 800 ₽ не раскурен. Барбарис: «горчит». Позитив у всех — про угли вовремя | Все обещают «лучший кальян», но стандарт не показывает никто. | Обещания есть, видимых гарантий нет. | Владелец ставит на стабильность и сильных мастеров. Делаем стандарт видимым: угли по таймеру, перезабивка в первые 10 минут, мастер уточняет вкус и крепость. | Средняя: стандарт ещё нужно закрепить |\n| Честная посадка и бронь | Имениннику и паре нужен стол, который им подходит. | Гозе: при пустом зале посадили у туалета, именинников не пересадили из-за брони, «места для своих» | Бронь по телефону, стол не показывают. | Гость не знает, где будет сидеть. | Бронь с выбором зоны (у леопарда, у аквариума, у окна) и пакет «день рождения». | Средняя |\n| Дневной сценарий: обед и работа | Офисам нужен быстрый ланч. Гостям с ноутбуком — тишина, розетки и дневной кальян. | Smoke Elements: бизнес-кальян 700 ₽ каждый день, удобно с ноутбуком. Рынок ланчей 290–850 ₽ | Дневной кальян есть у Smoke Elements и Гозе, ланчи — у ресторанов. Связки «ланч + кальян + работа» рядом с БЦ нет. | Рядом с БЦ «Капитал» нет места, которое закрывает обед и работу днём. | Офисы буквально за стеной, завтраки весь день, скорость отдачи. Нужно определить цену ланча и дневного кальяна. | Средняя ⚠️ цены не определены |\n| Свежий интерьер | Подругам и парам нужны красивые кадры и ощущение нового места. | Smoke Elements: «пора делать ремонт». Барбарис: «интерьер уже можно обновить» | Часть сильных по кальяну мест устарела визуально. | Хороший кальян в старом интерьере. | Новое светлое место с тропиками, леопардом 2 м и аквариумом 6 м. Преимущество живёт 1–2 года — надо успеть закрепить привычку. | Высокая, но временная |\n| Тема без игры в племя | Гостям нравятся места со своим характером: «стиль, которого нигде нет в городе». | Вальхаллу любят за тематику и легенды мастера, но это наш сосед по БЦ «Капитал» | Тематический лаунж рядом уже есть, и он тёмный, «для своих». | Нет лёгкой тематики для широкой аудитории. | Леопард и остров как настроение, а не реконструкция. По решению владельца в аутентичность не уходим: Māори — «обычный человек», нормальность. | Средняя |\n| Цены видны заранее | Студентам и подругам важно понимать чек заранее. | Гозе: «цена не соответствует качеству». Mafia House: кальян за 1 800 ₽ разочаровал | Цены часто узнают уже на месте. | Гость не может прикинуть чек. | Владелец обещает «понятные цены и порции». Публикуем меню с ценами в хайлайтах и 2ГИС до открытия. | Средняя ⚠️ меню к 10.12 |\n| Вход, который легко найти | Всем сегментам вечером надо быстро найти вход. | Данные владельца: офисное здание, парковки нет. Отзывов пока нет. | Большинство конкурентов стоят на первых этажах с вывеской. | Вход внутри БЦ — барьер на четвёртом этапе CJM. | Леопардовые лапки до двери, лифт в принте, точка входа в 2ГИС, фото входа в подтверждении брони. | Гипотеза |","group":"2. Главная GAP-таблица","info":true,"order":10,"section":"gap","title":"Главная GAP-таблица"},{"id":"gp-11","body":"**Тип:** Покупательского опыта и позиционирования\n**Потребность ЦА:** Подругам и парам важно наговориться и сделать фото.\n**Доказательства:** Гозе: «музыка играет громко», «было слишком темно». Вальхалла: «не хватает освещения»: https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews\n**Что дают конкуренты:** Лаунжи в Рязани — тёмные залы с громкой музыкой. Это норма жанра.\n**Где разрыв:** Нет места, где светло и тихо, но при этом есть кальян.\n**Наша возможность:** Светлый интерьер уже есть (владелец: «светлое помещение вместо подвала»). Добавить стандарт громкости и показывать зал при свете.\n**Уверенность:** Высокая","group":"3. GAP по отдельности","order":10,"section":"gap","status":"Есть данные","title":"Светло и слышно друг друга"},{"id":"gp-12","body":"**Тип:** Продуктовый\n**Потребность ЦА:** Некурящий в компании не хочет быть лишним и платить за ненужный кальян.\n**Доказательства:** Барбарис: некурящих гостий попросили уйти. Гозе: обязательный заказ двух кальянов: https://2gis.ru/ryazan/firm/70000001034070398/tab/reviews\n**Что дают конкуренты:** Обязательный кальян или минимальный заказ, мягкий или жёсткий.\n**Где разрыв:** Ни один лаунж не говорит прямо: «рады и тем, кто не курит».\n**Наша возможность:** Māори — ресторан и лаунж, у него полная кухня и завтраки весь день. Можно открыто обещать: «курить не обязательно».\n**Уверенность:** Высокая ⚠️ нужно решение владельца о минимальном заказе\n\n**Решено 11.11:** курить можно не всем, можно просто поесть и выпить коктейль; правила по числу кальянов на компанию нет.","group":"3. GAP по отдельности","order":20,"section":"gap","status":"Берём в работу","title":"Курить не обязательно"},{"id":"gp-13","body":"**Тип:** Позиционирования\n**Потребность ЦА:** Имениннику, паре и офису нужна нормальная еда. Подругам — вкусные напитки и десерты.\n**Доказательства:** Гозе: две жалобы на пасту на днях рождения. Один гость пишет, что поесть можно не во многих кальянных: https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews\n**Что дают конкуренты:** В большинстве кальянных — чай и снеки. Гозе возит кухню из ресторана-партнёра.\n**Где разрыв:** Нет места, где кальяну и кухне одинаково доверяют.\n**Наша возможность:** Кухня — вторая сильная сторона, её курирует шеф. Доказываем блюдами-героями, фото и первыми отзывами.\n**Уверенность:** Средняя: кухня ещё не проверена гостями","group":"3. GAP по отдельности","order":30,"section":"gap","status":"Гипотеза","title":"Кухня, а не добавка к кальяну"},{"id":"gp-14","body":"**Тип:** Позиционирования\n**Потребность ЦА:** Ценителю нужен стабильный вкус и угли без напоминаний.\n**Доказательства:** Mafia House: кальян за 1 800 ₽ не раскурен. Барбарис: «горчит». Позитив у всех — про угли вовремя: https://2gis.ru/ryazan/firm/70000001030233166/tab/reviews\n**Что дают конкуренты:** Все обещают «лучший кальян», но стандарт не показывает никто.\n**Где разрыв:** Обещания есть, видимых гарантий нет.\n**Наша возможность:** Владелец ставит на стабильность и сильных мастеров. Делаем стандарт видимым: угли по таймеру, перезабивка в первые 10 минут, мастер уточняет вкус и крепость.\n**Уверенность:** Средняя: стандарт ещё нужно закрепить","group":"3. GAP по отдельности","order":40,"section":"gap","status":"Есть данные","title":"Кальян без лотереи"},{"id":"gp-15","body":"**Тип:** Покупательского опыта\n**Потребность ЦА:** Имениннику и паре нужен стол, который им подходит.\n**Доказательства:** Гозе: при пустом зале посадили у туалета, именинников не пересадили из-за брони, «места для своих»: https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews\n**Что дают конкуренты:** Бронь по телефону, стол не показывают.\n**Где разрыв:** Гость не знает, где будет сидеть.\n**Наша возможность:** Бронь с выбором зоны (у леопарда, у аквариума, у окна) и пакет «день рождения».\n**Уверенность:** Средняя\n\n**Решено 11.11:** бронь и выбор зоны — по звонку через хостес; как выглядит посадка, покажем в хайлайтах Instagram.","group":"3. GAP по отдельности","order":50,"section":"gap","status":"Берём в работу","title":"Честная посадка и бронь"},{"id":"gp-16","body":"**Тип:** Продуктовый\n**Потребность ЦА:** Офисам нужен быстрый ланч. Гостям с ноутбуком — тишина, розетки и дневной кальян.\n**Доказательства:** Smoke Elements: бизнес-кальян 700 ₽ каждый день, удобно с ноутбуком. Рынок ланчей 290–850 ₽: https://2gis.ru/ryazan/firm/70000001021366903/tab/reviews\n**Что дают конкуренты:** Дневной кальян есть у Smoke Elements и Гозе, ланчи — у ресторанов. Связки «ланч + кальян + работа» рядом с БЦ нет.\n**Где разрыв:** Рядом с БЦ «Капитал» нет места, которое закрывает обед и работу днём.\n**Наша возможность:** Офисы буквально за стеной, завтраки весь день, скорость отдачи. Нужно определить цену ланча и дневного кальяна.\n**Уверенность:** Средняя ⚠️ цены не определены\n\n**Решено 11.11:** днём упор на коворкинг — розетки, удобные столы, быстрая подача; скидка 25% на всё меню с 12:00 до 17:00 и комбо «мини-чаша + блюдо + напиток».","group":"3. GAP по отдельности","order":60,"section":"gap","status":"Берём в работу","title":"Дневной сценарий: обед и работа"},{"id":"gp-17","body":"**Тип:** Позиционирования (временный)\n**Потребность ЦА:** Подругам и парам нужны красивые кадры и ощущение нового места.\n**Доказательства:** Smoke Elements: «пора делать ремонт». Барбарис: «интерьер уже можно обновить»: https://2gis.ru/ryazan/firm/70000001034070398/tab/reviews\n**Что дают конкуренты:** Часть сильных по кальяну мест устарела визуально.\n**Где разрыв:** Хороший кальян в старом интерьере.\n**Наша возможность:** Новое светлое место с тропиками, леопардом 2 м и аквариумом 6 м. Преимущество живёт 1–2 года — надо успеть закрепить привычку.\n**Уверенность:** Высокая, но временная","group":"3. GAP по отдельности","order":70,"section":"gap","status":"Есть данные","title":"Свежий интерьер"},{"id":"gp-18","body":"**Тип:** Позиционирования\n**Потребность ЦА:** Гостям нравятся места со своим характером: «стиль, которого нигде нет в городе».\n**Доказательства:** Вальхаллу любят за тематику и легенды мастера, но это наш сосед по БЦ «Капитал»: https://2gis.ru/ryazan/firm/70000001076263270/tab/reviews\n**Что дают конкуренты:** Тематический лаунж рядом уже есть, и он тёмный, «для своих».\n**Где разрыв:** Нет лёгкой тематики для широкой аудитории.\n**Наша возможность:** Леопард и остров как настроение, а не реконструкция. По решению владельца в аутентичность не уходим: Māори — «обычный человек», нормальность.\n**Уверенность:** Средняя","group":"3. GAP по отдельности","order":80,"section":"gap","status":"Гипотеза","title":"Тема без игры в племя"},{"id":"gp-19","body":"**Тип:** Покупательского опыта\n**Потребность ЦА:** Студентам и подругам важно понимать чек заранее.\n**Доказательства:** Гозе: «цена не соответствует качеству». Mafia House: кальян за 1 800 ₽ разочаровал: https://2gis.ru/ryazan/firm/70000001030233166/tab/reviews\n**Что дают конкуренты:** Цены часто узнают уже на месте.\n**Где разрыв:** Гость не может прикинуть чек.\n**Наша возможность:** Владелец обещает «понятные цены и порции». Публикуем меню с ценами в хайлайтах и 2ГИС до открытия.\n**Уверенность:** Средняя ⚠️ меню к 10.12\n\n**Решено 11.11:** меню с ценами — по ссылке на электронное меню в Instagram, TG и VK, внутри — планшет. В 2ГИС и Яндекс владелец выгрузит позиции после открытия.","group":"3. GAP по отдельности","order":90,"section":"gap","status":"Берём в работу","title":"Цены видны заранее"},{"id":"gp-20","body":"**Тип:** Покупательского опыта\n**Потребность ЦА:** Всем сегментам вечером надо быстро найти вход.\n**Доказательства:** Данные владельца: офисное здание, парковки нет. Отзывов пока нет.\n**Что дают конкуренты:** Большинство конкурентов стоят на первых этажах с вывеской.\n**Где разрыв:** Вход внутри БЦ — барьер на четвёртом этапе CJM.\n**Наша возможность:** Леопардовые лапки до двери, лифт в принте, точка входа в 2ГИС, фото входа в подтверждении брони.\n**Уверенность:** Гипотеза","group":"3. GAP по отдельности","order":100,"section":"gap","status":"Гипотеза","title":"Вход, который легко найти"},{"id":"gp-30","body":"| Что улучшить | Какую потребность закрывает | Чем отличаемся | Ценность для ЦА | Сложность | Что проверить | Статус |\n|---|---|---|---|---|---|---|\n| Стандарт громкости и свет у столов | Наговориться, сделать фото | Единственный светлый и тихий лаунж | Высокая для подруг и пар | Низкая | Замер громкости в пятницу вечером | Уже есть, нужна доработка |\n| «Курить не обязательно» + понятный минимальный чек | Некурящему не быть лишним | Прямо говорим то, что конкуренты запрещают | Высокая: разворачивает всю компанию | Низкая | Решение владельца о минимальном заказе | Гипотеза ⚠️ |\n| Стандарт кальяна: угли по таймеру, перезабивка в первые 10 минут, три вопроса мастера | Стабильный вкус | Гарантия вместо «у нас лучший кальян» | Высокая для ценителей | Средняя: обучение и контроль | Как часто просят перезабить | Нужна доработка |\n| Блюда-герои шефа и 4 завтрака весь день | Нормально поесть | Кальян и кухня одного уровня | Высокая для пар, именинников, офисов | Средняя | Отзывы после soft opening | Уже есть, нужно доказать |\n| Дневной режим: ланч, дневной кальян, розетки и Wi‑Fi | Обед и работа рядом с БЦ | Связка, которой нет у соседей | Средняя–высокая, будний трафик | Средняя | Цены, опрос в БЦ | Гипотеза ⚠️ |\n| Бронь с выбором зоны и пакет «день рождения» | Праздник без накладок | Гость знает, где будет сидеть | Высокая для именинников | Низкая–средняя | Сколько броней ДР в первый месяц | Нужна доработка |\n| Свет у фото-точки с леопардом | Красивые кадры | Главный инста-объект города | Высокая для подруг | Низкая | Количество отметок | Объект есть, нужен свет |\n| Меню с ценами в 2ГИС, Яндексе и хайлайтах до открытия | Понимать чек заранее | Прозрачность | Средняя | Низкая | Готовность меню к 10.12 | Нужна доработка ⚠️ |\n| Раздельный счёт и чаевые по QR | Быстро и без сюрпризов | Гости конкурентов об этом просят | Средняя | Низкая | Возможности кассы | Нужна доработка |\n| Навигация до входа: лапки, фото входа, точка в 2ГИС | Найти вход в БЦ | Снимаем барьер офисного здания | Средняя | Низкая | Есть ли вечером доступ в БЦ | Нужна доработка |","group":"4. Продуктовая отстройка","info":true,"order":10,"section":"gap","title":"Что добавить, изменить или упростить в продукте"},{"id":"gp-41","body":"**Что уже занято конкурентами:** Smoke Elements — «дёшево и каждый день» для ценителей кальяна. Гозе — «уровень и дизайн» для выхода в свет.\n**Где возможность:** Нет места, куда одинаково удобно прийти на завтрак, обед, поработать и вечером с подругами.\n**На чём строить отличие:** Идея владельца «нормальность в хорошем смысле»: стабильно, вкусно, сытно, красиво, недорого, понятно. Слоган «Здесь будет иначе».\n**Чем доказать:** Завтраки весь день, ланч, дневной кальян, понятные цены, стабильный стандарт кальяна.\n**Как сказать языком гостя:** «Māори — ваше место на каждый день: утром кофе, днём обед, вечером кальян с подругами».","group":"5. Позиционирование","order":10,"section":"gap","status":"Гипотеза","title":"Место на каждый день (рекомендуем как основу)"},{"id":"gp-42","body":"**Что уже занято конкурентами:** Тёмные «пещеры» с громкой музыкой — норма почти у всех.\n**Где возможность:** Свет и тишина как главное отличие для подруг и пар.\n**На чём строить отличие:** Светлое помещение, зелень, аквариум, тихий лаунж без танцев.\n**Чем доказать:** Фото зала при свете, стандарт громкости, отзывы гостей.\n**Как сказать языком гостя:** «Здесь слышно друг друга».","group":"5. Позиционирование","order":20,"section":"gap","status":"Гипотеза","title":"Светлый лаунж для разговоров"},{"id":"gp-43","body":"**Что уже занято конкурентами:** Гозе берёт кухню у ресторана-партнёра. Остальные — чай и снеки.\n**Где возможность:** Своя кухня с шефом рядом с сильными мастерами.\n**На чём строить отличие:** Кальяны — 60–70% концепции, кухню поднимаем до их уровня.\n**Чем доказать:** Блюда-герои, фото еды, отзывы о еде, стандарт кальяна.\n**Как сказать языком гостя:** «Пришли за кальяном — останетесь ужинать».","group":"5. Позиционирование","order":30,"section":"gap","status":"Гипотеза","title":"Кальян и кухня одного уровня"},{"id":"gp-44","body":"**Что уже занято конкурентами:** У конкурентов обязательный кальян и минимальные заказы.\n**Где возможность:** Никто не обращается к некурящим.\n**На чём строить отличие:** Формат «ресторан и лаунж», полная кухня.\n**Чем доказать:** Правило «курить не обязательно» в меню и хайлайтах. ⚠️ Нужно решение владельца.\n**Как сказать языком гостя:** «Курить не обязательно — у нас есть кухня, кофе и коктейли».","group":"5. Позиционирование","order":40,"section":"gap","status":"Гипотеза","title":"Рады всей компании"},{"id":"gp-45","body":"**Что уже занято конкурентами:** Тематика рядом уже занята: Вальхалла в БЦ «Капитал».\n**Где возможность:** Лёгкий, светлый, «нормальный» остров без игры в племя.\n**На чём строить отличие:** Леопард 2 м, аквариум 6 м, тропики, принт.\n**Чем доказать:** Фото-точка, «Леопардовый бум» по городу, маскот в контенте.\n**Как сказать языком гостя:** Эмоциональная обёртка для позиций 1–4. Сама по себе причиной выбора не станет: доказательства дают кальян, кухня и свет.","group":"5. Позиционирование","order":50,"section":"gap","status":"Гипотеза","title":"Леопард на острове (упаковка, а не отстройка)"},{"id":"gp-50","body":"Идеи на период после открытия, с декабря. Утверждённый контент-план до открытия 10 декабря они не меняют.\n\n## Контентные идеи\n| Сегмент | Проблема | Идея | Почему тестировать |\n|---|---|---|---|\n| Подруги | «Друг друга не слышно» | Рилс «Здесь слышно друг друга»: шёпот за столом, и его слышно | Бьёт в главный страх: темно и громко |\n| Подруги | Тёмные фото в лаунжах | Карусель «Где в Māори лучший свет для фото» | Фото — критерий выбора, будет UGC |\n| Некурящий | Неловкость без кальяна | Рилс «Подруга, которая не курит»: её завтрак, кофе, десерт | Сообщения для некурящих в Рязани нет ни у кого |\n| Ценитель | Кальяны-лотерея | Ритуал мастера: три вопроса, угли по таймеру, перезабивка | Показывает стандарт вместо слов «лучший кальян» |\n| Офис | «Успеем за час?» | Сторис «Обед за 15 минут» с таймером на экране | Проверяем скорость как оффер |\n| Ноутбук | «Можно поработать?» | Пост «Днём у нас тихо»: розетки, Wi‑Fi, чай | Будний дневной трафик |\n| Именинник | Страх испорченного ДР | Карусель «Стол на 8: как мы готовим ваш день рождения» | Самая высокая цена ошибки и самый громкий сарафан |\n| Все | «Наверное, дорого» | Пост «Сколько стоит вечер на троих» с реальным чеком | Прозрачность цены ⚠️ после утверждения меню |\n\n## Гипотезы воронок\n| Сегмент | Воронка | Что проверяем |\n|---|---|---|\n| Офис | Стикер с QR в лифтах БЦ «Капитал» и своего БЦ → меню недели в Telegram → предзаказ | Конверсия из QR в обеды |\n| Подруги | Розыгрыш депозитов: отметить подругу → бронь на 22–30.11 | Сколько броней приходит из розыгрыша |\n| Именинник | Хайлайт «День рождения» → директ → пакет | Брони ДР в месяц |\n| Ноутбук | Пин в 2ГИС «Дневной кальян и Wi‑Fi» → визит днём | Загрузка с 12:00 до 17:00 |\n| Все | QR на чеке → отзыв в 2ГИС или Яндексе | Число отзывов и рейтинг в первый месяц |\n| Подруги | Отметка у леопарда → репост в сторис Māори | Доля гостей, которые отмечают место |","group":"6. Контент и воронки","info":true,"order":10,"section":"gap","title":"Контентные идеи и гипотезы воронок"},{"id":"gp-60","body":"Оценка от 1 до 5 по каждому критерию, итог — сумма.\n\n| Направление | Важно для ЦА | Сила доказательств | Слабость конкурентов | Реализуемость | Итог |\n|---|---|---|---|---|---|\n| Светло и слышно друг друга | 5 | 4 | 4 | 5 | **18** |\n| Стандарт кальяна без лотереи | 5 | 4 | 3 | 4 | **16** |\n| Курить не обязательно | 4 | 4 | 5 | 3 ⚠️ | **16** |\n| Бронь с зонами и пакет «день рождения» | 4 | 3 | 4 | 4 | **15** |\n| Дневной режим: ланч и работа | 4 | 3 | 4 | 3 ⚠️ | **14** |\n| Кухня одного уровня с кальяном | 4 | 2 | 3 | 3 | 12 |\n| Цены видны заранее | 3 | 2 | 3 | 4 | 12 |\n\n**Пять приоритетов:**\n1. Светлый тихий зал.\n2. Стандарт кальяна.\n3. «Курить не обязательно».\n4. Бронь и пакет «день рождения».\n5. Дневной режим для соседних офисов.\n\n**Вывод для позиционирования:** основа — «Место на каждый день» (нормальность). Доказательства — свет, стандарт кальяна и кухня. Леопард и остров — упаковка.","group":"7. Приоритеты","info":true,"order":10,"section":"gap","title":"Приоритизация направлений"},{"id":"gp-70","body":"**Ответы владельца 11.11:**\n- Без кальяна сидеть можно, минимального правила по кальянам нет.\n- Днём скидка 25% на всё меню с 12:00 до 17:00 и комбо «мини-чаша + блюдо + напиток».\n- Меню — электронное, по ссылке и на планшете; в 2ГИС и Яндекс — после открытия.\n- Зал — 70 посадок, 1 VIP и 1 полу-VIP; бронь и зоны — через хостес, вид посадки — в хайлайтах.\n\n**Ещё уточнить:**\n- Стандарт углей и перезабивки: закрепить и обучить мастеров.\n- Есть ли вечером свободный доступ в БЦ и где вход.\n\n**Проверка исследованием:**\n- Опрос сотрудников трёх соседних офисов, примерно 30 человек: обед, бюджет, время.\n- 10 интервью с девушками 22–28: как выбирают место на вечер.\n- Мирра, Хука, Эмбер: отзывы, цены и соцсети.","group":"7. Приоритеты","info":true,"order":20,"section":"gap","title":"Что спросить у владельца и что проверить"},{"id":"jt-00","body":"**Цель:** понять, КТО приходит в лаунж и ЗАЧЕМ, какую работу гость поручает заведению. Сегменты собраны по общей Job Story, а не по возрасту и полу.\n\n**Источники (ноябрь 2026):**\n- Отзывы гостей шести кальянных Рязани в 2ГИС, около 100 отзывов: Гозе, Вальхалла (БЦ «Капитал», наш сосед), Smoke Elements, Mafia House, Барбарис, HookahPlace Terra (Горького, 102).\n- Выдача 2ГИС: 39 кальянных и лаунжей города, бизнес-ланчи и средние чеки.\n- Ответы владельца на созвоне 06.11 и статистика прошлых проектов: около 70% гостей — девушки, ядро 22–28 лет.\n\n**Как читать:**\n- «Цитата» — дословно из отзыва, со ссылкой.\n- «Мысли в голове» — реконструкция по мотивам отзывов, а не прямая речь.\n- Статус «Гипотеза» — данных пока мало, нужна проверка.\n\n**Ограничения:**\n- Не разбирали Яндекс Карты, VK и Telegram.\n- Интервью не проводили.\n- Отзывы в 2ГИС смещены в позитив: заведения просят гостей их оставлять. Поэтому негатив весит больше.\n\n**Что дальше:** 10 коротких интервью с девушками 22–28 и опрос в лифтах соседних БЦ. По итогам — подтвердить или убрать гипотезы.\n\nСписок кальянных: https://2gis.ru/ryazan/search/кальянная","group":"1. Об исследовании","info":true,"order":10,"section":"jtbd","title":"Как и на чём собрана сегментация"},{"id":"jt-01","body":"**Core Job:** вечер с подругами, на котором можно спокойно поговорить, вкусно покурить и уйти с красивыми фото.\n\n**Job Story:** КОГДА мы с подругами наконец договорились встретиться после рабочей недели, Я ХОЧУ выбрать светлое и чистое место с хорошим кальяном и негромкой музыкой, ЧТОБЫ наговориться, сделать пару красивых кадров и не просидеть вечер в тёмном подвале.\n\n**Главный триггер:** в общем чате спросили «куда идём в пятницу?». Поводом бывает встреча после перерыва, новости или просто конец недели.\n\n**Последняя капля:** в прошлый раз было темно, громко и накурено. Не поговорили, и фото не получились.\n\n**Главный страх:** отдать вечер и 2–3 тыс. ₽ месту, где не слышно друг друга, кальян горчит, а за соседним столом шумная компания.\n\n**Мысли в голове:**\n- «Куда пойдём, чтобы и посидеть, и сфоткаться?»\n- «Только не опять в тёмную кальянную, где друг друга не слышно».\n- «Посмотрю фото гостей в 2ГИС: там правда так красиво?»\n- «Главное, чтобы кальян не горчил и были нормальные лимонады».\n\n**Критерии выбора:**\n- Светло и чисто: видно интерьер и лица в кадре.\n- Музыка не мешает разговору.\n- Стабильный кальян средней крепости, фруктовые вкусы.\n- Кофе в будни, коктейли и лимонады в пятницу и субботу.\n- Есть фотогеничная точка.\n\n**Как принимает решение:** видит сторис подруги или Instagram заведения → открывает карточку в 2ГИС или Яндексе: рейтинг, фото гостей, свежие отзывы → верит подругам и фото гостей больше, чем рекламе → проверяет свет, шум и отзывы про кальян → выбирает место, где «красиво и уютно» и где подруги уже были.\n\n**Ключевое сообщение:** здесь светло и тихо. Можно наговориться и уйти с хорошими фото.\n\n**Подтверждения:**\n- Владелец: около 70% гостей прошлых проектов — девушки, они приходят с подругами (созвон 06.11).\n- Гозе: гости жалуются, что из-за громкой музыки тяжело разговаривать, и на слишком тёмный столик: https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews\n- Вальхалла: гостям не хватает освещения, чтобы рассмотреть интерьер: https://2gis.ru/ryazan/firm/70000001076263270/tab/reviews","group":"2. Сегменты","order":10,"section":"jtbd","status":"Подтверждено","title":"Подруги на вечер — наговориться в светлом и красивом месте"},{"id":"jt-02","body":"**Core Job:** провести вечер с курящими друзьями, самому не куря и не переплачивая за ненужный кальян.\n\n**Job Story:** КОГДА друзья зовут в кальянную, а я не курю или сегодня не хочу, Я ХОЧУ спокойно заказать кофе, еду или коктейль и сидеть сколько нужно, ЧТОБЫ не быть лишним и не платить за кальян, который мне не нужен.\n\n**Главный триггер:** компания выбрала кальянную, а он или она не курит. Или днём хочется просто посидеть с напитком.\n\n**Последняя капля:** попросили уйти или «докупить кальян», хотя гости уже оставили больше 700 ₽ за напитки. Другой вариант: «странное правило» заказывать два кальяна.\n\n**Главный страх:** неловкость и спор с персоналом при друзьях и выброшенные деньги.\n\n**Мысли в голове:**\n- «А меня пустят, если я не буду курить?»\n- «Не хочу платить за кальян, который мне не нужен».\n- «Там можно нормально поесть, кроме чая?»\n\n**Критерии выбора:**\n- Нет обязательного кальяна, или минимальный чек известен заранее.\n- Полноценная кухня и напитки.\n- Хорошая вытяжка: за столом не дымно.\n- Персонал не давит.\n\n**Как принимает решение:** идёт за компанией → заранее спрашивает в директе или читает отзывы → проверяет правила посадки и меню → выбирает место, где рады всем.\n\n**Ключевое сообщение:** мы рады всей компании. Курить не обязательно: есть кухня, кофе и коктейли.\n\n**Подтверждения:**\n- Барбарис: двух некурящих гостий днём попросили уйти, потому что они не заказали кальян, хотя чек за напитки был больше 700 ₽: https://2gis.ru/ryazan/firm/70000001034070398/tab/reviews\n- Гозе: гостья называет «очень странным» правило заказывать два кальяна: https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews\n\n⚠️ Чтобы использовать это сообщение, нужно решение владельца о правилах минимального заказа.\n\n**Ответ владельца 11.11:** курить можно не всем: можно просто поесть и выпить коктейль. Правила «столько-то кальянов на компанию» нет (возможно, введут сильно позже).","group":"2. Сегменты","order":20,"section":"jtbd","status":"Подтверждено","title":"Некурящий в компании — не чувствовать себя лишним"},{"id":"jt-03","body":"**Core Job:** хороший кальян под свой вкус каждый раз, а не через раз.\n\n**Job Story:** КОГДА я после работы иду покурить с друзьями, Я ХОЧУ, чтобы мастер забил именно то, что я попросил, и весь вечер следил за углями, ЧТОБЫ не отдать 1 000–1 800 ₽ за горький или «пустой» кальян.\n\n**Главный триггер:** конец рабочего дня или выходные, хочется попробовать новый табак или вкус, друг посоветовал мастера.\n\n**Последняя капля:** кальян горчит и быстро прогорает, угли не меняют, вместо заказанного забили «то, что было».\n\n**Главный страх:** плохой кальян испортит вечер, а деньги уже потрачены.\n\n**Мысли в голове:**\n- «Главное — кто сегодня на смене».\n- «Есть ли нормальная полка: Darkside, Tangiers, Трофимов?»\n- «Угли будут менять сами или каждый раз звать?»\n- «Если горчит, перезабьют бесплатно?»\n\n**Критерии выбора:**\n- Конкретный мастер и стабильное качество.\n- Ассортимент табака.\n- Угли меняют по времени, без напоминаний.\n- Бесплатная перезабивка.\n- Вытяжка.\n- Цена соответствует качеству.\n\n**Как принимает решение:** сарафан и «свой мастер» → отзывы в 2ГИС, где мастеров хвалят по имени → проверяет полку табака и цену кальяна → выбирает «стабильное» место и ходит туда годами.\n\n**Ключевое сообщение:** за этот кальян не страшно: стабильный вкус, угли по таймеру и бесплатная перезабивка, если что-то не так.\n\n**Подтверждения:**\n- Mafia House: кальян за 1 800 ₽ принесли непрогретым, жара не хватило. В позитивных отзывах хвалят, что угли меняют раз в 30 минут, а один гость ходит туда больше 7 лет: https://2gis.ru/ryazan/firm/70000001030233166/tab/reviews\n- Барбарис: жалобы «горчит, быстро прогорает» и «просили с ягодами — принесли безвкусный». В плюсах — табаки от Darkside до Tangiers и бесплатная перезабивка: https://2gis.ru/ryazan/firm/70000001034070398/tab/reviews\n- Владелец: кальяны — главная сильная сторона, мастера — профи из его бывших учеников, ставка на стабильность.","group":"2. Сегменты","order":30,"section":"jtbd","status":"Подтверждено","title":"Ценитель кальяна — стабильный кальян без лотереи"},{"id":"jt-04","body":"**Core Job:** нормальный обед в двух шагах, который укладывается в обеденный перерыв.\n\n**Job Story:** КОГДА у меня обед в бизнес-центре, Я ХОЧУ быстро и сытно поесть рядом, ЧТОБЫ вернуться вовремя и уложиться в привычные 400–600 ₽.\n\n**Главный триггер:** с 12:30 до 14:00 коллеги зовут на обед, а столовая и доставка надоели.\n\n**Последняя капля:** блюдо несли так долго, что опоздал на встречу.\n\n**Главный страх:** не успеть, переплатить, остаться голодным после «ресторанной» порции.\n\n**Мысли в голове:**\n- «Успеем за час?»\n- «Есть бизнес-ланч или только меню?»\n- «Сколько будет стоить обедать там каждый день?»\n\n**Критерии выбора:**\n- Скорость отдачи.\n- Цена ланча на уровне города: от 290 до 850 ₽, чаще от 500 ₽.\n- Можно дойти пешком, парковка не нужна.\n- Понятное меню на неделю.\n- Предзаказ.\n\n**Как принимает решение:** слышит от коллег, видит баннер или стикер в лифте БЦ → смотрит меню ланча в Telegram, Instagram или 2ГИС → пробует один раз с коллегами → если быстро и сытно, ходит регулярно.\n\n**Ключевое сообщение:** обед в соседнем доме: быстро, сытно и по понятной цене.\n\n**Подтверждения:**\n- Владелец: первые 4–5 часов работы — трафик ближних офисов, ставка на скорость, позже предзаказ через приложение.\n- Рынок в 2ГИС: бизнес-ланчи в Рязани от 290 до 850 ₽. В «Небе» ланч от 500 ₽. «Хинкальный дом» по будням до 17:00 даёт скидку 25%: https://2gis.ru/ryazan/search/бизнес-ланч\n- Отзывов офисных гостей о кальянных нет. Сегмент проверяем опросом в БЦ «Капитал», своём БЦ и офисе МТС.\n\n**Ответ владельца 11.11:** бизнес-ланч — скидка 25% на всё меню с 12:00 до 17:00 и комбо «мини-чаша + блюдо + напиток» ради скорости и доступной цены.","group":"2. Сегменты","order":40,"section":"jtbd","status":"Есть подтверждения","title":"Сотрудник соседнего офиса — быстро и сытно пообедать"},{"id":"jt-05","body":"**Core Job:** несколько продуктивных часов вне дома и офиса, без неудобств.\n\n**Job Story:** КОГДА мне нужно поработать вне дома или офиса, Я ХОЧУ тихое место с розеткой, Wi‑Fi, чаем и недорогим дневным кальяном, ЧТОБЫ спокойно поработать пару часов и не чувствовать, что меня торопят.\n\n**Главный триггер:** удалёнка, окно между встречами, дома не работается.\n\n**Последняя капля:** шумно, нет розетки, официант намекает, что пора освободить стол.\n\n**Главный страх:** потерять рабочие часы и переплатить.\n\n**Мысли в голове:**\n- «Можно там посидеть с ноутбуком?»\n- «Есть дневной кальян подешевле?»\n- «У стола будет розетка?»\n\n**Критерии выбора:**\n- Днём тихо.\n- Розетки и Wi‑Fi.\n- Дневной или бизнес-кальян: у конкурентов около 700 ₽.\n- Чай без ограничений.\n- Удобный стол.\n\n**Как принимает решение:** находит место рядом на карте → читает отзывы о том, можно ли там поработать → пробует → если удобно, ходит почти каждый день. Это самый частый гость из всех сегментов.\n\n**Ключевое сообщение:** днём здесь тихо: розетки, Wi‑Fi, чай и дневной кальян. Работайте сколько нужно.\n\n**Подтверждения:**\n- Smoke Elements: постоянный гость почти каждый день берёт бизнес-кальян за 700 ₽ и отмечает, что с ноутбуком там удобно. Ещё один гость пришёл поработать на удалёнке: https://2gis.ru/ryazan/firm/70000001021366903/tab/reviews\n- Гозе: место хвалят как подходящее «для продуктивного рабочего дня»: https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews\n- Mafia House: гостья заходит в перерывах между работой: https://2gis.ru/ryazan/firm/70000001030233166/tab/reviews\n\n**Ответ владельца 11.11:** упор на коворкинг днём — точно можно: розетки, обеденная скидка, удобные столы, быстрая подача.","group":"2. Сегменты","order":50,"section":"jtbd","status":"Подтверждено","title":"Днём с ноутбуком — поработать в тишине с чаем и кальяном"},{"id":"jt-06","body":"**Core Job:** праздник для своей компании без накладок.\n\n**Job Story:** КОГДА я собираю друзей на день рождения, Я ХОЧУ заранее забронировать стол, за которым все поместятся, с вкусной едой и кальянами, ЧТОБЫ праздник прошёл гладко и мне не было неловко перед гостями.\n\n**Главный триггер:** до дня рождения или другого повода 1–3 недели.\n\n**Последняя капля:** на прошлом празднике стол был маленький, еда невкусная, а пересесть не дали, хотя зал пустовал.\n\n**Главный страх:** праздник испорчен у всех на глазах, и виноват тот, кто выбрал место.\n\n**Мысли в голове:**\n- «Мы все поместимся за этот стол?»\n- «Еда там нормальная или только кальяны?»\n- «Будет ли что-то для именинника?»\n- «Сколько выйдет на человека?»\n\n**Критерии выбора:**\n- Стол или зона под количество гостей.\n- Уверенность в кухне.\n- Персонал идёт навстречу.\n- Понятный счёт на компанию, который можно разделить.\n- Бонус имениннику.\n\n**Как принимает решение:** начинает за 1–3 недели → сравнивает 3–4 места по фото зала и отзывам о еде → звонит или пишет, уточняет стол и депозит → выбирает тех, кто ответил быстро и понятно.\n\n**Ключевое сообщение:** отметьте у нас: подберём стол под вашу компанию, вкусно накормим, а имениннику — подарок.\n\n**Подтверждения:**\n- Гозе, два отзыва о днях рождения. В первом: маленький стол у приставки, пересесть не дали из-за брони, невкусная паста. Во втором гостья жалеет, что выбрала это место для своего праздника. Скидку имениннику 10% там дали: https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews","group":"2. Сегменты","order":60,"section":"jtbd","status":"Есть подтверждения","title":"Именинник-организатор — отметить так, чтобы не было неловко перед гостями"},{"id":"jt-07","body":"**Core Job:** уютный вечер вдвоём, где можно поговорить наедине.\n\n**Job Story:** КОГДА мы хотим провести вечер вдвоём, Я ХОЧУ место с уединённым столиком, приятным светом и вкусной едой, ЧТОБЫ было романтично, но без пафоса и цен дорогого ресторана.\n\n**Главный триггер:** свидание, годовщина или «давно никуда не выбирались».\n\n**Главный страх:** посадят в проходе или у туалета, рядом окажется шумная компания.\n\n**Мысли в голове:**\n- «Есть там уединённые столики?»\n- «Можно и поесть, не только покурить?»\n- «Не слишком ли пафосно и дорого?»\n\n**Критерии выбора:**\n- Камерные столики или VIP-зона без доплаты.\n- Свет приглушённый, но не тёмный.\n- Кухня.\n- Адекватный чек на двоих.\n\n**Как принимает решение:** рекомендации или Instagram → фото зала → бронь конкретного стола.\n\n**Ключевое сообщение:** уютный столик на двоих в тропиках, без пафоса и по понятной цене.\n\n**Подтверждения:**\n- Барбарис: пара сидела в VIP-комнате, с понедельника по четверг она без доплаты: https://2gis.ru/ryazan/firm/70000001034070398/tab/reviews\n- Гозе: хвалят столики «в отдалении» для уединения, но в другом отзыве жалуются, что при пустом зале посадили у туалета: https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews\n\nСегмент пока на гипотезе: у Māори нет данных о камерных зонах.\n\n**Ответ владельца 11.11:** средний чек на двоих 2 500–3 500 ₽, будут VIP и полу-VIP. Сценарий свиданий не прорабатывали — это наша зона.","group":"2. Сегменты","order":70,"section":"jtbd","status":"Есть подтверждения","title":"Пара на свидание — уединение без ресторанного пафоса"},{"id":"jt-10","body":"| Сегмент | Core Job | Job Story | Главный триггер | Главный страх | Мысли в голове | Критерии выбора | Как принимает решение | Ключевое сообщение |\n|---|---|---|---|---|---|---|---|---|\n| Подруги на вечер | Наговориться, вкусно покурить, уйти с красивыми фото | Когда наконец встречаемся после недели → хочу светлое место с хорошим кальяном и негромкой музыкой → чтобы наговориться и не сидеть в подвале | «Куда идём в пятницу?» в чате | Темно, громко, горчит — вечер и 2–3 тыс. ₽ впустую | «Только не опять тёмная кальянная» | Свет и чистота, тишина, стабильный кальян, напитки, фото-точка | Сторис подруг → 2ГИС (фото гостей) → верит подругам → место, где подруги уже были | Светло и тихо: можно наговориться и уйти с хорошими фото |\n| Некурящий в компании | Быть с друзьями и не платить за ненужный кальян | Когда компания идёт в кальянную, а я не курю → хочу сидеть с кофе или едой → чтобы не быть лишним | Компания выбрала кальянную | Попросят уйти или «докупить кальян» | «А меня пустят без кальяна?» | Нет обязательного кальяна, кухня, вытяжка, нет давления | Идёт за компанией → спрашивает в директе или читает отзывы | Рады всей компании: курить не обязательно |\n| Ценитель кальяна | Стабильно хороший кальян каждый раз | Когда иду покурить после работы → хочу, чтобы забили то, что прошу, и следили за углями → чтобы не отдать 1 000–1 800 ₽ за горечь | Конец дня, новый табак, совет друга | Горький или «пустой» кальян за полную цену | «Кто сегодня на смене?» | Мастер, полка табака, угли по таймеру, перезабивка | Сарафан → отзывы о мастерах → полка и цена → ходит годами | За этот кальян не страшно: стабильно и с бесплатной перезабивкой |\n| Сотрудник соседнего офиса | Быстрый сытный обед рядом | Когда обед в БЦ → хочу поесть в двух шагах → чтобы успеть и уложиться в 400–600 ₽ | 12:30–14:00, коллеги зовут | Не успеть, переплатить | «Успеем за час?» | Скорость, цена ланча, пешком, меню недели | Коллеги или лифт → меню онлайн → проба → регулярно | Обед в соседнем доме: быстро, сытно, по понятной цене |\n| Днём с ноутбуком | Продуктивные часы вне дома | Когда надо поработать вне дома → хочу тихо, розетку, Wi‑Fi и дневной кальян → чтобы не торопили | Удалёнка, окно между встречами | Шум, нет розетки, торопят | «Можно с ноутбуком?» | Тишина, розетки, Wi‑Fi, дневной кальян около 700 ₽, чай | Карта рядом → отзывы про работу → ходит почти каждый день | Днём тихо: розетки, Wi‑Fi и дневной кальян |\n| Именинник-организатор | Праздник без накладок | Когда собираю друзей на ДР → хочу стол на всех, вкусную еду и кальяны → чтобы не было неловко | Повод через 1–3 недели | Испорченный праздник на глазах у всех | «Мы все поместимся?» | Стол под компанию, кухня, гибкость, делёж счёта, бонус | Сравнивает 3–4 места → звонит → выбирает, кто ответил понятно | Подберём стол, вкусно накормим, имениннику подарок |\n| Пара на свидание | Уютный вечер вдвоём | Когда хотим вечер вдвоём → хочу уединённый столик и вкусную еду → чтобы романтично без пафоса | Свидание, годовщина | Посадят у туалета или рядом с шумной компанией | «Есть уединённые столики?» | Камерность, свет, кухня, чек на двоих | Рекомендации → фото зала → бронь стола | Уютный столик на двоих, без пафоса |","group":"3. Сводная JTBD-таблица","info":true,"order":10,"section":"jtbd","title":"Сравнительная JTBD-таблица"},{"id":"jt-11","body":"| Сегмент | Наблюдение | Что подтверждает | Тип | Ссылка |\n|---|---|---|---|---|\n| Подруги на вечер | Около 70% гостей прошлых проектов владельца — девушки, приходят с подругами | Размер и ядро сегмента | Данные владельца | Созвон 06.11 |\n| Подруги на вечер | «Музыка играет громко, разговаривать тяжело» | Страх «не поговорим» | Цитата | https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews |\n| Подруги на вечер | Жалобы: «было слишком темно» (Гозе), «не хватает немного освещения» (Вальхалла) | Свет как критерий выбора | Цитаты | https://2gis.ru/ryazan/firm/70000001076263270/tab/reviews |\n| Некурящий в компании | Некурящих гостий попросили уйти, потому что они не заказали кальян, хотя чек был больше 700 ₽ | Последняя капля и страх | Пересказ отзыва | https://2gis.ru/ryazan/firm/70000001034070398/tab/reviews |\n| Некурящий в компании | «Очень странное правило заказать 2 кальяна» | Обязаловка раздражает | Цитата | https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews |\n| Ценитель кальяна | Кальян за 1 800 ₽ не раскурен, жара не хватало | Цена ошибки и страх | Пересказ отзыва | https://2gis.ru/ryazan/firm/70000001030233166/tab/reviews |\n| Ценитель кальяна | «Горчит и быстро прогорает» | Главная боль | Цитата | https://2gis.ru/ryazan/firm/70000001034070398/tab/reviews |\n| Ценитель кальяна | Хвалят угли «раз в 30 минут» и «вовремя, без напоминаний» | Критерий: угли по таймеру | Цитаты | https://2gis.ru/ryazan/firm/70000001030233166/tab/reviews |\n| Сотрудник офиса | Бизнес-ланчи в городе от 290 до 850 ₽, у конкурентов скидки до 17:00 | Ценовой коридор | Данные 2ГИС | https://2gis.ru/ryazan/search/бизнес-ланч |\n| Сотрудник офиса | Первые 4–5 часов — офисы рядом, парковки нет | Сценарий и ограничение | Данные владельца | Созвон 06.11 |\n| Днём с ноутбуком | Бизнес-кальян за 700 ₽ почти ежедневно, «удобно для работы с ноутбуком» | Сегмент существует и ходит часто | Пересказ отзыва | https://2gis.ru/ryazan/firm/70000001021366903/tab/reviews |\n| Днём с ноутбуком | Место хвалят «для продуктивного рабочего дня» | Повторяется у разных заведений | Цитата | https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews |\n| Именинник | Маленький стол у приставки, не пересадили, невкусная паста | Страх испорченного праздника | Пересказ отзыва | https://2gis.ru/ryazan/firm/70000001053327341/tab/reviews |\n| Пара | VIP-комната без доплаты с понедельника по четверг, пришёл с женой | Запрос на уединение | Пересказ отзыва | https://2gis.ru/ryazan/firm/70000001034070398/tab/reviews |\n| Все | Сосед по БЦ «Капитал» (Вальхалла) любят за тематику и рассказы мастера о легендах | Тематика работает, но рядом уже занята | Вывод | https://2gis.ru/ryazan/firm/70000001076263270/tab/reviews |","group":"4. Доказательства и выводы","info":true,"order":20,"section":"jtbd","title":"Таблица доказательств"},{"id":"jt-12","body":"- **Вечер и день — две разные работы.** Вечером гость покупает разговор и атмосферу (подруги, пара, именинник). Днём — время и скорость (офис, ноутбук). Эти сообщения нельзя смешивать в одном посте.\n- **Подруги и ценитель кальяна платят за разное.** Для подруг кальян — фон, важны свет, тишина и фото. Для ценителя кальян — главное, интерьер вторичен. Владелец прав, что парни приходят за девушками, но удерживает их только стабильный кальян.\n- **Некурящий — скрытый сегмент.** Он сам не выбирает место, но может развернуть всю компанию. Почти в каждой компании девушек есть кто-то, кто не курит.\n- **У именинника самая высокая цена ошибки.** Один плохой праздник даёт громкий негативный отзыв, один хороший — сразу 6–10 новых гостей.\n- **Офис и ноутбук дают будний трафик**, а значит загрузку зала с 12:00 до 18:00, когда лаунж обычно пустой.\n- **Что не стало отдельным сегментом.** «Студенты» — это не работа, а ценовая чувствительность внутри других сегментов. «Фото-гости» — критерий подруг, а не отдельная задача. «Гости города» встречаются в отзывах, но их мало. Старые гипотезы — в разделе «Аудитория».","group":"4. Доказательства и выводы","info":true,"order":30,"section":"jtbd","title":"Чем сегменты отличаются друг от друга"},{"id":"kb-01","body":"Маори — коренной народ Новой Зеландии, часть большой полинезийской семьи. Их предки приплыли на больших каноэ «вака» из Восточной Полинезии примерно в 1250–1300 годах. Прародину в преданиях называют Гаваики.\n\nСвою страну маори называют **Аотеароа**. Обычно это переводят как «земля длинного белого облака». Сегодня маори — это примерно 17–18% населения Новой Зеландии.\n\nСлово «māori» на языке маори значит «обычный, естественный, настоящий». Так люди называли себя, чтобы отличать от пришельцев-европейцев (их называют «пакеха»).\n\n## Что взять в бренд\n- Идею «настоящего, естественного»: она хорошо ложится на тёплый, неглянцевый тон.\n- Историю плавания к новой земле: Māори как остров, к которому приплываешь из обычной Рязани.","group":"Маори","order":10,"section":"knowledge","title":"Кто такие маори"},{"id":"kb-02","body":"Черта над буквой (макрон) в языке маори обозначает долгий гласный: «Mā» тянется. По-русски слово обычно пишут «маори» с ударением на первый слог: ма́ори. Во множественном числе слово не меняется.\n\nВладелец пишет название смешанно: латинская «Mā» и кириллица «ори». Это сильный визуальный ход: макрон превращается в фирменный знак.\n\n## Что предложить\n- Сделать макрон самостоятельным элементом айдентики: черта над буквой как линия горизонта острова.\n- Зафиксировать в брендбуке одно написание и следить, чтобы в макетах не терялась «ā».\n- Уточнить на брифе ударение. От него зависят видео, аудиореклама и то, как гости будут называть место.","group":"Маори","order":20,"section":"knowledge","title":"Название и макрон: Māори"},{"id":"kb-03","body":"## Манаакитанга (manaakitanga)\nЗабота о госте, щедрость и уважение. Буквально — поднимать «ману» (достоинство, силу) гостя. Хозяин, который хорошо принимает гостя, сам становится уважаемее. Это готовая философия сервиса.\n## Фанаунгатанга (whanaungatanga)\nЧувство родства и принадлежности. Именно оно даёт ощущение, что ты среди своих.\n## Фа́нау (whānau)\nСемья в широком смысле: родные, друзья, своя компания.\n## Ка́и (kai)\nЕда. Хорошее короткое слово для рубрик меню.\n## Хонги (hongi)\nТрадиционное приветствие: люди касаются носами и лбами и обмениваются дыханием жизни. Красивая метафора, но изображать её в рекламе стоит осторожно.\n## Киа ора (kia ora)\nСамое известное приветствие: «будь здоров», «привет», «спасибо». В Новой Зеландии его используют все, оно подходит для бережного использования.\n\n## Что взять в бренд\n- Сервисный манифест на основе манаакитанги.\n- Названия зон или рубрик: «Ка́и», «Фа́нау».\n- Каждому элементу даём короткую расшифровку смысла.","group":"Маори","order":30,"section":"knowledge","title":"Ценности маори, которые подходят гостеприимству"},{"id":"kb-04","body":"## Можно использовать бережно и с объяснением\n- **Кору** — спираль разворачивающегося побега папоротника. Символ нового начала, роста и гармонии. Подходит месту, которое только открывается, и хорошо сочетается с тропической зеленью.\n- **Серебристый папоротник** — национальный символ Новой Зеландии.\n- **Пуна́му** — новозеландский нефрит, зелёный камень. Ценный подарок, символ связи между людьми. Красивая отсылка для палитры.\n- **Мата́рики** — новый год маори, связанный с восходом Плеяд в конце июня или начале июля. С 2022 года это государственный праздник Новой Зеландии. Готовый повод для летнего ивента.\n## Лучше не использовать\n- **Та моко** — традиционная татуировка лица и тела. Это сакральный знак рода и личной истории, а не орнамент. Если копировать его на мерч, меню или стены, бренд быстро обвинят в присвоении чужой культуры.\n- **Хака** — ритуальный танец. Самая известная хака, «Ka Mate», в Новой Зеландии закреплена законом за племенем Нгати Тоа (2014). Пародии и «хака-флешмобы» воспринимаются плохо.\n- **Хеи-тики и резные фигуры предков** — священные изображения. Тики-кружки в барах относятся к американской культуре, а не к маори, и подавать их нужно как поп-тропики.\n## Вывод\nОпираемся на ценности, природу и путешествие по океану. Сакральные знаки не берём.","group":"Маори","order":40,"section":"knowledge","title":"Символы и узоры: что можно, а что нельзя"},{"id":"kb-05","body":"Полинезия — это тысячи островов в Тихом океане внутри огромного треугольника: Гавайи на севере, Новая Зеландия на юго-западе, остров Пасхи (Рапа-Нуи) на юго-востоке. Внутри находятся Таити, Самоа, Тонга, Острова Кука, Маркизские острова.\n\nПолинезийцы — одни из лучших мореплавателей в истории. Без компаса и карт они ориентировались по звёздам, волнам, ветрам и птицам и заселили острова на тысячи километров вокруг.\n\n## Что взять в бренд\n- Мотив путешествия и навигации по звёздам.\n- Аквариум на 6 метров как частица океана, по которому шли каноэ.\n- Остров как место, где «всё будет иначе»: другие правила, другой ритм, тепло.","group":"Полинезия","order":50,"section":"knowledge","title":"Полинезийский треугольник"},{"id":"kb-06","body":"Почти всё, что мы называем «тропическим баром», придумано в США. В 1933 году в Голливуде открылся бар Don the Beachcomber с ромовыми коктейлями и «полинезийским» декором. Затем появился Trader Vic's. Именно там в 1940-х придумали **Май Тай**: по легенде, гость с Таити попробовал коктейль и сказал «maita'i», то есть «хорошо».\n\n## Что взять в бренд\n- Классику тики: Май Тай, Зомби, Пина Колада. Их можно переосмыслить в авторской линейке.\n- Подачу: фрукты, зелень, огонь, необычная посуда.\n- Важно помнить, что тики — это американская фантазия о Полинезии. Подаём её с иронией и любовью и не выдаём за подлинную культуру маори.","group":"Полинезия","order":60,"section":"knowledge","title":"Тики-культура и коктейли"},{"id":"kb-07","body":"Леопард (Panthera pardus) — большая кошка из рода пантер. Живёт в Африке и Азии: от саванн и тропических лесов до гор и снежной тайги.\n\n## Факты, которые цепляют\n- Узор из розеток у каждого леопарда уникален, как отпечаток пальца.\n- Лучший древолаз среди больших кошек: затаскивает добычу на дерево, иногда тяжелее себя.\n- Одиночка и ночной охотник. Активнее всего в сумерках и ночью, как и лаунж.\n- Бегает до 58 км/ч, прыгает до 6 метров в длину и до 3 метров вверх.\n- Хорошо плавает.\n- Чёрная пантера чаще всего тот же леопард, только с тёмным окрасом. Розетки у неё никуда не деваются, их видно при правильном свете.\n- Голос леопарда похож на звук пилы: короткий хриплый «распил».\n\n## Что взять в бренд\n- «Уникальный, как розетки леопарда» — про каждого гостя и каждый вечер.\n- Ночную природу хищника — для поздних вечеринок и ночного меню.\n- Скрытые розетки чёрной пантеры — для тёмной версии айдентики и тизеров в духе «присмотритесь».","group":"Леопард","order":70,"section":"knowledge","title":"Леопард: главное о звере"},{"id":"kb-08","body":"В России живут два подвида леопарда, и это сильный локальный повод.\n- **Дальневосточный (амурский) леопард** — самый редкий в мире. В начале 2000-х их оставалось около 30–40, а сейчас, по данным нацпарка «Земля леопарда» в Приморье, больше 100. Это одна из самых успешных историй спасения вида.\n- **Переднеазиатский леопард** возвращается на Кавказ: животных разводят в центре восстановления в Сочинском нацпарке и выпускают в дикую природу.\n\n## Что взять в бренд\n- Благотворительную механику: часть выручки с фирменного коктейля или мерча передаём фонду защиты леопарда. Формат и партнёра нужно проверить отдельно.\n- Только искусственный мех и принт. Позиция бренда: «мы любим леопардов живыми».","group":"Леопард","order":80,"section":"knowledge","title":"Леопарды в России"},{"id":"kb-09","body":"- **Дионис**, греческий бог вина и праздника, ездил на колеснице, запряжённой пантерами, и носил пятнистую шкуру. Выходит, что леопард — древний покровитель бара.\n- В Древнем Египте шкуру леопарда носили жрецы, а в Африке её веками считали знаком власти вождей.\n- В сказке Редьярда Киплинга «Откуда у леопарда пятна» (1902) пятна появляются, чтобы леопард мог прятаться в пёстрой тени леса.\n- В геральдике «леопардами» называли идущих львов на гербах Англии и Нормандии.\n\n## Что взять в бренд\n- Легенду о Дионисе — для барной карты и тоста заведения.\n- Сюжет Киплинга — для своей сказки о том, как леопард получил пятна на острове Māори. Готовая история для маскота.","group":"Леопард","order":90,"section":"knowledge","title":"Леопард в культуре и мифах"},{"id":"kb-10","body":"- В 1947 году Кристиан Диор показал в первой коллекции платья с леопардовым принтом. С тех пор принт считается символом смелой женственности.\n- В 1962 году Жаклин Кеннеди появилась в леопардовом пальто от Олега Кассини. Это вызвало ажиотаж и массовую охоту на леопардов, и позже Кассини об этом сожалел. Отсюда важная позиция: принт — да, натуральный мех — никогда.\n- Потом принт носили панки и рок-звёзды, его любили Roberto Cavalli и Saint Laurent. Сегодня в моде его считают почти нейтральным: он сочетается со многим.\n- Значения: уверенность, игра, немного дерзости, «я не боюсь быть заметным».\n\n## Правило дозировки\nНа светлой базе принт работает как акцент: примерно 10–20% поверхности. Если принта больше, он перестаёт быть фишкой и превращается в шум.","group":"Леопард","order":100,"section":"knowledge","title":"Леопардовый принт в моде"},{"id":"kb-11","body":"Главный парадокс концепции: в Полинезии и Новой Зеландии леопарды не водятся. В Новой Зеландии вообще нет местных наземных хищников: из коренных млекопитающих там живут только летучие мыши.\n\nЭто не проблема, а сюжет. Леопард на острове — пришелец, который нашёл место, где «всё будет иначе». Как гость, который приходит из обычного города и остаётся, потому что здесь тепло и все свои.\n\n## Черновик легенды\nЛеопард устал от жизни, где все бегут и прячутся. Он доплыл до острова, где никто не охотится, где тепло и зелено, а вода прозрачная, как в аквариуме. Здесь он перестал прятать пятна и стал хозяином, который встречает гостей. Каждая розетка на его шкуре — история человека, который пришёл сюда впервые.\n\n## Как использовать\n- Имя маскоту выбираем вместе с подписчиками. Голосование само по себе прогревает аудиторию.\n- Двухметровый леопард в зале — главный персонаж контента: у него есть характер, привычки и любимый коктейль.\n- «Леопардовый бум в Рязани» — это следы того, что леопард уже в городе.","group":"Как связать остров и леопарда","order":110,"section":"knowledge","title":"Леопард на острове: легенда бренда"},{"id":"kb-12","body":"У каждого элемента бренда есть короткая расшифровка. Список пополняем: всё, что придумываем для дизайна и PR, получает свою строку.\n- **Макрон над «ā»** — линия горизонта: за ней начинается остров.\n- **Розетки** — каждая уникальна, как каждый гость.\n- **Кору, побег папоротника** — новое начало.\n- **Аквариум** — частица океана, по которому плыли к острову.\n- **Банановые листья** — тень и укрытие, место, где можно выдохнуть.\n- **Леопард-хозяин** — манаакитанга: гость здесь важнее всех.","group":"Как связать остров и леопарда","order":120,"section":"knowledge","title":"Словарь смыслов: зачем каждая деталь"},{"id":"kb-13","body":"Māori — название реального народа, и бренды уже получали за это критику.\n- В 2001 году LEGO после жалоб маори переименовала часть персонажей линейки Bionicle, в именах которых были слова языка маори.\n- В Новой Зеландии при ведомстве по товарным знакам работает консультативный комитет маори. Он проверяет, не оскорбительны ли товарные знаки с маорийскими словами и образами.\n\n## Наши правила\n- Не используем сакральные знаки: та моко, изображения предков, хаку.\n- Не делаем карикатуры: «дикари», юбки из травы, раскрашенные лица.\n- Говорим о вдохновении: «остров, близкий по духу Полинезии», а не «настоящая культура маори».\n- Если используем слова маори, переводим и объясняем их с уважением.","group":"Риски и право","order":130,"section":"knowledge","title":"Культурная чувствительность"},{"id":"kb-14","body":"Это не юридическая консультация. Перед запуском всё нужно сверить с юристом.\n- **Кальяны.** Закон «О рекламе» (ст. 7) запрещает рекламу табака, никотиносодержащей продукции и курительных принадлежностей, включая кальяны. В контенте кальян показываем только как часть атмосферы: без цен, призывов и акций.\n- **Алкоголь.** Статья 21 того же закона жёстко ограничивает рекламу алкоголя, в том числе в интернете. Коктейли показываем как гастрономию и атмосферу, без призывов к употреблению и без скидок на алкоголь.\n- **Маркировка.** Платную рекламу в интернете (блогеры, посевы, таргет) нужно маркировать и регистрировать через ОРД (erid).\n- **Instagram.** Компания Meta признана в России экстремистской, таргетированную рекламу там не запускаем. Instagram оставляем витриной, а платное продвижение ведём через VK, Telegram, Яндекс Карты и 2ГИС.\n- **Уличные акции.** За граффити и стикеры на чужой собственности предусмотрена административная ответственность. Для «Леопардового бума» ищем согласованные поверхности, партнёров и легальные форматы.","group":"Риски и право","order":140,"section":"knowledge","title":"Реклама кальянов и алкоголя, Instagram и уличные акции"},{"id":"pass-01","body":"**Māори**: латинская «ā» с макроном и кириллица «ори». Произношение — как удобно (маори/маури), владелец не настаивает. Смысл: «обычный человек».","order":10,"section":"passport","title":"Название"},{"id":"pass-02","body":"На 60–70% лаунж, но и полноценный ресторан. Сильные стороны — кальяны и кухня; бар в пиаре притушаем. 4 завтрака весь день, немного игровых консолей. Без танцев.","order":20,"section":"passport","title":"Формат"},{"id":"pass-03","body":"Азиатско-европейская.","order":30,"section":"passport","title":"Кухня"},{"id":"pass-04","body":"Здесь будет иначе.","order":40,"section":"passport","title":"Слоган"},{"id":"pass-05","body":"Тропики, тепло и уют, стиль и качество. Островная тема, близкая по духу Полинезии.","order":50,"section":"passport","title":"Вайб"},{"id":"pass-06","body":"Леопардовый принт как главный акцент: униформа персонала, обивка мебели, детали. Интерьер в целом светлый, много тропической зелени, например банановых листьев.","order":60,"section":"passport","title":"Айдентика"},{"id":"pass-07","body":"Двухметровый леопард в центре зала. Это инста-объект и маскот бренда. Имя пока не выбрано.","order":70,"section":"passport","title":"Маскот"},{"id":"pass-08","body":"Шестиметровый аквариум с рыбами, остался от прежних владельцев. Вместе с зеленью поддерживает островную тему.","order":80,"section":"passport","title":"Аквариум"},{"id":"pass-09","body":"Средний и ниже среднего, массовый. Строго 18+, аудитория 18–35 (ядро 22–28), ~70% девушки. День — офисы рядом, с 18:00 — лаунж.","order":90,"section":"passport","title":"Сегмент"},{"id":"pass-10","body":"Рязань, офисное здание напротив МТС. Рядом офисы, есть потенциал бизнес-ланчей. Точный адрес уточнить.","order":100,"section":"passport","title":"Место"},{"id":"pass-11","body":"10 декабря 2026. Перенесли с 22 ноября (решение 11.11).","order":110,"section":"passport","title":"Открытие"},{"id":"pass-12","body":"https://www.instagram.com/maori.lounge\n2 568 подписчиков на 12 ноября. В описании: «здесь будет иначе», kitchen · hookah · bar.","order":120,"section":"passport","title":"Instagram"},{"id":"pass-13","body":"Женя — руководитель проекта. Максим — дизайн, продукт, аудитория. Лиза — PR и запуск. Алёна — контент-стратегия.","order":130,"section":"passport","title":"Команда"},{"id":"pass-14","body":"Нормальность в хорошем смысле: стабильно, вкусно, сытно, красиво, недорого, понятно. Место на каждый день. В аутентичность племени не уходим.","order":45,"section":"passport","title":"Идея"},{"id":"pass-15","body":"70 посадок, включая барную стойку. 1 VIP-комната и 1 полу-VIP, в каждой — PlayStation (после открытия). Аквариум 6 м — главный фото-акцент.","order":85,"section":"passport","title":"Зал"},{"id":"pass-16","body":"Средний чек на двоих — 2 500–3 500 ₽. С 12:00 до 17:00 — скидка 25% на всё меню и комбо «мини-чаша + блюдо + напиток». После 17:00 — только кэшбэк: 3–4% для новых гостей, растёт с тратами. Меню — электронное, по ссылке и на планшете.","order":95,"section":"passport","title":"Цены и акции"},{"id":"pr-01","body":"Где и как появляется принт: людные места, радиус вокруг заведения, район МТС. Показываем владельцу на брифе.","channel":"Карта размещений","date":"2026-11-06","group":"Согласовано 6.11","order":10,"section":"pr","status":"Ушло клиенту","title":"Интерактивная карта «Леопардовый бум в Рязани»"},{"id":"pr-02","body":"Леопардовые плакаты и наклейки без названия в легальных местах (по мотивам KitKat «Phone Break», Cannes 2025: бренд узнают по объекту). Можно совместить с розыском.","channel":"Город","date":"2026-11-10","group":"Наши гипотезы","order":20,"section":"pr","status":"Оцениваем","title":"Плакаты и принты без логотипа"},{"id":"pr-03","body":"Клиент: «100%», но цветные и яркие, не ч/б. Тексты и макет — на согласование ему. «Пропажу» не делаем — скользко, делаем «разыскивается» с приметами.\n\n**Созвон команды 12.11:** объявления «Разыскивается леопард» отменили, вместо них — конкурс «Собери след» (04.12).","channel":"Город","date":"2026-11-10","group":"Согласовано 6.11","order":30,"section":"pr","status":"Отказались","title":"«Разыскивается леопард»"},{"id":"pr-04","body":"Клиент: «100%, если нормально по хулиганству». Трафарет лапки с логотипом, дату открытия НЕ пишем. Районы: Почтовая, центр, ТЦ «Малина», подходы к заведению.\n\n**Созвон команды 12.11:** следы переходят в конкурс «Собери след»: клеим у партнёров, 5 следов — депозит на кальян. Следы — хищные, не милые.","channel":"Район МТС","date":"2026-11-12","group":"Согласовано 6.11","order":40,"section":"pr","status":"Ушло клиенту","title":"Леопардовые следы до двери"},{"id":"pr-05","body":"Клиент: офисы и так придут в первые дни. Из БЦ-историй оставляем только лифты и баннеры на входе.","channel":"Офисы рядом","date":"2026-11-12","group":"Отложено","order":50,"section":"pr","status":"Отказались","title":"Леопардовый десант в бизнес-центрах"},{"id":"pr-06","body":"Амбассадоры в вузах Рязани: леопардовые детали, промокоды, приглашения на открытие.","channel":"Вузы","date":"2026-11-13","group":"Наши гипотезы","order":60,"section":"pr","status":"Оцениваем","title":"Студенческие амбассадоры"},{"id":"pr-07","body":"Посылка без объяснений: леопардовая вещь и загадочная записка. Распаковки рождают вопрос «что происходит?». Платные интеграции маркируем.","channel":"Блогеры Рязани","date":"2026-11-14","group":"Наши гипотезы","order":70,"section":"pr","status":"Оцениваем","title":"Леопардовые посылки блогерам"},{"id":"pr-08","body":"Клиент: фигурки-приглашения — «если найдём дёшево и прикольно, но сам пытался — не нашёл». Альтернатива — карточки с хорошей печатью. Леопардовый курьер для блогеров — дорого.","channel":"Город","date":"2026-11-14","group":"Отложено","order":80,"section":"pr","status":"Оцениваем","title":"Плюшевые леопарды в городе"},{"id":"pr-09","body":"Когда принт заметят, подаём историю в городские паблики и медиа как городской феномен, затем раскрываем ответ.","channel":"Городские медиа и паблики","date":"2026-11-17","group":"Наши гипотезы","order":90,"section":"pr","status":"Берём","title":"Новость «Леопардовый бум в Рязани»"},{"id":"pr-10","body":"«Если вы замечали леопарда — это мы». Приглашения гостям, партнёрам и блогерам.","channel":"Рассылка","date":"2026-11-19","group":"Наши гипотезы","order":100,"section":"pr","status":"Берём","title":"Раскрытие и приглашения на открытие"},{"id":"pr-11","body":"Часть выручки с фирменного коктейля или мерча направляем на защиту дальневосточного леопарда. Формат и партнёра проверить.","channel":"Фонд защиты леопарда","group":"Наши гипотезы","order":110,"section":"pr","status":"Оцениваем","title":"Партнёрство с проектом по защите леопардов"},{"id":"prn-01","body":"Клиент: «100% без вариантов». Максимальный реализм, популярные локации. Генерации — из рекламного бюджета.","channel":"Instagram · дёшево","date":"2026-11-12","group":"Согласовано 6.11","order":120,"section":"pr","status":"Ушло клиенту","title":"Нейровидео «Леопард гуляет по Рязани»"},{"id":"prn-02","body":"У входа/на летнике на неделю + раздача на Почтовой с запиской. Риск: шары уносят — это ок, это тоже распространение.","channel":"«Воздушный слон» · дёшево","date":"2026-11-14","group":"Согласовано 6.11","order":130,"section":"pr","status":"Ушло клиенту","title":"Леопардовые шары вместо надувной лапы"},{"id":"prn-03","body":"В шубе клиента, без раскраски лица. Шары + лёгкий вопрос прохожим 18+ → шарик/брелок. 10 взаимодействий → 3 в рилс. Идея Лизы с гримом клиенту не зашла.","channel":"Почтовая · дёшево","date":"2026-11-17","group":"Согласовано 6.11","order":140,"section":"pr","status":"Ушло клиенту","title":"Леопардовый человек"},{"id":"prn-04","body":"Свой БЦ — спрашивает владелец (лифт один и пустой, возможен отказ). БЦ «Капитал» — спрашиваем мы.","channel":"БЦ · ждём разрешения","date":"2026-11-18","group":"Согласовано 6.11","order":150,"section":"pr","status":"Ушло клиенту","title":"Леопардовый лифт"},{"id":"prn-05","body":"4 × 5 000 ₽ депозита, анимация с билетами, условие — репост рилса. У него сработало на открытии прошлого заведения. Боль — честный рандомайзер: делаем через комментарии + проверку репоста. Без «отметь друга».","channel":"Instagram · 20–25 тыс.","date":"2026-11-12","group":"Согласовано 6.11","order":160,"section":"pr","status":"Берём","title":"Розыгрыш депозитов за репост (идея клиента)"},{"id":"prn-06","body":"Две версии:\n- **Максим:** баннер с шкурой без пятен, команда каждый день доклеивает розетки (уникальные, как у настоящего леопарда) — к открытию паттерн собран, таймлапс в контент.\n- **Лиза:** прохожие сами отклеивают наклейки и открывают надпись.\nКлиент боится вандализма → рекомендуем версию Максима. Место нужно посмотреть на месте.","channel":"Входная группа / терраса","group":"Оцениваем","order":170,"section":"pr","status":"Оцениваем","title":"Баннер «Леопард проявляется»"},{"id":"prn-07","body":"Через партнёров Жени, под ключ (ролик от нас). 2 недели до + 2 после открытия. Вопросы: адреса, маркировка, допустимость рекламы лаунжа 18+ (кальяны и алкоголь не показываем). Для сравнения: Вася Ложкин на всех билбордах, потому что владельцы бара = владельцы билбордов.\n\n**Мнение владельца 11.11:** много адресов не в центре, 5 секунд мало — запомнят только принт и название. Интереснее электронные экраны «Ашана» и «Круиза» на 10–15 секунд. Ждёт от нас мнение и статистику подрядчика.\n\n**Созвон команды 12.11:** все 32 экрана цифровые — делаем на всех ролик с объёмным леопардом, который будто выходит из экрана (перспектива, «проём»), с 1 декабря. Идеи: раздирает баннер когтями; хвост закручивается в спираль-эмблему Māори. Максим делает пример и отправляет владельцу.","channel":"DOOH · 90 000 ₽/мес","group":"Оцениваем","order":180,"section":"pr","status":"Оцениваем","title":"32 городских экрана на месяц"},{"id":"prn-08","body":"Решили 10.11: вместо съёмки в вещах SkyRoom — совместный розыгрыш депозитов Māори среди покупателей SkyRoom. Сначала согласование с владельцем (task-42), потом переговоры со SkyRoom.\n\n**11.11:** владелец согласен, даёт 3 сертификата по 5 000 ₽; хочет подписки или охват — механику придумываем (task-42).","channel":"SkyRoom · бартер","group":"Оцениваем","order":190,"section":"pr","status":"Берём","title":"Коллаборация с SkyRoom: розыгрыш депозитов за покупку"},{"id":"prn-09","body":"Клиент: «мечта, но точно не сейчас». Вернуться после открытия.","channel":"дорого","group":"Отложено","order":200,"section":"pr","status":"Отказались","title":"Леопардовый автобус / обклеенная машина"},{"id":"prn-10","body":"Клиент считает самым дорогим. Опыт Twiglles: LED-дорожка Victoria Plaza на премии — около 10 000 ₽ с частичным бартером. Разово для рилса — можно вернуться.","channel":"Victoria Plaza · дорого","group":"Отложено","order":210,"section":"pr","status":"Отказались","title":"Ночная проекция леопарда на здании"},{"id":"prn-11","body":"В клубе есть группа, которая и так бегает в леопарде. Леопардовые стаканы с Ozon — клиент оплатит, организация на нас.","channel":"Клуб пробежек","date":"2026-11-29","group":"Отложено","order":220,"section":"pr","status":"Ушло клиенту","title":"Забег с группой в леопардовом — после открытия"},{"id":"prn-12","body":"Закрытые коробочки только на открытии, внутри редкий «золотой леопард» = ужин. Риск: клиент уже искал фигурки и не нашёл дешёвых и красивых.","channel":"Открытие · ₽₽","group":"Подсмотрели в 2025–2026","order":230,"section":"pr","status":"Идея","title":"Блайнд-бокс мини-леопардов (по мотивам Labubu)"},{"id":"prn-13","body":"Подсказки на объявлениях и лапках, финал — у двери заведения, приз — ужин или кальян. Можно связать с розыгрышем.","channel":"Город · ₽","group":"Классика","order":240,"section":"pr","status":"Идея","title":"Квест по точкам «бума»"},{"id":"prn-14","body":"Закрытый вечер для постоянников прошлых проектов владельца и блогеров. Формат открытия с клиентом ещё не обсуждали.","channel":"Открытие · ₽","group":"Классика","order":250,"section":"pr","status":"Идея","title":"Soft opening по приглашениям"},{"id":"prn-15","body":"Идея владельца (11.11): нейровидео, где леопард будто выпрыгивает из рамки экрана и еле в неё помещается — по мотивам известного 3D-билборда с котом в Японии. За 10–15 секунд успеваем привлечь внимание, показать адрес и промокод, по которому считаем реальные лиды. Нужно: формат и цены экранов, статистика подрядчика, промокод.\n\n**Созвон команды 12.11:** решили не ограничиваться «Ашаном» и «Круизом»: такой ролик ставим на все 32 цифровых экрана.","channel":"Экраны «Ашан» / «Круиз» · 10–15 с","group":"Оцениваем","order":250,"section":"pr","status":"Оцениваем","title":"Леопард «выпрыгивает» из экрана"},{"id":"prn-16","body":"**Опыт владельца:** готовые миксы, баночки с ингредиентами для парфюмного табака и ИИ-ассистент уже были — разваливались: персонал перестаёт объяснять, гостям лень вникать, интерес проходит, обновлять некогда.\n\n## Наша версия — «Аромат-карта Māори»\nНе сервисный ритуал, а элемент интерьера, который работает без персонала.\n- **Что это:** у кальянной стойки — открытая полка-стенд с 5 закрытыми стеклянными баночками. В каждой — ароматическая подушечка с запахом микса (сушёные фрукты, травы, специи). На крышке — номер и название.\n- **Как работает:** гость сам открывает баночку, нюхает и заказывает «№ 3». Выбор за 10 секунд, объяснять ничего не нужно — на стенде короткая карточка «Понюхайте и выберите номер».\n- **Миксы фиксированные** — постоянные рецептуры, мастеру не надо импровизировать. Названия по ассоциациям бренда: «Следы», «Тёплый остров», «Аквариум», «Хищник», «Поздний вечер».\n- **Обновление — 4 раза в год,** не постоянно: «сезонная миграция» леопарда — меняем 1–2 микса. Подушечки — раз в 2–3 недели.\n- **Почему не развалится:** держится на предмете, а не на мотивации персонала; гостю не надо вникать; редкое обновление; стенд — фото-точка и повод для сторис.\n\n## Как проверить\nПилот 1 месяц после открытия на 3 миксах. Смотрим долю заказов «по номеру» от всех кальянов и упоминания в сторис. Если ниже 10% — сворачиваем без потерь.","channel":"Продукт · зал","group":"Оцениваем","order":260,"section":"pr","status":"Оцениваем","title":"Ароматы и миксы в баночках"},{"id":"prn-17","body":"## Механика\n- **Когда:** 04.12–09.12, анонс — рилс 04.12.\n- **Где:** 5 партнёров. Предлагаем: SkyRoom, Тай спа, «Малина» + 2 места на Почтовой (кофейня, барбершоп) — договориться.\n- **Что у партнёра:** хищный след (когти, принт, маленький логотип) на витрине или стекле у входа и карточка «Вы нашли след Лео. Соберите все пять — @maori.lounge».\n- **Правила:** найти 5 следов, сфотографироваться у каждого и прислать 5 фото в директ Māори. Первые трое, кто соберёт все пять, получают депозит на кальян. Номинал согласуем с владельцем.\n- **Сторис-подсказки, одна в день:**\n  - 04.12 — «Где одеваются в принт» (SkyRoom)\n  - 05.12 — «Где расслабляют не только кальяном» (Тай спа)\n  - 06.12 — «Самое ягодное место» («Малина»)\n  - 07.12 и 08.12 — подсказки к местам на Почтовой\n  - 09.12 — итоги.\n- **Партнёрам взамен:** отметки в рилсе и сторис, трафик участников; партнёры репостят рилс.\n- **Тон:** «следы», а не «лапки»; «депозит», а не «бесплатно».\n\n## Текст анонса\n«Наш Лео оставил следы по городу. Найдите все пять, сфотографируйтесь с каждым и пришлите нам — трое первых получат депозит на кальян в Māори. Подсказки — каждый день в сторис.»\n\n## Риски\nСледы снимают — печатаем запас и проверяем раз в день. Честность — принимаем только фото с отметкой времени после 04.12.","channel":"Партнёры · 04.12","group":"Наши гипотезы","order":270,"section":"pr","status":"Берём","title":"Конкурс «Собери след»"},{"id":"prn-18","body":"## Идея\nВ аквариум — несколько леопардовых рыбок (существуют, около 700 ₽ за штуку). Вид и совместимость с нынешними рыбами подтверждает аквариумист.\n\n## Механика «Часы кормления»\n- **Когда:** будни, 15:00–17:00 — слабое время, совпадает с концом дневной скидки.\n- **Как:** на столах карточка «У Māори живут леопардовые рыбки. С 15 до 17 их можно покормить — попросите официанта». Официант приносит маленькую баночку с порцией корма; гость кормит и загадывает желание.\n- **Ограничения:** корм только через официанта, порции маленькие, не больше нескольких кормлений в час — чтобы не перекормить рыб.\n\n## Зачем\nПовод прийти днём, микродеталь, из которой складывается бренд, и бесконечный контент: сторис «рыбки поели — желание загадано», фото у аквариума.\n\n## Что нужно\nСогласие владельца, рыбки, корм, баночки и карточки. Можно дать рыбкам имена вместе с подписчиками.","channel":"Аквариум · зал","group":"Наши гипотезы","order":280,"section":"pr","status":"Оцениваем","title":"Леопардовые рыбки и часы кормления"},{"id":"prn-19","body":"Идея с созвона 12.11: в приглашении блогерам — личный мундштук с леопардовой деталью и логотипом Māори, который можно носить и приходить с ним курить. Ценный подарок для тех, кто курит кальян. Узнать у владельца, где делают и сколько стоит.","channel":"Блогеры · рассылка 03.12","group":"Наши гипотезы","order":290,"section":"pr","status":"Оцениваем","title":"Брендированный мундштук Māори в подарок блогерам"},{"id":"prn-20","body":"Владелец говорил, что такие будут. Спросить, как будут выглядеть (как на референсе в металлических формах или иначе) — чтобы строить на них часть PR.","channel":"Меню","group":"Наши гипотезы","order":300,"section":"pr","status":"Оцениваем","title":"Леопардовые десерты"},{"id":"st-01","body":"Черновик SWOT уже есть в нашем анализе бренда — перенести и уточнить по итогам созвона.","group":"1. Компания","order":10,"owner":"Женя","section":"strategy","status":"В работе","title":"Общая информация о компании и SWOT"},{"id":"st-02","body":"Владелец — Максим. Без темы прошлого бизнеса.","group":"1. Компания","order":20,"owner":"Женя","section":"strategy","status":"В работе","title":"Об основателях и сотрудниках"},{"id":"st-03","group":"1. Компания","order":30,"owner":"Женя","section":"strategy","status":"Не начато","title":"Цели, планы, видение"},{"id":"st-04","group":"2. Услуги","order":40,"owner":"Максим","section":"strategy","status":"Не начато","title":"Описание и специфика: кухня, бар, кальяны, зал"},{"id":"st-05","group":"2. Услуги","order":50,"owner":"Максим","section":"strategy","status":"Не начато","title":"Качество, гарантии, стоимость (средний чек)"},{"id":"st-06","body":"Первая версия — в разделе «GAP-анализ» → «Конкуренты»: 7 кальянных и дневной рынок ланчей, по отзывам 2ГИС. Дополнить до 10–20 показателей: чек, кальян, кухня, часы работы, соцсети.","group":"3. Конкуренты","order":60,"owner":"Максим","section":"strategy","status":"В работе","title":"Сравнительная таблица конкурентов Рязани по 10–20 показателям"},{"id":"st-07","group":"3. Конкуренты","order":70,"owner":"Алёна","section":"strategy","status":"Не начато","title":"Оценка соцсетей конкурентов (хорошие/средние/слабые) и ER"},{"id":"st-08","body":"Черновик — в разделе «GAP-анализ»: 10 разрывов, продуктовая отстройка и приоритеты. Нужны решения владельца по пунктам с ⚠️.","group":"4. Преимущества","order":80,"owner":"Максим","section":"strategy","status":"В работе","title":"Преимущества и недостатки Māори"},{"id":"st-09","group":"5. Текущая реклама","order":90,"owner":"Алёна","section":"strategy","status":"Не начато","title":"Источники трафика и срез статистики Instagram (2 574 подписчика на 4 ноября)"},{"id":"st-10","body":"Готов черновик: 7 JTBD-сегментов с доказательствами (раздел «JTBD-сегменты») и путь гостя (раздел «CJM: путь гостя»). Дальше — 10 интервью и опрос в соседних БЦ.","group":"6. Аудитория","order":100,"owner":"Максим","section":"strategy","status":"В работе","title":"Целевая аудитория и путь клиента до покупки"},{"id":"st-11","body":"Опора: легенда «Леопард на острове» и словарь смыслов из базы знаний.","group":"7. Смыслы","order":110,"owner":"Максим","section":"strategy","status":"В работе","title":"Концепция и офферы (сложение + смысл + доказательство)"},{"id":"st-12","group":"8. Финансы","order":120,"owner":"Женя","section":"strategy","status":"Не начато","title":"Ёмкость рынка, финплан, система скидок"},{"id":"st-13","group":"9. Стратегия продвижения","order":130,"owner":"Лиза","section":"strategy","status":"В работе","title":"Позиционирование и «Леопардовый бум»"},{"id":"st-14","group":"9. Стратегия продвижения","order":140,"owner":"Алёна","section":"strategy","status":"Не начато","title":"Требования к соцсетям, обработка заявок, работа с отзывами"},{"id":"st-15","group":"10. План","order":150,"owner":"Женя","section":"strategy","status":"Не начато","title":"Пошаговый план работ на месяц / полгода с целями"},{"id":"task-01","body":"Первая версия: паспорт, бриф, база знаний, разделы для PR, контента, ивентов и отзывов. Дальше пополняем.","date":"2026-11-04","order":10,"owner":"Максим","section":"tasks","status":"Готово","title":"Собрать пульт проекта и карту бренда"},{"id":"task-02","body":"Решили: стратегию по шаблону делаем после открытия. База — этот пульт.","date":"2026-11-05","order":20,"owner":"Женя","section":"tasks","status":"Готово","title":"Прислать команде шаблон стратегии"},{"id":"task-03","body":"Без ограничений по бюджету. Где и как в Рязани появляется леопардовый принт: плакаты, принты, графика, игрушки, объекты в людных местах. Идеи складываем в PR-план.","date":"2026-11-05","order":30,"owner":"Вся команда","section":"tasks","status":"Готово","title":"Накидать идеи для «Леопардового бума»"},{"id":"task-04","body":"Черновик уже в разделе «Первый бриф». После шаблона сверяем и дополняем.","date":"2026-11-05","order":40,"owner":"Вся команда","section":"tasks","status":"Готово","title":"Составить вопросы к владельцу по шаблону стратегии"},{"id":"task-05","body":"Всё собрано в разделе «База: маори и леопард».","date":"2026-11-05","order":50,"owner":"Вся команда","section":"tasks","status":"Готово","title":"Изучить маори, Полинезию и леопарда"},{"id":"task-06","body":"Пятница, 6 ноября, ориентировочно 13:00–15:00 по Москве.","date":"2026-11-05","order":60,"owner":"Женя","section":"tasks","status":"Готово","title":"Назначить созвон с владельцем на пятницу"},{"id":"task-07","body":"Логотип SVG/PNG получен 11.11, мудборд — в общем чате.","date":"2026-11-09","order":70,"owner":"Максим","section":"tasks","status":"Готово","title":"Запросить у клиента логотип SVG/PNG и мудборд"},{"id":"task-08","body":"Показали на созвоне 6.11 — итоги в «Идеях Леопардового бума».","date":"2026-11-06","order":80,"owner":"Лиза","section":"tasks","status":"Готово","title":"Интерактивная карта «Леопардовый бум в Рязани»"},{"id":"task-09","date":"2026-11-06","order":90,"owner":"Женя","section":"tasks","status":"Готово","title":"Провести первый бриф с владельцем"},{"id":"task-10","body":"Этап 2. Основа — пульт + исследование реальных гостей. Чек-лист — в «Стратегии по КП».","date":"2026-12-20","order":100,"owner":"Женя","section":"tasks","status":"Сделать","title":"Стратегия по шаблону КП (после открытия)"},{"id":"task-11","body":"Постинг стартует на неделе с 9.11. Первое — карусель «в движении» и нейровидео леопарда. Сторис — Алёна, вт/чт.","date":"2026-11-08","order":110,"owner":"Алёна","section":"tasks","status":"В работе","title":"Контент-стратегия прогрева без показа стройки"},{"id":"task-12","body":"После открытия, на реальных гостях. Уже известно: 70/30 девушки, 18–35, ядро 22–28, два режима дня.","date":"2026-12-25","order":120,"owner":"Максим","section":"tasks","status":"Сделать","title":"Проверить гипотезы по аудитории"},{"id":"task-13","body":"Связать леопарда, остров, аквариум и зелень в одну систему для контента и PR.","date":"2026-11-10","order":130,"owner":"Максим","section":"tasks","status":"В работе","title":"Единая визуальная история бренда"},{"id":"task-14","body":"Старт — вместе с нейровидео «Леопард гуляет по Рязани» (task-24, по контент-плану — 11.11). Если публикация сдвигается, сдвигается и запуск.\n\n**Созвон команды 12.11:** старт бума — с ИИ-серии 16.11.","date":"2026-11-16","order":140,"owner":"Лиза","section":"tasks","status":"В работе","title":"Запуск «Леопардового бума» в городе"},{"id":"task-15","body":"Сначала обсудить с Максимом: формат открытия, кого зовём, сколько человек вмещает зал. Дату задачи пока не меняем.","date":"2026-11-12","order":150,"owner":"Лиза","section":"tasks","status":"Сделать","title":"План открытия: список гостей, приглашения, рассылка"},{"id":"task-16","date":"2026-12-10","order":160,"owner":"Вся команда","section":"tasks","status":"Сде
